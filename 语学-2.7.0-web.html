  // ---------------------------------------------------------------- mount
  function mount(view) {
    U.clear(view);
    view.appendChild(topBar());
    feedEl = U.h('div', { class: 'feed' });
    view.appendChild(feedEl);

    // 滚动处理分两段：
    //   1) 滚动中的轻活：只记一下光标，别的什么都不做 —— 一边滚一边删卡/重建末尾卡
    //      会让题目闪烁、吸附位置跳掉；
    //   2) 停下来（180ms）之后的整理：清理划过去的题、回收旧卡、刷新末尾卡。
    var lastCursor = -1;
    // 手指是否还按在屏幕上（含惯性滑动阶段），以及上一次看到的滚动位置
    var touching = false, lastTop = -1;

    function scheduleSettle(ms) {
      if (settleTimer) clearTimeout(settleTimer);
      settleTimer = setTimeout(settle, ms);
    }

    feedEl.addEventListener('scroll', U.debounce(function () {
      var cur = cursorIndex();
      if (cur !== lastCursor) { lastCursor = cur; DB.state.feed.cursor = cur; DB.save(); }
      scheduleSettle(180);
    }, 90));

    feedEl.addEventListener('touchstart', function () { touching = true; }, { passive: true });
    feedEl.addEventListener('touchend', function () { touching = false; scheduleSettle(160); }, { passive: true });
    feedEl.addEventListener('touchcancel', function () { touching = false; scheduleSettle(160); }, { passive: true });
    // 桌面 / 预览环境用鼠标滚轮时没有 touch 事件
    feedEl.addEventListener('pointerdown', function () { touching = true; }, { passive: true });
    feedEl.addEventListener('pointerup', function () { touching = false; scheduleSettle(160); }, { passive: true });
    feedEl.addEventListener('pointercancel', function () { touching = false; scheduleSettle(160); }, { passive: true });

    // 用户停稳之后才做的整理工作
    function settle() {
      settleTimer = null;
      if (!feedEl) return;
      // 手指还在屏幕上、或者画面还在动（惯性滑动常常超过 180ms）时不做删除：
      // 这时候删卡片会让内容高度和 scrollTop 在手指底下突变，
      // 表现就是「刚往下滑，画面自己跳回上面那道没做的题」。等真正停稳再来。
      if (touching || Math.abs(feedEl.scrollTop - lastTop) > 1) {
        lastTop = feedEl.scrollTop;
        scheduleSettle(140);
        return;
      }
      sweepSkipped();
      trim();
      updateTail();
      if (remaining() <= Math.max(2, Math.floor(batch() / 2))) prefetch();
    }

    getSource();
    ensureTail();
    if (!AI.ready()) SRC.ai.state = 'offline';
    var cur = DB.state.current;
    if (cur && !cur.endedAt && Date.now() - (cur.lastAt || cur.startedAt) < 3 * 3600e3) session = cur;
    else session = DB.startSession(getSource(), getSource().label);

    // 记忆：先恢复上次没做完的题
    var resume = restorableQueue();
    if (resume.length) {
      appendCards(resume);
      if (remaining() <= Math.max(1, Math.floor(batch() / 2))) prefetch(true);
    } else {
      prefetch(true);
    }
    updateBadge();
    SRC.warmUp();
    setTimeout(updateBadge, 3000);
    // 每分钟重试一次：接口通了就换回在线出题，掉线了也自动恢复
    if (aiTimer) clearInterval(aiTimer);
    aiTimer = setInterval(tickAI, 60000);
    if (aiTimer && aiTimer.unref) aiTimer.unref();   // 仅测试环境有效：别让定时器吊住 node 进程
  }

  function onShow() {
    if (!feedEl) return;
    if (!list.length) prefetch(true);
    updateBadge();
  }

  /** 队列里是否已经有 AI 出的题（用来判断要不要补一批）。 */
  function hasAiCards() {
    for (var i = 0; i < list.length; i++) {
      var q = list[i].q;
      if (q && q.fromAI && list[i].state === 'idle') return true;
    }
    return false;
  }

  var boosting = false;

  /**
   * 刚连上 AI：把 AI 出的题插到当前卡后面，用户立刻就能刷到 AI 题。
   * kickUpgrade 的成功路径已经插过题了，这里只处理「探测成功但还没 AI 题」的情况。
   */
  function boostAI() {
    if (seedMode) return;                        // 定题模式：别往专项练习里插题
    if (boosting || !feedEl || SRC.aiOnline() === false) return;
    if (hasAiCards()) return;
    boosting = true;
    var n = batch();
    var epoch = genEpoch;
    var spec = specFor(n);
    spec.recoWhy = spec.recoWhy || '刚连上';
    SRC.fetch(spec, n, seenStems.concat(DB.state.chopped), { preferInstant: false }).then(function (res) {
      if (epoch !== genEpoch) return;
      var qs = (res.questions || []).filter(function (q) { return q && q.stem && q.fromAI; });
      if (qs.length) prependQuestions(qs);
    }).catch(function () { /* 静默：仍在离线题上刷，不影响用户 */ })
      .then(function () { boosting = false; });
  }

  /** AI 状态变化时刷新徽标，并尽量补一批 AI 题进来 */
  function onSourceChange() {
    updateBadge();
    if (SRC.aiOnline()) {
      U.toast('接口已连上，接下来用 AI 出题', 'ok', 1800);
      boostAI();
    }
  }

  /** 每分钟一次：离线就重试接口，在线就把题目补满。 */
  function tickAI() {
    if (!AI.ready()) return;
    if (seedMode) return;                        // 定题模式：这一轮不补题
    if (!SRC.aiOnline()) {
      if (typeof SRC.probe === 'function') SRC.probe(true);
      return;
    }
    if (App.cur === 'home' && !loading && remaining() < batch()) prefetch();
  }

  w.Feed = {
    mount: mount, onShow: onShow, restart: restart,
    /** 从题库/学情/我的跳转过来开刷；带 questions 时是定题模式（错题重练等），不会被 AI 题混入。 */
    launch: function (src, questions) {
      App.tab('home');
      if (questions && questions.length) seedQuestions(questions, src);
      else { setSource(src); restart(); }
      return seedMode;
    },
    /** 直接用一组题目开一轮（定题模式），返回实际铺开的题目数 */
    seed: seedQuestions,
    seedMode: function () { return seedMode; },
    startWrongDrill: startWrongDrill, startWeakDrill: startWeakDrill,
    getSource: getSource, setSource: setSource, onSourceChange: onSourceChange, boostAI: boostAI,
    updateBadge: updateBadge, sourceStatusSheet: sourceStatusSheet, sourceSheet: sourceSheet,
    prependQuestions: prependQuestions, insertCards: insertCards,
    cursor: cursorIndex, count: function () { return list.length; },
    remaining: remaining, isChopped: function (q) { return DB.isChopped(q); },
    deferredCount: function () { return deferred.length; },
    /** 当前这一轮的代际：用于丢弃过期的出题响应 */
    epoch: function () { return genEpoch; },
    tickAI: tickAI, redoNow: redoNow, readCard: readCard
  };
})(window);

</script>
<script>
/* ===== bank.js ===== */
/* 语学 — 题库：知识点分类、主流/自定义建库、离线缓存、一键补充（并行加速）、举一反三。 */
(function (w) {
  'use strict';

  var T = w.YX_TAXONOMY || { version: 0, stages: [], points: [], exams: [] };
  var byId = {};
  (T.points || []).forEach(function (p) { byId[p.id] = p; });

  var STAGE_ICON = { primary: 'backpack', junior: 'book', senior: 'library', college: 'graduation', postgrad: 'microscope' };

  var TAX = {
    raw: T,
    ok: !!(T.points && T.points.length),
    stages: function () { return T.stages || []; },
    stage: function (id) { var s = T.stages || []; for (var i = 0; i < s.length; i++) if (s[i].id === id) return s[i]; return null; },
    grades: function (stageId) { var s = TAX.stage(stageId); return s ? (s.grades || []) : []; },
    gradeName: function (stageId, gradeId) { var g = TAX.grades(stageId); for (var i = 0; i < g.length; i++) if (g[i].id === gradeId) return g[i].name; return ''; },
    subjects: function (stageId, gradeId) {
      var g = TAX.grades(stageId);
      for (var i = 0; i < g.length; i++) if (g[i].id === gradeId) return g[i].subjects || [];
      return [];
    },
    stageOf: function (stageId) { var s = TAX.stage(stageId); return s ? s.name : ''; },
    stageByName: function (name) { var s = TAX.stages(); for (var i = 0; i < s.length; i++) if (s[i].name === name) return s[i]; return null; },
    points: function () { return T.points || []; },
    byId: function (id) { return byId[id] || null; },
    pointsOf: function (stageId, gradeId, subject) {
      return (T.points || []).filter(function (p) {
        if (stageId && p.stage !== stageId) return false;
        if (gradeId && p.grade !== gradeId) return false;
        if (subject && p.subject !== subject) return false;
        return true;
      });
    },
    search: function (kw, limit) {
      kw = String(kw || '').trim().toLowerCase();
      if (!kw) return [];
      var out = [], all = T.points || [];
      for (var i = 0; i < all.length; i++) {
        var p = all[i];
        if ((p.name || '').toLowerCase().indexOf(kw) >= 0 ||
          (p.keywords || '').toLowerCase().indexOf(kw) >= 0 ||
          (p.subject || '').toLowerCase().indexOf(kw) >= 0) {
          out.push(p);
          if (out.length >= (limit || 80)) break;
        }
      }
      return out;
    },
    exams: function () { return T.exams || []; },
    exam: function (id) { var e = T.exams || []; for (var i = 0; i < e.length; i++) if (e[i].id === id) return e[i]; return null; },
    examPoints: function (exam) {
      if (!exam) return [];
      return (exam.pointIds || []).map(function (id) { return TAX.byId(id); }).filter(Boolean);
    },
    /** 某个科目在各年级下的知识点分布，用于"分类更清晰"的展示 */
    subjectTree: function (stageId) {
      var out = [];
      TAX.grades(stageId).forEach(function (g) {
        (g.subjects || []).forEach(function (sub) {
          var n = TAX.pointsOf(stageId, g.id, sub).length;
          if (n) out.push({ gradeId: g.id, grade: g.name, subject: sub, count: n });
        });
      });
      return out;
    },
    randomPoints: function (n) {
      n = n || 3;
      var prof = DB.state.profile || {};
      var all = T.points || [];
      if (!all.length) return [];
      var st = TAX.stageByName(prof.stage);
      var pool = st ? all.filter(function (p) { return p.stage === st.id; }) : all;
      if (pool.length < n) pool = all;
      var out = [], used = {};
      for (var i = 0; i < n * 5 && out.length < n; i++) {
        var p = pool[Math.floor(Math.random() * pool.length)];
        if (!p || used[p.id]) continue;
        used[p.id] = 1;
        out.push(toPt(p));
      }
      return out;
    },
    count: function () { return (T.points || []).length; }
  };

  function toPt(p) {
    return {
      id: p.id, name: p.name, keywords: p.keywords || '', sample: p.sample || '',
      subject: p.subject || '', stage: TAX.stageOf(p.stage), stageId: p.stage,
      grade: TAX.gradeName(p.stage, p.grade), gradeId: p.grade, difficulty: p.difficulty || 3
    };
  }
  TAX.toPt = toPt;

  // ================================================================ Bank
  var Bank = {};

  Bank.list = function () { return DB.state.banks; };
  Bank.get = function (id) {
    var bs = DB.state.banks;
    for (var i = 0; i < bs.length; i++) if (bs[i].id === id) return bs[i];
    return null;
  };

  Bank.pointsOf = function (b) {
    if (!b) return [];
    var out = [];
    (b.pointIds || []).forEach(function (id) { var p = TAX.byId(id); if (p) out.push(toPt(p)); });
    (b.points || []).forEach(function (p) { out.push(p); });
    if (!out.length) {
      out.push({ name: b.name, subject: b.subject || '', stage: b.stage || '', grade: b.grade || '', keywords: b.desc || '', sample: b.examples || '' });
    }
    return out;
  };

  Bank.create = function (data) {
    var b = {
      id: U.uid('bank'), name: data.name || '未命名题库', subject: data.subject || '', stage: data.stage || '',
      grade: data.grade || '', kind: data.kind || 'custom', desc: data.desc || '', examples: data.examples || '',
      pointIds: data.pointIds || [], points: data.points || [], cached: [],
      cacheMeta: null, createdAt: Date.now(), isDefault: data.isDefault || false
    };
    DB.state.banks.unshift(b);
    if (b.isDefault || DB.state.banks.length === 1) Bank.setDefault(b.id, false);
    DB.save();
    return b;
  };

  Bank.remove = function (id) {
    var bs = DB.state.banks;
    for (var i = 0; i < bs.length; i++) if (bs[i].id === id) { bs.splice(i, 1); break; }
    // 删掉的正好是默认题库时，把标记让给下一个，否则所有卡片的「首页默认」标记
    // 会一起消失，用户再也看不出首页默认是哪一个。
    if (bs.length && !bs.some(function (b) { return b.isDefault; })) bs[0].isDefault = true;
    DB.save();
    if (DB.state.feed.source && DB.state.feed.source.bankId === id) {
      // 要经 Feed.setSource：只改 DB.state 的话，刷题页左上角标签还停在
      // 已经删掉的题库名上，直到用户重新开一轮才更新。
      if (w.Feed && w.Feed.setSource) w.Feed.setSource({ type: 'recommend', label: '默认推荐' });
      else DB.state.feed.source = { type: 'recommend', label: '默认推荐' };
    }
  };

  /**
   * 标记默认题库。explicit=true（用户在题库菜单里点「设为首页默认」）时才会把
   * 首页出题范围切到这个题库；建库时只是打个标记，首页仍走「默认推荐」。
   */
  Bank.setDefault = function (id, explicit) {
    DB.state.banks.forEach(function (b) { b.isDefault = b.id === id; });
    var b = Bank.get(id);
    if (b && explicit) DB.state.feed.source = { type: 'bank', bankId: b.id, label: b.name };
    DB.save();
  };

  Bank.update = function (id, patch) {
    var b = Bank.get(id);
    if (!b) return null;
    for (var k in patch) if (Object.prototype.hasOwnProperty.call(patch, k)) b[k] = patch[k];
    DB.save();
    return b;
  };

  /** 生成题目规格（供 AI 与补充共用） */
  function specOf(bank, n) {
    var pts = Bank.pointsOf(bank);
    var g = DB.settings().gen;
    return {
      stage: bank.stage || (pts[0] && pts[0].stage) || '',
      grade: bank.grade || (pts[0] && pts[0].grade) || '',
      subject: bank.subject || (pts[0] && pts[0].subject) || '',
      points: pts, difficulty: g.difficulty, label: bank.name,
      count: n
    };
  }

  /**
   * 一键补充题目：并发请求，速度约为串行的 concurrent 倍。
   * 模型常常一次给不满要求的题量，因此按"波"循环补足，直到达到目标题数。
   * onProgress(done, total)；返回生成的题目数组。
   */
  Bank.fill = function (bank, count, onProgress) {
    var g = DB.settings().gen;
    var conc = U.clamp(U.num(g.concurrent, 3), 1, 4);
    var per = Math.max(1, Math.ceil(count / conc));
    var got = [], waves = 0, stall = 0, failures = 0;
    var maxWaves = Math.min(count, 20) + 3;

    function report() { if (onProgress) onProgress(got.length, count); }

    function fetchN(n) {
      var spec = specOf(bank, n);
      spec.avoid = got.slice(-12).map(function (q) { return q.stem; });
      return AI.genQuestions(spec, n).then(function (qs) {
        qs.forEach(function (q) { q.bankId = bank.id; q.bankLabel = bank.name; });
        got = got.concat(qs);
        bank.cached = (bank.cached || []).concat(qs);
        if (bank.cached.length > 400) bank.cached.splice(0, bank.cached.length - 400);
        DB.save();
        report();
        return qs;
      }).catch(function (e) {
        failures++;
        if (!got.length && failures >= conc) throw e;
        return [];
      });
    }

    return new Promise(function (resolve, reject) {
      function wave() {
        if (got.length >= count || stall >= 2 || waves >= maxWaves) return Promise.resolve();
        waves++;
        var want = count - got.length;
        var jobs = [];
        for (var i = 0; i < conc && want > 0; i++) {
          var take = Math.min(per, want);
          want -= take;
          jobs.push(fetchN(take));
        }
        var before = got.length;
        return Promise.all(jobs).then(function () {
          if (got.length === before) stall++; else stall = 0;
          return wave();
        });
      }
      wave().then(function () {
        if (!got.length) reject(new Error('生成失败，请检查 AI 设置'));
        else resolve(got);
      }).catch(function (e) {
        if (got.length) resolve(got); else reject(e);
      });
    });
  };

  /** 旧接口名保留：等价于 Bank.fill */
  Bank.generateCache = function (bank, count, onProgress) { return Bank.fill(bank, count, onProgress); };

  // ================================================================ 知识点选择器
  /**
   * 多选知识点。opts:{title, preselect, single, onDone(picked, mode)}
   * 分类：学段 → 年级 → 科目 → 知识点（支持搜索 + 分组）。
   */
  function picker(opts) {
    opts = opts || {};
    var sel = {};
    (opts.preselect || []).forEach(function (p) { if (p.id) sel[p.id] = p; });
    var st = { stage: (opts.preselect && opts.preselect[0] && opts.preselect[0].stageId) || 'primary', grade: null, subject: null, kw: '' };

    var body = U.h('div');
    var listBox = U.h('div');
    var search = U.input('', '搜索知识点，如：一元二次方程 / 牛顿', {});
    search.addEventListener('input', U.debounce(function () { st.kw = search.value; renderList(); }, 200));
    var bar = U.h('div', { class: 'grow' });

    function picked() { return Object.keys(sel).map(function (k) { return sel[k]; }); }
    function refreshBar() {
      U.clear(bar);
      bar.appendChild(U.h('div', { class: 'grow small', html: '已选 <b>' + picked().length + '</b> 个知识点' }));
      if (picked().length) {
        bar.appendChild(U.h('button', { class: 'chip', text: '清空', onclick: function () { sel = {}; renderAll(); } }));
      }
      var b = U.h('button', { class: 'btn primary sm', text: '下一步' });
      b.addEventListener('click', function () {
        if (!picked().length) { U.toast('请至少选择一个知识点'); return; }
        sh.close();
        if (opts.onDone) opts.onDone(picked());
      });
      bar.appendChild(b);
    }

    function stagePills() {
      var pill = U.h('div', { class: 'stage-pill mb12' });
      TAX.stages().forEach(function (s) {
        var b = U.h('button', { class: st.stage === s.id ? 'on' : '', text: s.name });
        b.addEventListener('click', function () { st.stage = s.id; st.grade = null; st.subject = null; renderAll(); });
        pill.appendChild(b);
      });
      return pill;
    }
    function chipsOf(items, cur, onPick) {
      var wrap = U.h('div', { class: 'chips scroll mb12' });
      items.forEach(function (it) {
        var c = U.h('button', { class: 'chip' + (cur === it.id ? ' on' : ''), text: it.name + (it.n != null ? ' ' + it.n : '') });
        c.addEventListener('click', function () { onPick(it); });
        wrap.appendChild(c);
      });
      wrap.appendChild(U.h('div', { style: { width: '1px' } }));
      return wrap;
    }

    function renderList() {
      U.clear(listBox);
      var pts;
      if (st.kw) {
        pts = TAX.search(st.kw, 120);
        if (!pts.length) { listBox.appendChild(U.h('div', { class: 'empty' }, U.h('div', { class: 'e-t', text: '没有匹配的知识点' }))); return; }
      } else {
        pts = TAX.pointsOf(st.stage, st.grade, st.subject);
      }
      // 分组：按 年级 · 科目
      var groups = {}, order = [];
      pts.slice(0, 400).forEach(function (p) {
        var k = TAX.gradeName(p.stage, p.grade) + ' · ' + p.subject;
        if (!groups[k]) { groups[k] = []; order.push(k); }
        groups[k].push(p);
      });
      listBox.appendChild(U.h('div', { class: 'tiny muted mb8', text: '共 ' + pts.length + ' 个知识点，' + order.length + ' 个分类' + (st.kw ? '（搜索结果）' : '') }));
      order.slice(0, 30).forEach(function (k) {
        var g = U.h('div', { class: 'kp-group' });
        var head = U.h('div', { class: 'kg-h' }, U.h('span', { text: k + '（' + groups[k].length + '）' }), U.h('span', { class: 'line' }));
        var all = U.h('button', { class: 'chip', text: '全选' });
        all.addEventListener('click', function () {
          var on = groups[k].some(function (p) { return !sel[p.id]; });
          groups[k].forEach(function (p) { if (on) sel[p.id] = toPt(p); else delete sel[p.id]; });
          renderList(); refreshBar();
        });
        head.appendChild(all);
        g.appendChild(head);
        groups[k].forEach(function (p) { g.appendChild(kpRow(p)); });
        listBox.appendChild(g);
      });
    }

    function kpRow(p) {
      var on = !!sel[p.id];
      var row = U.h('div', { class: 'kp' + (on ? ' on' : '') },
        U.h('div', { class: 'ck', html: ICON('check', 13) }),
        U.h('div', { class: 'grow' },
          U.h('div', { class: 'nm', text: p.name }),
          U.h('div', { class: 'kw', text: [TAX.gradeName(p.stage, p.grade), p.subject, p.keywords].filter(Boolean).join(' · ') })
        )
      );
      row.addEventListener('click', function () {
        if (opts.single) sel = {};
        if (sel[p.id]) delete sel[p.id]; else sel[p.id] = toPt(p);
        renderList(); refreshBar();
      });
      return row;
    }

    function renderAll() {
      U.clear(body);
      body.appendChild(stagePills());
      body.appendChild(chipsOf(TAX.grades(st.stage).map(function (g) {
        return { id: g.id, name: g.name, n: TAX.pointsOf(st.stage, g.id).length };
      }), st.grade, function (it) { st.grade = st.grade === it.id ? null : it.id; st.subject = null; renderAll(); }));
      var subs = TAX.subjects(st.stage, st.grade);
      if (!subs.length && !st.grade) {
        var seen = {};
        TAX.grades(st.stage).forEach(function (g) { (g.subjects || []).forEach(function (s) { seen[s] = 1; }); });
        subs = Object.keys(seen);
      }
      body.appendChild(chipsOf(subs.map(function (s) {
        return { id: s, name: s, n: TAX.pointsOf(st.stage, st.grade, s).length };
      }), st.subject, function (it) { st.subject = st.subject === it.id ? null : it.id; renderAll(); }));
      body.appendChild(U.h('div', { class: 'mb12' }, search));
      body.appendChild(listBox);
      body.appendChild(U.h('div', { style: { height: '8px' } }));
      renderList();
      refreshBar();
    }

    var sh = U.sheet({ title: opts.title || '选择知识点', body: body, page: true, footer: bar });
    renderAll();
    return sh;
  }

  // ================================================================ 建库流程
  /** 创建后的确认：创建题库并刷题 / 仅创建 */
  function confirmCreate(cfg) {
    var name = U.input(cfg.name || '', '题库名称');
    var body = U.h('div');
    body.appendChild(U.h('div', { class: 'hintbox', text: '建好后随时可以补题，也可以设为首页默认。' }));
    body.appendChild(U.field('题库名称', name));
    body.appendChild(U.h('div', { class: 'card' },
      U.h('div', { class: 'kv' }, U.h('span', { class: 'k', text: '科目' }), U.h('span', { class: 'v', text: cfg.subject || '综合' })),
      U.h('div', { class: 'kv' }, U.h('span', { class: 'k', text: '学段 / 年级' }), U.h('span', { class: 'v', text: [cfg.stage, cfg.grade].filter(Boolean).join(' · ') || '—' })),

  /** bankId -> true：同一个题库同时只允许一次补充，避免连点把请求和题目都翻倍 */
  var filling = {};

  function doFill(bank, count, onDone) {
    if (filling[bank.id]) { U.toast('这个题库正在补充中，稍等一下'); return; }
    if (!AI.ready()) { U.toast('请先在设置中配置 AI 接口', 'bad'); Profile.openSettings('ai'); return; }
    filling[bank.id] = true;
    var card = U.$('[data-bank="' + bank.id + '"] .fill-progress');
    if (card) { card.classList.remove('hidden'); }
    U.toast('正在生成 ' + count + ' 道题…', null, 1600);
    t0 = Date.now();
    Bank.fill(bank, count, function (done, total) {
      var el = U.$('[data-bank="' + bank.id + '"] .fill-progress');
      if (el) {
        var bar = el.querySelector('.bar i');
        if (bar) bar.style.width = U.pct(done, total) + '%';
        var t = el.querySelector('.fp-t');
        if (t) t.textContent = '已生成 ' + done + ' / ' + total;
      }
    }).then(function (qs) {
      delete filling[bank.id];
      bank.cacheMeta = { updated: Date.now(), count: (bank.cached || []).length };
      DB.save();
      var secs = ((Date.now() - t0) / 1000).toFixed(1);
      U.toast('已补充 ' + qs.length + ' 道题（用时 ' + secs + 's）', 'ok', 2600);
      render();
      if (onDone) onDone(qs);
    }).catch(function (e) {
      delete filling[bank.id];
      U.toast('生成失败：' + (e.message || e), 'bad', 3000);
      render();
    });
  }
  var t0 = 0;

  /** 一键给所有题库各补 gen.batch 道题（串行，避免把接口打爆）。 */
  function fillAll() {
    if (!AI.ready()) { U.toast('请先在设置中配置 AI 接口', 'bad'); Profile.openSettings('ai'); return; }
    var bs = Bank.list();
    if (!bs.length) return;
    var n = Math.max(1, DB.settings().gen.batch || 3);
    U.confirm('一键补充全部题库',
      '为 ' + bs.length + ' 个题库各补 ' + n + ' 题，共约 ' + (bs.length * n) + ' 题。\n' +
      '依次生成，需要一点时间；中途可以继续用其它页面。', '开始生成').then(function (ok) {
      if (!ok) return;
      var i = 0, added = 0, failed = 0;
      function next() {
        if (i >= bs.length) {
          DB.save();
          render();
          U.toast('补充完成：新增 ' + added + ' 题' + (failed ? '，' + failed + ' 个题库失败' : ''), failed ? 'bad' : 'ok', 3000);
          return;
        }
        var b = bs[i++];
        U.toast('(' + i + '/' + bs.length + ') 正在补充「' + b.name + '」…', null, 1600);
        Bank.fill(b, n).then(function (qs) {
          added += (qs || []).length;
          b.cacheMeta = { updated: Date.now(), count: (b.cached || []).length };
          next();
        }).catch(function () { failed++; next(); });
      }
      next();
    });
  }

  // 举一反三
  function doVariants(bank, q, p) {
    if (!AI.ready()) { U.toast('请先配置 AI 接口', 'bad'); Profile.openSettings('ai'); return; }
    U.busy('AI 正在生成变式题…');
    var pr = q ? AI.variants(q, 3) : AI.genQuestions(Object.assign(specOf(bank, 3), { points: [p] }), 3);
    pr.then(function (qs) {
      qs.forEach(function (x) { x.bankId = bank.id; x.bankLabel = bank.name; });
      bank.cached = (bank.cached || []).concat(qs);
      // 和 Bank.fill 一样维护上限与元数据：喂题是从最旧那端 splice 的，
      // 超限后如果不裁，下一次补充会把还没刷过的老缓存题悄悄丢掉。
      if (bank.cached.length > 400) bank.cached.splice(0, bank.cached.length - 400);
      bank.cacheMeta = { updated: Date.now(), count: bank.cached.length };
      DB.save();
      U.busyHide();
      U.toast('已加入 ' + qs.length + ' 道变式题', 'ok');
      render();
    }).catch(function (e) { U.busyHide(); U.toast('生成失败：' + (e.message || e), 'bad', 2600); });
  }

   * 预设题库用的是内置题目（js/offline-extra.js），建好就能离线刷；
   * 其中选择题与填空题都在本机判分，不花 API 额度，适合每天固定练一组。

  function createPreset(ps, startNow) {
    var P = w.YX_PRESETS;
    if (!P) { U.toast('预设题库数据未加载', 'bad'); return null; }
    var qs = P.questionsOf(ps.id);
    if (!qs.length) { U.toast('这个预设题库暂时没有题目', 'bad'); return null; }
    var bank = Bank.create({
      name: ps.name, subject: ps.subject, stage: ps.stage || '', grade: '',
      kind: 'preset', desc: ps.desc, pointIds: [], points: []
    });
    bank.presetId = ps.id;
    bank.cached = qs;
    bank.cacheMeta = { updated: Date.now(), count: qs.length };
    DB.save();
    U.toast('已创建「' + ps.name + '」· ' + qs.length + ' 题', 'ok', 2600);
    if (startNow) Feed.launch({ type: 'bank', bankId: bank.id, label: bank.name });
    else { tab = 'mine'; render(); }

  }

  /** 区块标题：与设置页同一种结构（cat-title + 分隔线）。 */
  function sect(title) {
    return U.h('div', { class: 'cat-title' }, U.h('span', { text: title }), U.h('span', { class: 'line' }));
  }

  /**
   * 一张题库卡：刷题是主操作（大按钮），补充题量是次操作，其余收进「⋯」或次级小字按钮。
   */
  function bankCard(b, quickN) {
    var pts = Bank.pointsOf(b);
    var cached = (b.cached || []).length;
    var info = [b.subject, b.stage, b.grade].filter(Boolean).join(' · ') || '自定义';
    info += ' · ' + pts.length + ' 个知识点';
    info += cached ? ' · 已缓存 ' + cached + ' 题' : ' · 暂无缓存';
    if (cached && b.cacheMeta && b.cacheMeta.updated) info += ' · ' + U.relTime(b.cacheMeta.updated) + '更新';

    return U.h('div', { class: 'card', 'data-bank': b.id },
      U.h('div', { class: 'row between mb8' },
        U.h('div', { class: 'grow' },
          U.h('div', { class: 'row' },
            U.h('span', { class: 'card-hd-t', text: b.name }),
            b.isDefault ? U.h('span', { class: 'chip on', text: '首页默认' }) : null
          ),
          U.h('div', { class: 'tiny muted mt4', text: info })
        )
      ),
      U.h('div', { class: 'fill-progress hidden mb8' },
        U.h('div', { class: 'row between mb8' }, U.h('span', { class: 'tiny muted fp-t', text: '准备中…' })),
        U.h('div', { class: 'bar' }, U.h('i', { style: { width: '0%' } }))
      ),
      U.h('div', { class: 'btn-row mb8' },
        U.h('button', { class: 'btn primary lead', html: ICON('feed', 17) + '<span>' + (cached ? '刷缓存题' : '开始刷题') + '</span>', onclick: function () {
          Feed.launch({ type: 'bank', bankId: b.id, label: b.name });
        } }),
        U.h('button', { class: 'btn ghost', html: ICON('bolt', 16) + '<span>扩充题库</span>', onclick: function () { expandSheet(b, quickN); } }),
        U.h('button', { class: 'btn ghost sm', title: '更多操作', text: '⋯', style: { flex: '0 0 46px', padding: '10px 0' }, onclick: function () { bankMenu(b); } })
      )
    );
  }

  /** 扩充题库：把加题的各种方式收进一个面板，卡片上只留三个按钮 */
  function expandSheet(b, quickN) {
    var body = U.h('div');
    body.appendChild(U.h('div', { class: 'hintbox', text: '给「' + b.name + '」补充题目。补进来的题会存进题库，没网时也能接着刷。' }));
    function row(ic, title, desc, fn) {
      body.appendChild(U.h('div', { class: 'lrow', onclick: fn },
        U.h('div', { class: 'ico', html: ICON(ic, 18) }),
        U.h('div', { class: 'grow' }, U.h('div', { class: 't', text: title }), desc ? U.h('div', { class: 'd', text: desc }) : null),
        U.h('span', { class: 'chev', html: ICON('chevronRight', 16) })
      ));
    }
    row('bolt', '快速补充 ' + quickN + ' 题', '一键补一批，最省事', function () { sh.close(); doFill(b, quickN); });
    row('plus', '更多数量…', '自己填要补多少题', function () { sh.close(); fillDialog(b); });
    row('sparkles', '举一反三', '按已有题目生成变式题', function () { sh.close(); variantsFor(b); });
    row('brain', '这个题库考什么', '看看覆盖了哪些知识点', function () { sh.close(); showPoints(b); });
    var sh = U.sheet({ title: '扩充题库', body: body });
  }

  function renderMine(pane) {
    if (!TAX.ok) pane.appendChild(U.h('div', { class: 'warnbox', text: '知识点数据未加载，可能是安装包不完整。仍可用「自定义题库」。' }));

    var bs = Bank.list();
    if (!bs.length) {
      pane.appendChild(U.emptyBox('library', '还没有题库',
        '按科目建一个题库，AI 现出题；也可以从内置知识点里挑。<br>建好后能一键补题，没网也能接着刷。',
        U.h('button', { class: 'btn primary', html: ICON('plus', 15) + '<span>新建题库</span>', onclick: newBankSheet })));
      return;
    }

    var totalCached = bs.reduce(function (n, b) { return n + ((b.cached || []).length); }, 0);
    var quickN = Math.max(1, DB.settings().gen.batch || 3);
    pane.appendChild(U.h('div', { class: 'row between mb12' },
      U.h('div', { class: 'grow tiny muted', text: bs.length + ' 个题库 · 已缓存 ' + totalCached + ' 题 · 离线题池 ' + OFFLINE.count() + ' 题' }),
      U.h('div', { class: 'row' },
        U.h('button', { class: 'btn ghost sm', html: ICON('cloudOff', 14) + '<span>离线池</span>', onclick: function () { Feed.launch({ type: 'recommend', label: '默认推荐' }); } }),
        bs.length > 1 ? U.h('button', { class: 'btn ghost sm', html: ICON('bolt', 14) + '<span>一键补充全部</span>', onclick: fillAll }) : null
      )
    ));

    bs.forEach(function (b) { pane.appendChild(bankCard(b, quickN)); });
  }

  function bankMenu(b) {
    var pts = Bank.pointsOf(b);
    var body = U.h('div');
    body.appendChild(U.h('div', { class: 'kv' }, U.h('span', { class: 'k', text: '知识点' }), U.h('span', { class: 'v', text: pts.length + ' 个' })));
    body.appendChild(U.h('div', { class: 'kv' }, U.h('span', { class: 'k', text: '缓存题目' }), U.h('span', { class: 'v', text: ((b.cached || []).length) + ' 题' })));
    body.appendChild(U.h('div', { class: 'kv' }, U.h('span', { class: 'k', text: '创建时间' }), U.h('span', { class: 'v', text: U.fmtDateTime(b.createdAt) })));
    var acts = U.h('div', { class: 'mt12' });
    function item(ic, title, desc, fn, danger) {
      acts.appendChild(U.h('div', { class: 'lrow', onclick: fn },
        U.h('div', { class: 'ico', html: ICON(ic, 18) }),
        U.h('div', { class: 'grow' }, U.h('div', { class: 't', text: title, style: danger ? { color: 'var(--bad)' } : null }), desc ? U.h('div', { class: 'd', text: desc }) : null),
        U.h('span', { class: 'chev', html: ICON('chevronRight', 16) })
      ));
    }
    item('edit', '编辑题库', '名称、科目与说明', function () { sh.close(); editBank(b); });
    item('pin', '设为首页默认', '打开首页就刷这个题库', function () { Bank.setDefault(b.id, true); sh.close(); render(); U.toast('已设为首页默认题库', 'ok'); });
    item('brain', '查看知识点', '', function () { sh.close(); showPoints(b); });
    item('download', '导出缓存题目', '生成 JSON 备份', function () {
      var txt = JSON.stringify({ app: 'yuxue', type: 'bank', name: b.name, exportedAt: Date.now(), questions: b.cached || [] }, null, 1);
      U.toast(B.exportJson('yuxue-bank-' + b.name.replace(/[^\w\u4e00-\u9fa5]/g, '') + '.json', txt), 'ok', 2600);
    });
    item('broom', '清空缓存题目', '保留题库与记录', function () {
      sh.close();
      U.confirm('清空缓存', '确定清空「' + b.name + '」的 ' + ((b.cached || []).length) + ' 道缓存题吗？', '清空', true).then(function (y) {
        if (!y) return;
        b.cached = []; b.cacheMeta = null; DB.save(); render(); U.toast('已清空缓存', 'ok');
      });
    });
    item('trash', '删除题库', '不会删除刷题记录', function () {
      sh.close();
      U.confirm('删除题库', '确定删除「' + b.name + '」吗？', '删除', true).then(function (y) {
        if (y) { Bank.remove(b.id); render(); U.toast('已删除'); }
      });
    }, true);
    body.appendChild(acts);
    var sh = U.sheet({ title: b.name, body: body });
  }

  function showPoints(b) {
    var pts = Bank.pointsOf(b);
    var body = U.h('div');
    pts.forEach(function (p) {
      body.appendChild(U.h('div', { class: 'kp' },
        U.h('div', { class: 'grow' },
          U.h('div', { class: 'nm', text: p.name }),
          U.h('div', { class: 'kw', text: [p.subject, p.grade, p.keywords].filter(Boolean).join(' · ') })
        )
      ));
    });
    U.sheet({ title: '知识点（' + pts.length + '）', body: body, full: true });
  }

  function editBank(b) {
    var name = U.input(b.name, '题库名称');
    var subject = U.input(b.subject, '科目');
    var stage = U.input(b.stage, '学段');
    var grade = U.input(b.grade, '年级');
    var desc = U.h('textarea', { rows: 3 });
    desc.value = b.desc || '';
    var body = U.h('div');
    body.appendChild(U.field('名称', name));
    body.appendChild(U.h('div', { class: 'grid2' }, U.field('科目', subject), U.field('学段', stage)));
    body.appendChild(U.field('年级', grade));
    body.appendChild(U.field('说明 / 详情', desc, '会作为出题背景交给 AI'));
    var sh;
    sh = U.sheet({
      title: '编辑题库', body: body,
      footer: (function () {
        var f = U.h('div', { class: 'btn-row' });
        f.appendChild(U.h('button', { class: 'btn ghost', text: '取消', onclick: function () { sh.close(); } }));
        f.appendChild(U.h('button', { class: 'btn primary', text: '保存', onclick: function () {
          Bank.update(b.id, { name: name.value.trim() || b.name, subject: subject.value.trim(), stage: stage.value.trim(), grade: grade.value.trim(), desc: desc.value.trim() });
          sh.close(); render(); U.toast('已保存', 'ok');
        } }));
        return f;
      })()
    });
  }

  function variantsFor(b) {
    var body = U.h('div');
    body.appendChild(U.h('div', { class: 'hintbox', text: '选一道缓存题或一个知识点，生成 3 道变式题并加入缓存。' }));
    var cached = (b.cached || []).slice(-20).reverse();
    if (cached.length) {
      body.appendChild(sect('以缓存题目为原型'));
      cached.slice(0, 8).forEach(function (q) {
        body.appendChild(U.h('div', { class: 'lrow', onclick: function () { sh.close(); doVariants(b, q); } },
          U.h('div', { class: 'ico', html: ICON(q.type === 'choice' ? 'list' : 'edit', 18) }),
          U.h('div', { class: 'grow' }, U.h('div', { class: 't ellipsis', text: q.stem }), U.h('div', { class: 'd', text: (q.point || '') + ' · ' + (q.subject || '') })),
          U.h('span', { class: 'chev', html: ICON('chevronRight', 16) })
        ));
      });
    }
    body.appendChild(sect('以知识点为原型'));
    Bank.pointsOf(b).slice(0, 12).forEach(function (p) {
      body.appendChild(U.h('div', { class: 'lrow', onclick: function () { sh.close(); doVariants(b, null, p); } },
        U.h('div', { class: 'ico', html: ICON('target', 18) }),
        U.h('div', { class: 'grow' }, U.h('div', { class: 't', text: p.name }), U.h('div', { class: 'd', text: [p.subject, p.grade].filter(Boolean).join(' · ') })),
        U.h('span', { class: 'chev', html: ICON('chevronRight', 16) })
      ));
    });
    var sh = U.sheet({ title: '举一反三', body: body, full: true });
  }

  // ---- 知识点库
  function renderTax(pane) {
    if (!TAX.ok) { pane.appendChild(U.h('div', { class: 'warnbox', text: '知识点数据未加载。' })); return; }
    pane.appendChild(U.h('div', { class: 'hintbox', html: '按 <b>学段 → 年级 → 科目</b> 浏览；可以跨年级多选知识点，选完直接建库。' }));

    var search = U.input('', '搜索知识点，如 一元二次方程', {});
    var resBox = U.h('div');
    search.addEventListener('input', U.debounce(function () {
      U.clear(resBox);
      var kw = search.value.trim();
      if (!kw) return;
      var hits = TAX.search(kw, 40);
      if (!hits.length) { resBox.appendChild(U.h('div', { class: 'card' }, U.h('div', { class: 'small muted', text: '没有找到相关知识点' }))); return; }
      resBox.appendChild(U.h('div', { class: 'card' },
        U.h('div', { class: 'tiny muted mb8', text: '找到 ' + hits.length + ' 个结果' }),
        hits.slice(0, 12).map(function (p) {
          return U.h('div', { class: 'kp', onclick: function () {
            confirmCreate({ name: p.name, subject: p.subject, stage: TAX.stageOf(p.stage), grade: TAX.gradeName(p.stage, p.grade), kind: 'point', points: [toPt(p)] });
          } },
            U.h('div', { class: 'grow' }, U.h('div', { class: 'nm', text: p.name }),
              U.h('div', { class: 'kw', text: [TAX.stageOf(p.stage), TAX.gradeName(p.stage, p.grade), p.subject].filter(Boolean).join(' · ') })),
            U.h('span', { class: 'chev', html: ICON('plus', 15) })
          );
        })
      ));
    }, 200));
    pane.appendChild(U.h('div', { class: 'mb12' }, search));
    pane.appendChild(resBox);

    pane.appendChild(U.h('div', { class: 'btn-row mb12' },
      U.h('button', { class: 'btn primary', html: ICON('target', 15) + '<span>多选知识点建库</span>', onclick: pickerFlow }),
      U.h('button', { class: 'btn ghost', html: ICON('random', 15), text: '随机刷题', onclick: function () { Feed.launch({ type: 'recommend', label: '默认推荐' }); } })
    ));

    pane.appendChild(sect('按学段浏览'));
    TAX.stages().forEach(function (s) {
      var total = TAX.pointsOf(s.id).length;
      pane.appendChild(U.h('div', { class: 'lrow', onclick: function () { stageSheet(s); } },
        U.h('div', { class: 'ico', html: ICON(STAGE_ICON[s.id] || 'book', 18) }),
        U.h('div', { class: 'grow' },
          U.h('div', { class: 't', text: s.name }),
          U.h('div', { class: 'd', text: (s.grades || []).length + ' 个年级 · ' + total + ' 个知识点' })),
        U.h('span', { class: 'chev', html: ICON('chevronRight', 16) })
      ));
    });
  }

  /** 学段详情：年级 × 科目 的知识点分布，一眼看清分类 */
  function stageSheet(s) {
    var body = U.h('div');
    body.appendChild(U.h('div', { class: 'hintbox', text: '点科目建单科题库，或点「挑选」逐个选知识点。' }));
    var tree = TAX.subjectTree(s.id);
    var byGrade = {};
    tree.forEach(function (x) { (byGrade[x.gradeId] = byGrade[x.gradeId] || { name: x.grade, subs: [] }).subs.push(x); });
    (s.grades || []).forEach(function (g) {
      var info = byGrade[g.id];
      var total = info ? info.subs.reduce(function (a, b) { return a + b.count; }, 0) : 0;
      var card = U.h('div', { class: 'card tight' },
        U.h('div', { class: 'row between mb8' },
          U.h('div', { class: 'grow' },
            U.h('div', { class: 'small', style: { fontWeight: '600' }, text: g.name }),
            U.h('div', { class: 'tiny muted mt4', text: total + ' 个知识点 · ' + (info ? info.subs.length : 0) + ' 个科目' })),
          U.h('button', { class: 'chip', html: ICON('target', 13) + '<span>挑选</span>', onclick: function () { sh.close(); subjectPicker(s, g); } })
        )
      );
      var chips = U.h('div', { class: 'chips' });
      (info ? info.subs : []).forEach(function (x) {
        var c = U.h('button', { class: 'chip', text: x.subject + ' ' + x.count });
        c.addEventListener('click', function () {
          sh.close();
          confirmCreate({
            name: g.name + ' · ' + x.subject, subject: x.subject, stage: s.name, grade: g.name, kind: 'grade',
            desc: g.name + x.subject, points: TAX.pointsOf(s.id, g.id, x.subject).map(toPt)
          });
        });
        chips.appendChild(c);
      });
      card.appendChild(chips);
      body.appendChild(card);
    });
    var sh = U.sheet({ title: s.name + ' · 知识点分类', body: body, full: true });
  }

  function subjectPicker(s, g) {
    var pts = TAX.pointsOf(s.id, g.id);
    var sel = {};
    var listBox = U.h('div');
    var bar = U.h('div', { class: 'grow' });
    function picked() { return Object.keys(sel).map(function (k) { return sel[k]; }); }
    function refresh() {
      U.clear(bar);
      bar.appendChild(U.h('div', { class: 'grow small', html: '已选 <b>' + picked().length + '</b> / ' + pts.length }));
      bar.appendChild(U.h('button', { class: 'btn primary sm', text: '下一步', onclick: function () {
        if (!picked().length) { U.toast('请至少选择一个知识点'); return; }
        sh.close();
        confirmCreate({ name: g.name + ' 选练', subject: picked()[0].subject, stage: s.name, grade: g.name, kind: 'pick', points: picked() });
      } }));
    }
    var groups = {};
    pts.forEach(function (p) { (groups[p.subject] = groups[p.subject] || []).push(p); });
    Object.keys(groups).forEach(function (sub) {
      var head = U.h('div', { class: 'kg-h' }, U.h('span', { text: sub + '（' + groups[sub].length + '）' }), U.h('span', { class: 'line' }));
      var all = U.h('button', { class: 'chip', text: '全选' });
      all.addEventListener('click', function () {
        var on = groups[sub].some(function (p) { return !sel[p.id]; });
        groups[sub].forEach(function (p) { if (on) sel[p.id] = toPt(p); else delete sel[p.id]; });
        Array.prototype.forEach.call(listBox.querySelectorAll('.kp'), function (row) {
          var id = row.getAttribute('data-id');
          if (id) row.classList.toggle('on', !!sel[id]);
        });
        refresh();
      });
      head.appendChild(all);
      listBox.appendChild(head);
      groups[sub].forEach(function (p) {
        var row = U.h('div', { class: 'kp', 'data-id': p.id },
          U.h('div', { class: 'ck', html: ICON('check', 13) }),
          U.h('div', { class: 'grow' }, U.h('div', { class: 'nm', text: p.name }), U.h('div', { class: 'kw', text: p.keywords || '' })));
        row.addEventListener('click', function () {
          if (sel[p.id]) delete sel[p.id]; else sel[p.id] = toPt(p);
          row.classList.toggle('on', !!sel[p.id]);
          refresh();
        });
        listBox.appendChild(row);
      });
    });
    var sh = U.sheet({ title: g.name + ' · 选择知识点', body: listBox, page: true, footer: bar });
    refresh();
  }

  // ---- 考试专项
  function renderExam(pane) {
    var exams = TAX.exams();
    if (!exams.length) { pane.appendChild(U.h('div', { class: 'warnbox', text: '考试数据未加载。' })); return; }
    pane.appendChild(U.h('div', { class: 'hintbox', text: '点考试就能建单科题库，也可以直接开始刷题。' }));
    exams.forEach(function (e) {
      var pts = TAX.examPoints(e);
      pane.appendChild(U.h('div', { class: 'card' },
        U.h('div', { class: 'row between mb8' },
          U.h('div', { class: 'grow' },
            U.h('div', { class: 'card-hd-t', text: e.name }),
            U.h('div', { class: 'tiny muted mt4', text: e.desc || '' })),
          U.h('span', { class: 'tiny muted', text: pts.length + ' 个知识点' })
        ),
        U.h('div', { class: 'tagline mb12' }, (e.subjects || []).slice(0, 10).map(function (s) { return U.h('span', { class: 'chip tag', text: s }); })),
        U.h('div', { class: 'btn-row mb8' },
          U.h('button', { class: 'btn primary lead', html: ICON('feed', 17) + '<span>开始刷题</span>', onclick: function () {
            Feed.launch({ type: 'points', label: e.name, points: pts.map(toPt) });
          } }),
          U.h('button', { class: 'btn ghost sm', html: ICON('plus', 15) + '<span>建单科题库</span>', onclick: function () { examFlow(e); } })
        ),
        U.h('div', { class: 'btn-row sub' },
          U.h('button', { class: 'btn xs', text: '看知识点', onclick: function () { examDetail(e); } })
        )
      ));
    });
  }

  function examDetail(e) {
    var pts = TAX.examPoints(e);
    var body = U.h('div');
    var bySub = {};
    pts.forEach(function (p) { (bySub[p.subject] = bySub[p.subject] || []).push(p); });
    Object.keys(bySub).forEach(function (k) {
      body.appendChild(sect(k + ' · ' + bySub[k].length));
      bySub[k].forEach(function (p) {
        body.appendChild(U.h('div', { class: 'kp' },
          U.h('div', { class: 'grow' },
            U.h('div', { class: 'nm', text: p.name }),
            U.h('div', { class: 'kw', text: [TAX.gradeName(p.stage, p.grade), p.keywords].filter(Boolean).join(' · ') }))
        ));
      });
    });
    U.sheet({ title: e.name + ' 知识点', body: body, full: true });
  }

  w.TAX = TAX;
  w.Bank = Bank;
  w.BankView = {
    render: render, picker: picker, afterPick: afterPick, doCache: doFill, doFill: doFill,
    newBankSheet: newBankSheet, confirmCreate: confirmCreate, fillDialog: fillDialog,
    setTab: function (t) { tab = t; }
  };
})(window);

</script>
<script>
/* ===== statsview.js ===== */
/* 语学 — 学情：详细数据、非阻塞生成、学习报告独立页。 */
(function (w) {
  'use strict';

  var filter = 'all';
  var genState = { report: false, rec: false };   // 生成中状态（非阻塞，可切到别的页面）

  function view() { return U.$('#v-stats'); }

  function render() {
    var v = view();
    if (!v) return;
    var top = v.scrollTop;
    U.clear(v);
    v.classList.add('plain');

    var ov = DB.overview();
    var today = DB.today();

    v.appendChild(U.h('div', { class: 'hd' },
      U.h('h1', { text: '学情' }),

  // ---------------------------------------------------------------- 生成（非阻塞）
  function genReport() {
    if (!AI.ready()) { U.toast('请先配置 AI 接口', 'bad'); Profile.openSettings('ai'); return; }
    var ov = DB.overview();
    if (ov.n < 3) { U.toast('至少先刷 3 道题再生成报告', 'bad'); return; }
    if (genState.report) { U.toast('报告正在生成中'); return; }
    genState.report = true;
    if (App.cur === 'stats') render();
    U.toast('已开始生成报告，可以继续其他操作', null, 2000);
    AI.report(DB.digest()).then(function (text) {
      genState.report = false;
      DB.state.report = { ts: Date.now(), text: text };
      DB.save();
      if (App.cur === 'stats') render();
      U.toast('学习报告已生成', 'ok');
    }).catch(function (e) {
      genState.report = false;
      if (App.cur === 'stats') render();
      U.toast('生成失败：' + (e.message || e), 'bad', 2600);
    });
  }

  function genRecommend() {
    if (!AI.ready()) { U.toast('请先配置 AI 接口', 'bad'); Profile.openSettings('ai'); return; }
    if (genState.rec) { U.toast('推荐正在生成中'); return; }
    genState.rec = true;
    if (App.cur === 'stats') render();
    U.toast('已开始生成推荐，可以继续其他操作', null, 2000);
    AI.recommend(DB.digest()).then(function (r) {
      genState.rec = false;
      DB.state.recommend = { ts: Date.now(), plan: r.plan, points: r.points };
      DB.save();
      if (App.cur === 'stats') render();
      U.toast(r.points.length ? '推荐已生成' : '暂时给不出推荐，多刷几题数据更准', r.points.length ? 'ok' : 'bad');
    }).catch(function (e) {
      genState.rec = false;
      if (App.cur === 'stats') render();
      U.toast('推荐失败：' + (e.message || e), 'bad', 2600);
    });
  }

            U.h('div', { class: 't ellipsis', text: r.stem || '' }),
            U.h('div', { class: 'd', text: [r.point, r.userAnswer ? '作答：' + String(r.userAnswer).slice(0, 24) : '未作答'].filter(Boolean).join(' · ') })
          )
        ));
      });
    }
    U.sheet({ title: '刷题实例', body: body, full: true });
  }

  w.StatsView = {
    render: render, genReport: genReport, genRecommend: genRecommend, openReport: openReport,
    isLoading: function () { return genState.report || genState.rec; }
  };
})(window);

</script>
<script>
/* ===== ach.js ===== */
/* 语学 — achievements: unlocked from real practice data (records / streak / wrong book). */
(function (w) {
  'use strict';

  var DB = w.DB;

  /* 等级：每答对一题记 10 点经验，答过记 2 点，等级 = 累进曲线 */
  var XP_CORRECT = 10, XP_ANSWER = 2;

  var LIST = [
    { id: 'first', name: '开张', desc: '完成第一道题', icon: 'answer', goal: function (s) { return s.n >= 1 ? 1 : 0; }, total: 1 },
    { id: 'q30', name: '手感来了', desc: '累计刷满 30 道题', icon: 'cards', goal: function (s) { return s.n; }, total: 30 },
    { id: 'q150', name: '渐入佳境', desc: '累计刷满 150 道题', icon: 'feed', goal: function (s) { return s.n; }, total: 150 },
    { id: 'q500', name: '题海遨游', desc: '累计刷满 500 道题', icon: 'book', goal: function (s) { return s.n; }, total: 500 },
    { id: 'q1500', name: '勤学不辍', desc: '累计刷满 1500 道题', icon: 'trophy', goal: function (s) { return s.n; }, total: 1500 },
    { id: 'acc70', name: '稳中有进', desc: '答满 30 题且正确率不低于 70%', icon: 'check', goal: function (s) { return s.n >= 30 ? Math.min(s.acc, 70) : 0; }, total: 70 },
    { id: 'acc85', name: '拿手好戏', desc: '答满 100 题且正确率不低于 85%', icon: 'medal', goal: function (s) { return s.n >= 100 ? Math.min(s.acc, 85) : 0; }, total: 85 },
    { id: 'acc95', name: '几乎不错', desc: '答满 300 题且正确率不低于 95%', icon: 'crown', goal: function (s) { return s.n >= 300 ? Math.min(s.acc, 95) : 0; }, total: 95 },
    { id: 'streak3', name: '三天打底', desc: '连续 3 天都刷过题', icon: 'flame', goal: function (s) { return s.streak; }, total: 3 },
    { id: 'streak7', name: '一周不断', desc: '连续 7 天都刷过题', icon: 'flame', goal: function (s) { return s.streak; }, total: 7 },
    { id: 'streak30', name: '一月坚持', desc: '连续 30 天都刷过题', icon: 'target', goal: function (s) { return s.streak; }, total: 30 },
    { id: 'time60', name: '一小时', desc: '累计答题时间达到 60 分钟', icon: 'clock', goal: function (s) { return Math.floor(s.minutes); }, total: 60 },
    { id: 'time600', name: '十小时', desc: '累计答题时间达到 10 小时', icon: 'timer', goal: function (s) { return Math.floor(s.minutes / 60); }, total: 10 },
    { id: 'fast', name: '又快又准', desc: '答满 200 题，平均每题不超过 12 秒', icon: 'bolt', goal: function (s) { return s.n >= 200 && s.avgSec > 0 && s.avgSec <= 12 ? 1 : 0; }, total: 1 },
    { id: 'fix20', name: '知错能改', desc: '让 20 道错题变成「已掌握」', icon: 'wrongbook', goal: function (s) { return s.fixed; }, total: 20 },
    { id: 'clear', name: '错题清空', desc: '错题本里一道未掌握的题都不剩', icon: 'broom', goal: function (s) { return s.wrongOpen === 0 && s.fixed >= 5 ? 1 : 0; }, total: 1 },
    { id: 'fav10', name: '收藏家', desc: '收藏 10 道题', icon: 'starFill', goal: function (s) { return s.fav; }, total: 10 },
    { id: 'bank3', name: '自己的题库', desc: '创建 3 个题库', icon: 'mark', goal: function (s) { return s.banks; }, total: 3 },
    { id: 'subj6', name: '多面手', desc: '在 6 个不同科目上刷过题', icon: 'compass', goal: function (s) { return s.subjects; }, total: 6 },
    { id: 'night', name: '夜猫子', desc: '在 23 点以后刷过题', icon: 'moon', goal: function (s) { return s.night ? 1 : 0; }, total: 1 },
    { id: 'early', name: '早起鸟', desc: '在 6 点以前刷过题', icon: 'sun', goal: function (s) { return s.early ? 1 : 0; }, total: 1 },
    { id: 'report', name: '眼里不揉沙', desc: '提交过一次题目纠错', icon: 'flag', goal: function (s) { return s.reports; }, total: 1 },
    { id: 'level5', name: '五级学者', desc: '等级达到 5 级', icon: 'graduation', goal: function (s) { return s.level; }, total: 5 },
    { id: 'level10', name: '十级学者', desc: '等级达到 10 级', icon: 'award', goal: function (s) { return s.level; }, total: 10 }
  ];

  function st() {
    var s = DB.state;
    if (!s.ach || typeof s.ach !== 'object') s.ach = { got: {} };
    if (!s.ach.got || typeof s.ach.got !== 'object') s.ach.got = {};
    return s.ach;
  }

  var cache = null;

  function stats(force) {
    if (cache && !force) return cache;
    var s = DB.state;
    var recs = s.records || [];
    var n = 0, correct = 0, ms = 0, night = false, early = false;
    var subs = {}, subjN = 0;
    for (var i = 0; i < recs.length; i++) {
      var r = recs[i];
      n++;
      if (r.correct) correct++;
      ms += r.ms || 0;
      var h = new Date(r.ts || 0).getHours();
      if (h >= 23) night = true;
      if (h < 6) early = true;
      var key = r.subject || '';
      if (key && !subs[key]) { subs[key] = 1; subjN++; }
    }
    var fixed = 0, wrongOpen = 0;
    (s.wrong || []).forEach(function (x) { if (x.fixed) fixed++; else wrongOpen++; });
    var xp = correct * XP_CORRECT + n * XP_ANSWER;
    var level = Math.floor(Math.sqrt(xp / 60)) + 1;
    var levelBase = Math.pow(level - 1, 2) * 60;
    var levelNext = Math.pow(level, 2) * 60;
    cache = {
      n: n,
      correct: correct,
      acc: n ? Math.round((correct / n) * 100) : 0,
      minutes: ms / 60000,
      avgSec: n ? (ms / n) / 1000 : 0,
      streak: DB.streak ? DB.streak() : 0,
      days: Object.keys(s.days || {}).length,
      fixed: fixed,
      wrongOpen: wrongOpen,
      fav: (s.fav || []).length,
      banks: (s.banks || []).length,
      subjects: subjN,
      reports: (s.reports || []).length,
      night: night,
      early: early,
      xp: xp,
      level: level,
      levelBase: levelBase,
      levelNext: levelNext,
      levelPct: Math.round(((xp - levelBase) / Math.max(1, levelNext - levelBase)) * 100)
    };
    return cache;
  }

  function list() {
    var s = stats();
    var got = st().got;
    return LIST.map(function (a) {
      var cur = 0;
      try { cur = a.goal(s) || 0; } catch (e) { cur = 0; }
      if (cur > a.total) cur = a.total;
      return {
        id: a.id, name: a.name, desc: a.desc, icon: a.icon,
        cur: cur, total: a.total,
        pct: Math.max(0, Math.min(100, Math.round((cur / a.total) * 100))),
        got: !!got[a.id],
        at: got[a.id] || 0
      };
    });
  }

  function unlocked() {
    return list().filter(function (a) { return a.got; });
  }

  /* 检查新解锁的成就，返回本次新解锁的条目（已写盘） */
  function check() {
    var got = st().got;
    if (!got._init) {
      /* 首次运行时，把已达成的成就直接记为「已解锁」并标为已读，避免一次弹一堆 */
      var all = list(), seed = false;
      all.forEach(function (a) {
        if (a.pct >= 100) { got[a.id] = Date.now(); seed = true; }
      });
      got._init = Date.now();
      if (seed) DB.save();
      return [];
    }
    var fresh = [];
    list().forEach(function (a) {
      if (a.pct >= 100 && !got[a.id]) { got[a.id] = Date.now(); fresh.push(a); }
    });
    if (fresh.length) DB.save();
    return fresh;
  }

  function reset() {
    var s = st();
    s.got = {};            // 清空全部记录，下一次 check() 会静默重建基线（不弹提示）
    DB.save();
  }

  function invalidate() { cache = null; }

  w.ACH = {
    LIST: LIST,
    stats: stats,
    list: list,
    unlocked: unlocked,
    check: check,
    reset: reset,
    invalidate: invalidate
  };
})(window);

</script>
<script>
/* ===== persona.js ===== */
/* 语学 — 学习画像（Persona）
 *
 * 拿真实刷题记录请 AI 写一份「你是什么样的学习者」：画像标题、标签、总体描述、
 * 学习风格、优势、待提升（各带一句可执行的建议）、整体建议，以及今天就能做的下一步。
 *
 * 三条底线：
 *   1. 依据只有 DB.digest() 里的真实数据 —— 模型编造或写歪的内容会被 sanitize() 按字段挡掉，
 *      缺了 summary（这份画像的骨架）就整份判失败，绝不存在「将就着画一半」的半成品；
 *   2. 只写 DB.state.persona 这一个键，不动 records / wrong / banks / settings 等任何东西；
 *   3. 生成是非阻塞的：可以翻到别的页面，生成完再回来（也可以关掉页面，结果照旧落盘）。
 *
 * 对外接口：
 *   PERSONA.open()         打开画像页；没有画像时给出说明与「生成」按钮
 *   PERSONA.has()          是否已经生成并保存过
 *   PERSONA.summaryLine()  「我的」列表用的一行摘要，没有则返回 ''
 */
(function (w) {
  'use strict';

  var generating = false;   // 生成中：兼作重入锁，连点两下也只能发出一次请求
  var closed = true;        // 页面是否已关闭（关掉后不再往已卸载的节点上画）
  var body = null;          // 页面内容容器
  var footEl = null;        // 页面底部按钮容器
  var sh = null;            // 当前 sheet
  var lastError = '';       // 页内展示的最近一次失败原因

  /* 各字段最长字数（约数）：模型经常写超，超了按字截断，不因为超长就把整份丢掉 */
  var LIM = {
    title: 20, tag: 8, summary: 240, style: 60,
    name: 40, note: 60, tip: 90, step: 60,
    tags: 6, strengths: 4, gaps: 4, tips: 5
  };

  // ---------------------------------------------------------------- 取用

  /** 数组判定：跨 iframe / 老 WebView 下 Array.isArray 不一定可靠，用 toString。 */
  function isArr(v) { return Object.prototype.toString.call(v) === '[object Array]'; }

  /** 取一句文本：去掉换行与多余空白，超长截断；对象（模型偶尔包一层）取里面的文字。 */
  function str(v, max) {
    if (v == null) return '';
    if (typeof v === 'object') {
      v = v.text != null ? v.text : (v.note != null ? v.note : (v.content != null ? v.content : ''));
    }
    var s = String(v == null ? '' : v).replace(/\s+/g, ' ').trim();
    return s.length > max ? s.slice(0, max) : s;
  }

  /** 取一组短句：非数组（或单个字符串 / 数字）都能兜住，空项丢弃，可去重。 */
  function strList(v, max, maxLen, uniq) {
    var out = [], seen = {}, arr, i, s;
    if (isArr(v)) arr = v;
    else if (typeof v === 'string' || typeof v === 'number') arr = [v];
    else return out;
    for (i = 0; i < arr.length && out.length < max; i++) {
      s = str(arr[i], maxLen);
      if (!s) continue;
      // seen 的键可能来自模型（如 "__proto__"），只认自有键
      if (uniq && Object.prototype.hasOwnProperty.call(seen, s)) continue;
      if (uniq) seen[s] = 1;
      out.push(s);
    }
    return out;
  }

  /** 取一组 {name, note, advice}：结构不对或没有 name 的整条丢掉。 */
  function strPairs(v, max, withAdvice) {
    var out = [], i, it, name, note, tip;
    if (!isArr(v)) return out;
    for (i = 0; i < v.length && out.length < max; i++) {
      it = v[i];
      name = ''; note = ''; tip = '';
      if (typeof it === 'string') name = str(it, LIM.name);
      else if (it && typeof it === 'object' && !isArr(it)) {
        name = str(firstOf(it, ['name', 'point', 'title', 'knowledge']), LIM.name);
        note = str(firstOf(it, ['note', 'desc', 'reason', 'detail']), LIM.note);
        tip = str(firstOf(it, ['advice', 'suggestion', 'tip']), LIM.tip);
      }
      if (!name) continue;
      out.push(withAdvice ? { name: name, note: note, advice: tip } : { name: name, note: note });
    }
    return out;
  }
  function firstOf(o, keys) {
    for (var i = 0; i < keys.length; i++) { if (o[keys[i]] != null) return o[keys[i]]; }
    return '';
  }

  /**
   * 把模型返回的东西变成「能安全画到界面上」的画像。
   * 结构不对、缺 summary 都返回 null —— 调用方据此报错并保留上一份画像。
   */
  function sanitize(raw) {
    if (!raw || typeof raw !== 'object' || isArr(raw)) return null;
    var d = {};
    d.summary = str(raw.summary != null ? raw.summary : raw.desc, LIM.summary);
    if (!d.summary) return null;                       // 骨架，缺了就整份失败
    d.title = str(raw.title, LIM.title) || '学习画像';
    d.style = str(raw.style, LIM.style);
    d.tags = strList(raw.tags, LIM.tags, LIM.tag, true);
    d.strengths = strPairs(raw.strengths, LIM.strengths, false);
    d.gaps = strPairs(raw.gaps != null ? raw.gaps : raw.weaknesses, LIM.gaps, true);
    d.advice = strList(raw.advice != null ? raw.advice : raw.suggestions, LIM.tips, LIM.tip, false);
    d.nextStep = str(firstOf(raw, ['nextStep', 'next_step', 'next']), LIM.step);
    return d;
  }

  /** 已保存且结构完好的画像；没有或数据坏了都返回 null。 */
  function current() {
    var p = DB.state ? DB.state.persona : null;
    if (!p || typeof p !== 'object' || !p.data) return null;
    // 存的时候已经校验过一次；备份文件是外部数据，画之前再兜一次
    var d = sanitize(p.data);
    if (!d) return null;
    return { at: U.num(p.at, 0), digestAt: U.num(p.digestAt, 0), data: d };
  }

  function has() { return !!current(); }

  function summaryLine() {
    var p = current();
    if (!p) return '';
    var n = p.data.tags.length;
    if (!p.data.title) return n ? (n + ' 个标签') : '';
    return p.data.title + (n ? ' · ' + n + ' 个标签' : '');
  }

  // ---------------------------------------------------------------- 提示词
  /** 只把这些真实数据交给模型；没有数据支撑的话不许它编。 */
  function buildPrompt() {
    var g = DB.digest() || {};
    var p = (g.profile && typeof g.profile === 'object') ? g.profile : (DB.state.profile || {});
    var ov = DB.overview();
    var lines = [];

    lines.push('请根据下面这位学习者【真实的刷题数据】，写一份中文「学习画像」。');
    lines.push('');
    lines.push('【学习者】');
    lines.push('昵称：' + (p.nickname || '学习者'));
    if (p.stage) lines.push('学段：' + p.stage);
    if (p.grade) lines.push('年级：' + p.grade);
    if (p.age) lines.push('年龄：' + p.age);
    if (p.target) lines.push('学习目标：' + p.target);
    lines.push('');
    lines.push('【真实数据（唯一依据，不得编造）】');
    lines.push(JSON.stringify(g));
    lines.push('合计已作答 ' + ov.n + ' 题，总正确率 ' + ov.acc + '%，连续学习 ' + DB.streak() + ' 天。');
    if (ov.n < 10) {
      lines.push('注意：记录只有 ' + ov.n + ' 题，数据很少。画像必须坦白说明还比较粗略，不要拔高，也不要编造具体表现。');
    }
    lines.push('');
    lines.push('要求：');
    lines.push('1. 结论只能用上面数据里真实存在的事实（题量、正确率、学科、知识点、用时、连续天数、薄弱点、错题），没有数据支撑的不要写。');
    lines.push('2. 全程第二人称「你」，像老师当面点评：具体、鼓励，但不含糊、不吹捧。');
    lines.push('3. 指出的每个问题都要给可执行的动作，不要写「多练习」「要努力」这类空话。');
    lines.push('4. 数据少就直说数据少，宁可保守也不要编。');
    lines.push('5. 只输出一个 JSON 对象，不要解释文字，不要 markdown 代码围栏。');
    lines.push('');
    lines.push('输出 JSON 格式：');
    lines.push('{"title":"一个 4-10 字的画像标题，例如「稳扎稳打型」",' +
      '"tags":["3-6 个标签，每个 2-6 字"],' +
      '"summary":"一段 60-140 字的总体描述，第二人称「你」",' +
      '"style":"一句 15-40 字的学习风格概括",' +
      '"strengths":[{"name":"知识点或能力","note":"一句 10-30 字的说明"}],' +
      '"gaps":[{"name":"知识点或能力","note":"一句 10-30 字的说明","advice":"一句可执行的建议"}],' +
      '"advice":["3-5 条整体建议，每条 10-40 字"],' +
      '"nextStep":"一句 15-40 字、今天就能做的具体动作"}');
    lines.push('其中 strengths 2-4 项，gaps 2-4 项，advice 3-5 条。');
    return lines.join('\n');
  }

  // ---------------------------------------------------------------- 生成
  function gen() {
    if (generating) { U.toast('画像正在生成中，请稍候'); return; }   // 重入锁：连点只会发一次请求
    if (!AI.ready()) {
      lastError = '还没有可用的 AI 接口，配置之后才能生成画像。';
      drawAll();
      U.toast('请先配置 AI 接口', 'bad');
      openSettings();
      return;
    }
    try { FX.tap(); } catch (e) { }

    generating = true;
    lastError = '';
    drawAll();                                // 立刻进入「生成中」界面，按钮同时置灰
    var ov = DB.overview();
    if (ov.n < 10) {
      // 数据少不拦着生成，但得先说实话
      U.toast('目前只有 ' + ov.n + ' 题记录，画像会比较粗略，建议多刷几题再看', null, 2600);
    } else {
      U.toast('已开始生成学习画像，可以继续其他操作', null, 2200);
    }

    var digestAt = Date.now();
    AI.json([{ role: 'user', content: buildPrompt() }], { temperature: 0.5 })
      .then(function (r) {
        var d = sanitize(r && r.data);
        // 结构不对就当作失败：宁可保持上一份画像，也不要存一份画歪的数据
        if (!d) throw new Error('AI 返回的画像不完整，请重试');
        DB.state.persona = { at: Date.now(), data: d, digestAt: digestAt };
        DB.save();
        generating = false;
        lastError = '';
        drawAll();                            // 正文与底部按钮一起刷新（底部要长出复制 / 分享）
        try { FX.done(); } catch (e) { }
        U.toast('学习画像已生成', 'ok');
      })
      .catch(function (e) {
        generating = false;
        lastError = '生成失败：' + ((e && e.message) || e || '未知错误');
        drawAll();                            // DB.state.persona 全程没被碰过，旧画像还在
        U.toast(lastError, 'bad', 2800);
      });
  }

  // ---------------------------------------------------------------- 分享 / 复制
  function plainText(p) {
    var d = p.data, L = [], i, x;
    L.push('【学习画像】' + d.title);
    if (d.tags.length) L.push('标签：' + d.tags.join('、'));
    L.push('');
    L.push(d.summary);
    if (d.style) { L.push(''); L.push('学习风格：' + d.style); }
    if (d.strengths.length) {
      L.push(''); L.push('【优势】');
      for (i = 0; i < d.strengths.length; i++) {
        x = d.strengths[i];
        L.push('· ' + x.name + (x.note ? '：' + x.note : ''));
      }
    }
    if (d.gaps.length) {
      L.push(''); L.push('【待提升】');
      for (i = 0; i < d.gaps.length; i++) {
        x = d.gaps[i];
        L.push('· ' + x.name + (x.note ? '：' + x.note : ''));
        if (x.advice) L.push('  建议：' + x.advice);
      }
    }
    if (d.advice.length) {
      L.push(''); L.push('【建议】');
      for (i = 0; i < d.advice.length; i++) L.push((i + 1) + '. ' + d.advice[i]);
    }
    if (d.nextStep) { L.push(''); L.push('【下一步】' + d.nextStep); }
    L.push('');
    L.push('—— 语学 · 学习画像' + (p.at ? '（' + U.fmtDateTime(p.at) + '）' : '') +
      ' · 基于 ' + DB.overview().n + ' 条刷题记录');
    return L.join('\n');
  }

  function doCopy() {
    var p = current();
    if (!p) { U.toast('还没有画像', 'bad'); return; }
    var ok = false;
    try { ok = B.copy(plainText(p)); } catch (e) { ok = false; }
    if (ok === false) U.toast('复制失败，可以长按手动选择文字', 'bad');
    else U.toast('画像已复制', 'ok');
  }

  function doShare() {
    var p = current();
    if (!p) { U.toast('还没有画像', 'bad'); return; }
    if (!B.shareText(plainText(p))) U.toast('当前环境不支持分享');
  }

  function openSettings() {
    if (w.Profile && Profile.openSettings) { Profile.openSettings('ai'); return; }
    U.toast('请在「设置 → AI 设置」里配置接口', 'bad');
  }

  // ---------------------------------------------------------------- 界面
  /** 只使用 ICON.has() 确认存在的图标名，缺了就退到通用图标。 */
  function ic(name, size) {
    var n = name;
    if (typeof ICON.has === 'function' && !ICON.has(n)) n = ICON.has('sparkles') ? 'sparkles' : 'info';
    return ICON(n, size || 15);
  }

  function sect(title) {
    return U.h('div', { class: 'sect-title' }, U.h('span', { text: title }), U.h('span', { class: 'line' }));
  }

  /** 生成 / 重新生成按钮；生成中置灰（真锁是 gen() 里的 generating 标志）。 */
  function genButton() {
    var b = U.h('button', {
      class: 'btn ' + (current() ? 'ghost' : 'primary'),
      html: ic('sparkles', 15) + '<span>' + (current() ? '重新生成' : '生成画像') + '</span>',
      onclick: gen
    });
    if (generating) b.setAttribute('disabled', 'disabled');
    return b;
  }

  function loadCard(text) {
    return U.h('div', { class: 'loadcard' },
      U.h('div', { class: 'lc-t', text: text }),
      U.h('div', { class: 'progress' }, U.h('i'))
    );
  }

  function draw() {
    if (closed || !body) return;
    U.clear(body);
    var p = current();
    var ov = DB.overview();

    // ---- 接口没配好：给一句实话 + 一个去配置的按钮
    if (!AI.ready()) {
      var warn = U.h('div', { class: 'warnbox mb12', html: ic('key', 14) + ' 还没有可用的 AI 接口，配置之后才能生成画像。' });
      warn.appendChild(U.h('div', { class: 'mt8' },
        U.h('button', { class: 'btn ghost sm', html: ic('settings', 14) + '<span>去配置 AI</span>', onclick: openSettings })));
      body.appendChild(warn);
    }

    // ---- 还没生成
    if (!p) {
      if (generating) {
        body.appendChild(loadCard('正在生成学习画像'));
        body.appendChild(U.h('div', { class: 'tiny muted mb12', text: '可以先去别的页面，生成完成后回到这里就能看到。' }));
      } else {
        body.appendChild(U.emptyBox('brain', '还没有学习画像',
          U.esc('它会只根据你真实的刷题记录，说清你现在的位置、学习风格、优势与待提升，') + '<br>' +
          U.esc('并给出今天就能做的下一步。刷得越多，结论越准。'),
          genButton()));
        if (ov.n < 10) {
          body.appendChild(U.h('div', { class: 'hintbox mt12',
            html: U.esc('目前只有 ' + ov.n + ' 道题的记录，现在生成的画像会比较粗略。多刷一些题再回来看，结论会实在得多。') }));
        }
      }
      if (lastError) body.appendChild(U.h('div', { class: 'warnbox mt12', html: ic('info', 14) + ' ' + U.esc(lastError) }));
      body.appendChild(U.h('div', { class: 'scroll-pad' }));
      return;
    }

    var d = p.data;

    // ---- 生成中（已有画像时在顶部提示，不遮住旧内容）
    if (generating) {
      body.appendChild(loadCard('正在重新生成画像'));
      body.appendChild(U.h('div', { class: 'tiny muted mb12', text: '可以先去别的页面，生成完成后这里会自动更新。' }));
    }
    if (lastError) body.appendChild(U.h('div', { class: 'warnbox mb12', html: ic('info', 14) + ' ' + U.esc(lastError) }));

    // ---- 标题 / 标签 / 生成时间
    body.appendChild(U.h('div', { class: 'card' },
      U.h('div', { style: { fontSize: '19px', fontWeight: '650' }, text: d.title }),
      U.h('div', { class: 'tiny muted mt4', text: '基于 ' + ov.n + ' 条刷题记录 · 正确率 ' + U.pct(ov.correct, ov.n) + '%' +
        (p.at ? ' · 生成于 ' + U.relTime(p.at) : '') }),
      d.tags.length ? U.h('div', { class: 'chips mt8' }, d.tags.map(function (t) {
        return U.h('span', { class: 'chip tag', text: t });
      })) : null
    ));

    // ---- 总体描述 / 学习风格
    body.appendChild(U.h('div', { class: 'card' }, U.h('div', { class: 'md', html: U.md(d.summary) })));
    if (d.style) {
      body.appendChild(U.h('div', { class: 'card tight' },
        U.h('div', { class: 'kv' },
          U.h('span', { class: 'k', text: '学习风格' }),
          U.h('span', { class: 'v', text: d.style }))
      ));
    }

    // ---- 优势
    if (d.strengths.length) {
      body.appendChild(sect('优势'));
      var sc = U.h('div', { class: 'card' });
      d.strengths.forEach(function (s, i) {
        if (i) sc.appendChild(U.h('div', { class: 'divider' }));
        sc.appendChild(U.h('div', { class: 'brow', style: i === d.strengths.length - 1 ? { marginBottom: '0px' } : null },
          U.h('div', { class: 'row' },
            U.h('span', { class: 'grow', html: ic('check', 13) + ' <b>' + U.esc(s.name) + '</b>' }),
            U.h('span', { class: 'tiny muted', text: '优势' })
          ),
          s.note ? U.h('div', { class: 'tiny muted', html: U.esc(s.note) }) : null
        ));
      });
      body.appendChild(sc);
    }

    // ---- 待提升（每条都带一句可执行的建议）
    if (d.gaps.length) {
      body.appendChild(sect('待提升'));
      var gc = U.h('div', { class: 'card' });
      d.gaps.forEach(function (g, i) {
        if (i) gc.appendChild(U.h('div', { class: 'divider' }));
        gc.appendChild(U.h('div', { class: 'brow', style: i === d.gaps.length - 1 ? { marginBottom: '0px' } : null },
          U.h('div', { class: 'row' },
            U.h('span', { class: 'grow', html: ic('target', 13) + ' <b>' + U.esc(g.name) + '</b>' }),
            U.h('span', { class: 'tiny muted', text: '待提升' })
          ),
          g.note ? U.h('div', { class: 'tiny muted', html: U.esc(g.note) }) : null,
          g.advice ? U.h('div', { class: 'tiny mt4', style: { color: 'var(--primary2)' }, html: ic('bulb', 12) + ' ' + U.esc(g.advice) }) : null
        ));
      });
      body.appendChild(gc);
    }

    // ---- 建议
    if (d.advice.length) {
      var lines = [];
      for (var i = 0; i < d.advice.length; i++) lines.push((i + 1) + '. ' + d.advice[i]);
      body.appendChild(sect('建议'));
      body.appendChild(U.h('div', { class: 'card' }, U.h('div', { class: 'md', html: U.md(lines.join('\n')) })));
    }

    // ---- 下一步（今天就能做的动作，单独高亮）
    if (d.nextStep) {
      body.appendChild(U.h('div', { class: 'card', style: { borderColor: 'var(--primary-bd)', background: 'var(--primary-soft)' } },
        U.h('div', { class: 'small mb8', style: { fontWeight: '600', color: 'var(--primary2)' }, html: ic('bolt', 14) + ' 下一步' }),
        U.h('div', { class: 'small', text: d.nextStep })
      ));
    }

    if (ov.n < 10) {
      body.appendChild(U.h('div', { class: 'hintbox',
        html: U.esc('这份画像只用了 ' + ov.n + ' 道题的数据，还比较粗略。再刷一些题后点「重新生成」，结论会准得多。') }));
    }
    body.appendChild(U.h('div', { class: 'scroll-pad' }));
  }

  function drawFoot() {
    if (!footEl) return;
    U.clear(footEl);
    var row = U.h('div', { class: 'btn-row' });
    row.appendChild(genButton());
    if (current()) {
      row.appendChild(U.h('button', { class: 'btn ghost', html: ic('copy', 14) + '<span>复制</span>', onclick: doCopy }));
      row.appendChild(U.h('button', { class: 'btn ghost', html: ic('share', 14) + '<span>分享</span>', onclick: doShare }));
    }
    footEl.appendChild(row);
  }

  function drawAll() { draw(); drawFoot(); }

  // ---------------------------------------------------------------- 入口
  /** 打开画像页（没有画像就引导生成；不会自动发请求）。 */
  function open() {
    if (sh && !closed) { drawAll(); return sh; }      // 已经开着就只刷新，不叠第二层
    closed = false;
    lastError = '';
    body = U.h('div');
    footEl = U.h('div');
    sh = U.sheet({
      title: '学习画像',
      page: true,
      body: body,
      footer: footEl,
      onClose: function () {                    // 关掉后生成完成也照旧落盘，只是不再画到这页上
        closed = true;
        sh = null;
        body = null;
        footEl = null;
      }
    });
    drawAll();
    return sh;
  }

  w.PERSONA = {
    open: open,               // function () — 打开画像页（没有则引导生成）
    has: has,                 // function () — 是否已经生成并保存过
    summaryLine: summaryLine  // function () — 「我的」列表用的一行摘要，没有则 ''
  };
})(window);

</script>
<script>
/* ===== remind.js ===== */
/* 语学 — 学习提醒（应用内）
 *
 * 到设定时间、今天又还没达标时，打开或切回 App 会提醒一次，一天只提醒一次。
 *
 * 为什么是「应用内」：这个安装包的原生外壳（com.yuxue.app 的 MainActivity + Bridge）
 * 里没有任何通知相关的代码 —— 没有 Notification、没有 Service、没有广播接收器，
 * 也没有 WorkManager/AlarmManager。WebView 里的 JS 无法凭空发出系统通知，
 * 那需要往原生壳里加代码并重新编译。所以这里做到的是：
 *   · 打开 App / 从后台切回来时，到点且没达标就提醒；
 *   · 触发一次「系统级」的触感与提示，尽量让人注意到；
 *   · 在「我的」和设置里能看到今天的进度与提醒状态。
 */
(function (w) {
  'use strict';

  var CHECK_GAP = 60 * 1000;      // 同一分钟内不重复检查
  var lastCheck = 0;
  var showing = false;

  function goalText() {
    var g = DB.goal();
    if (!g.on) return '还没设每日目标，可以在「设置 → 通用」里设一个。';
    if (g.hit) return '今天的 ' + g.target + ' 题目标已经完成，做得不错。';
    return '今天的 ' + g.target + ' 题目标还差 ' + g.left + ' 题。';
  }

  function show() {
    if (showing) return null;
    showing = true;
    var g = DB.goal();
    var t = DB.today();
    var streak = DB.goalStreak ? DB.goalStreak() : 0;
    var r = DB.settings().remind || {};
    var body = U.h('div');

    body.appendChild(U.h('div', { class: 'hintbox', text: '这是你在「设置 → 通用 → 学习提醒」里打开的提醒（每天 ' + (r.time || '20:00') + '）。' }));
    body.appendChild(U.h('div', { class: 'grid2 mb12' },
      U.h('div', { class: 'stat' },
        U.h('div', { class: 'v pri', text: String(t.n) }),
        U.h('div', { class: 'k', text: '今日已刷' })),
      U.h('div', { class: 'stat' },
        U.h('div', { class: 'v ' + (g.on && g.hit ? 'ok' : ''), text: g.on ? String(g.target) : '—' }),
        U.h('div', { class: 'k', text: '今日目标' }))
    ));
    body.appendChild(U.h('div', { class: 'card tight' },
      U.h('div', { class: 'kv' },
        U.h('span', { class: 'k', text: '当前进度' }),
        U.h('span', { class: 'v', text: g.on ? (g.done + ' / ' + g.target + ' · ' + g.pct + '%') : '未设目标' })),
      U.h('div', { class: 'kv' },
        U.h('span', { class: 'k', text: '今日正确率' }),
        U.h('span', { class: 'v', text: t.n ? t.acc + '%' : '—' })),
      streak ? U.h('div', { class: 'kv' },
        U.h('span', { class: 'k', text: '连续达标' }),
        U.h('span', { class: 'v', text: streak + ' 天' })) : null,
      U.h('div', { class: 'kv' },
        U.h('span', { class: 'k', text: '待复习错题' }),
        U.h('span', { class: 'v', text: DB.state.wrong.filter(function (x) { return !x.fixed; }).length + ' 题' }))
    ));
    body.appendChild(U.h('div', { class: 'md mt8', html: U.md(goalText()) }));

    var sh;
    var f = U.h('div', { class: 'btn-row' });
    f.appendChild(U.h('button', { class: 'btn ghost', text: '今天不再提醒', onclick: function () { sh.close(); } }));
    f.appendChild(U.h('button', {
      class: 'btn primary', text: '现在就去刷题', onclick: function () {
        sh.close();
        App.tab('home');
        if (w.Feed && Feed.onShow) Feed.onShow();
      }
    }));
    sh = U.sheet({
      title: '该学习啦', body: body, footer: f,
      onClose: function () { showing = false; }
    });
    return sh;
  }

  /**
   * 打开 App / 切回前台时调用。
   * force=true 忽略节流（用户刚从后台回来时用）。
   */
  function check(force) {
    try {
      var now = Date.now();
      if (!force && now - lastCheck < CHECK_GAP) return false;
      lastCheck = now;
      if (!DB.remindDue || !DB.remindDue()) return false;
      DB.remindDone();
      try { FX.warn(); } catch (e) { }
      // 稍等一下再弹：别和启动动画、首题加载抢焦点
      setTimeout(function () { show(); }, 1200);
      return true;
    } catch (e) { return false; }
  }

  /** 手动触发一次（设置页的「立即试一下」）。 */
  function preview() {
    showing = false;
    return show();
  }

  w.REMIND = { check: check, preview: preview };
})(window);

</script>

  /** 一次最多开多少题去重做/重刷（按钮文案与实际数量必须一致，别写「全部」却只给 20 题） */
  var DRILL_CAP = 20;

  function drillLabel(verb, total) {
    var n = Math.min(total, DRILL_CAP);
    return n >= total ? (verb + '全部（' + total + '）') : (verb + '前 ' + n + ' 题（共 ' + total + '）');
  }

  // ---------------------------------------------------------------- 个人信息
  function editProfile() {
    var p = DB.state.profile;
    var nick = U.input(p.nickname, '你的昵称');
    var avatar = ICON.has(p.avatar) ? p.avatar : 'book';
    var avBox = U.h('div', { class: 'chips' });
    ICON.avatars.forEach(function (a) {
      var c = U.h('button', { class: 'avatar-btn' + (a === avatar ? ' on' : ''), html: ICON(a, 24) });
      c.addEventListener('click', function () {
        avatar = a;
        Array.prototype.forEach.call(avBox.children, function (x) { x.classList.remove('on'); });
        c.classList.add('on');
      });
      avBox.appendChild(c);
    });
    var stages = ['', '小学', '初中', '高中', '大学', '考研'];
    var stage = U.h('select');
    stages.forEach(function (s) { stage.appendChild(U.h('option', { value: s, text: s || '未设置' })); });
    stage.value = p.stage || '';
    var grade = U.input(p.grade, '年级，如 八年级');
    /* 数字键盘：年龄只用来把推荐调得更贴合（没填学段时按年龄推断） */
    var age = U.input(p.age, '年龄，如 15');
    age.setAttribute('inputmode', 'numeric');
    age.setAttribute('type', 'number');
    var target = U.input(p.target, '目标，如 中考 / 考研 408');
    var bio = U.h('textarea', { rows: 2, placeholder: '备注（可选）' });
    bio.value = p.bio || '';

    var body = U.h('div');
    body.appendChild(U.field('头像', avBox));
    body.appendChild(U.field('昵称', nick));
    body.appendChild(U.h('div', { class: 'grid2' }, U.field('学段', stage), U.field('年级', grade)));
    body.appendChild(U.field('年龄', age, '用来判断该给你出什么阶段的题'));
    body.appendChild(U.field('学习目标', target, '会作为出题背景，让 AI 更贴合你的考试方向'));
    body.appendChild(U.field('备注', bio));

    var sh;
    sh = U.sheet({
      title: '编辑个人信息', body: body,
      footer: (function () {
        var f = U.h('div', { class: 'btn-row' });
        f.appendChild(U.h('button', { class: 'btn ghost', text: '取消', onclick: function () { sh.close(); } }));
        f.appendChild(U.h('button', { class: 'btn primary', text: '保存', onclick: function () {
          // 逐字段写回：以后再加新字段也不会被这里覆盖掉
          var np = DB.state.profile || (DB.state.profile = {});
          np.nickname = nick.value.trim() || '学习者';
          np.avatar = avatar;
          np.stage = stage.value;
          np.grade = grade.value.trim();
          np.age = String(age.value || '').replace(/[^0-9]/g, '').slice(0, 2);
          np.target = target.value.trim();
          np.bio = bio.value.trim();
          DB.save(); sh.close(); render(); U.toast('已保存', 'ok');
        } }));
        return f;
      })()
    });
  }

    if (!w.ACH) { U.toast('成就模块未加载', 'bad'); return; }
    var body = U.h('div');
    var onlyGot = false;
    var sh;
    function draw() {
      U.clear(body);
      ACH.invalidate();
      // 成就墙也有些成就和答题无关（收藏 10 题、建 3 个题库、清错题、报错…），
      // 以前只有答完一题才会 check，这些成就会顶着 100% 的进度条却一直不解锁。
      var fresh = ACH.check();
      if (fresh.length) {
        FX.done();
        U.toast('解锁成就 · ' + fresh[0].name + (fresh.length > 1 ? ' 等 ' + fresh.length + ' 项' : ''), 'ok', 2600);
      }
      var st = ACH.stats();
      body.appendChild(U.h('div', { class: 'card ach-top' },
        U.h('div', { class: 'row' },
          U.h('div', { class: 'ach-lv', text: 'Lv.' + st.level }),
          U.h('div', { class: 'grow' },
            U.h('div', { class: 'row' },
              U.h('div', { class: 'grow small', text: '等级经验' }),
              // 进度条是「本级内」的进度，文字也要用本级内的差值，
              // 直接写 st.xp / st.levelNext 会和进度条对不上。
              U.h('div', { class: 'tiny muted', text: Math.max(0, st.xp - st.levelBase) + ' / ' + Math.max(1, st.levelNext - st.levelBase) })
            ),
            U.h('div', { class: 'bar mt4' }, U.h('i', { style: { width: st.levelPct + '%' } }))
          )
        ),
        U.h('div', { class: 'grid4 mt12' },
          U.h('div', { class: 'center' }, U.h('div', { class: 'ach-k', text: String(st.n) }), U.h('div', { class: 'tiny muted', text: '刷题' })),
          U.h('div', { class: 'center' }, U.h('div', { class: 'ach-k', text: st.n ? st.acc + '%' : '—' }), U.h('div', { class: 'tiny muted', text: '正确率' })),
          U.h('div', { class: 'center' }, U.h('div', { class: 'ach-k', text: st.streak + '' }), U.h('div', { class: 'tiny muted', text: '连续天' })),
          U.h('div', { class: 'center' }, U.h('div', { class: 'ach-k', text: Math.floor(st.minutes) + '' }), U.h('div', { class: 'tiny muted', text: '分钟' }))
        )
      ));

      var all = ACH.list();
      var gotN = all.filter(function (a) { return a.got; }).length;
      body.appendChild(U.h('div', { class: 'row mb8' },
        U.h('div', { class: 'grow small muted', text: '已解锁 ' + gotN + ' / ' + all.length }),
        U.h('button', { class: 'chip' + (onlyGot ? ' on' : ''), text: onlyGot ? '只看已解锁' : '全部成就', onclick: function () { onlyGot = !onlyGot; draw(); } })
      ));
      all.forEach(function (a) {
        if (onlyGot && !a.got) return;
        body.appendChild(U.h('div', { class: 'ach-row' + (a.got ? ' got' : '') },
          U.h('div', { class: 'ach-ico', html: ICON(a.icon, 20) }),
          U.h('div', { class: 'grow' },
            U.h('div', { class: 'row' },
              U.h('div', { class: 'grow ach-n', text: a.name }),
              a.got ? U.h('span', { class: 'chip on xs', text: '已解锁' }) : U.h('span', { class: 'tiny muted', text: a.cur + ' / ' + a.total })
            ),
            U.h('div', { class: 'tiny muted mt4', text: a.desc }),
            a.got ? null : U.h('div', { class: 'bar mt6' }, U.h('i', { style: { width: a.pct + '%' } }))
          )
        ));
      });
      body.appendChild(U.h('div', { class: 'hintbox mt12', text: '成就只看真实记录：刷题数量、正确率、坚持天数、错题清理、收藏与自建题库。数据都在这台手机上，不会上传。' }));
    }
    draw();
    sh = U.sheet({ title: '成就墙', body: body });
  }
