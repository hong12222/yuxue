      goal: [p.target, p.bio].filter(Boolean).join(' ')
    };
  };

  /** 知识点全集（TAX.points 在 bank.js 里是函数，这里兼容两种写法） */
  function allPoints() {
    try {
      var p = TAX.points;
      return (typeof p === 'function' ? p() : p) || [];
    } catch (e) { return []; }
  }

  var _subs = null;
  /** 全部科目名（去重）。 */
  RECO.subjects = function () {
    if (_subs) return _subs;
    var seen = {}, out = [];
    allPoints().forEach(function (p) {
      var s = p.subject || '';
      if (s && !seen[s]) { seen[s] = 1; out.push(s); }
    });
    _subs = out;
    return _subs;
  };

  /**
   * 目标里提到的科目 —— 用户不会把科目名写全（「考研 408」而不是「计算机408综合」），
   * 所以除了整名匹配，还认科目名里的数字/英文（408）和两字词（数学）。
   */
  function subjectHit(sub, g) {
    var ns = norm(sub);
    if (!ns || g.indexOf(ns) >= 0) return true;
    var m = ns.match(/[A-Za-z0-9]{2,}/g) || [];
    var i;
    for (i = 0; i < m.length; i++) if (g.indexOf(m[i]) >= 0) return true;
    for (i = 0; i + 2 <= ns.length; i++) {
      var c = ns.slice(i, i + 2);
      if (/^[\u4e00-\u9fa5]{2}$/.test(c) && g.indexOf(c) >= 0) return true;
    }
    return false;
  }

  /**
   * 目标/备注里提到的科目与知识点关键词 —— 用来判断"这题跟我想学的东西有没有关系"。
   * 例：目标写「考研 408」，会命中科目「计算机408综合」与相关知识点关键词。
   */
  RECO.goalHits = function (goal) {
    var g = norm(goal);
    if (!g) return { subjects: [], words: [] };
    var subjects = [];
    RECO.subjects().forEach(function (s) { if (subjectHit(s, g)) subjects.push(s); });
    var words = [];
    function push(v) {
      var k = norm(v);
      if (k.length >= 2 && words.indexOf(k) < 0) words.push(k);
    }
    (allPoints()).forEach(function (p) {
      if (g.indexOf(norm(p.name)) >= 0) push(p.name);
      String(p.keywords || '').split(/[，,、;；\/|]+/).forEach(function (k) {
        if (k && g.indexOf(norm(k)) >= 0) push(k);
      });
    });
    return { subjects: subjects, words: words };
  };

  /**
   * 按「我的」里的资料调权：
   *  · 学段 —— 资料里写了学段（或能由年龄推断），就不推别的学段的题；
   *  · 目标 —— 跟目标有关的加权，目标已经明确锁到某些科目时，无关的压到很低（几乎不出）；
   *  · 划走 —— 某类题被划走多次，说明不想学这类，按次数降权。
   */
  function applyProfile(map) {
    var prof = RECO.prof();
    var hits = RECO.goalHits(prof.goal);
    var goalOn = !!(hits.subjects.length || hits.words.length);
    var st = prof.stage ? TAX.stageByName(prof.stage) : null;
    var keys = Object.keys(map);

    if (st) {
      var keep = keys.filter(function (k) {
        var e = map[k];
        return !e.stageId || e.stageId === st.id;
      });
      if (keep.length >= 3 && keep.length < keys.length) {
        keys.forEach(function (k) { if (keep.indexOf(k) < 0) delete map[k]; });
        keys = keep;
      }
    }

    keys.forEach(function (k) {
      var e = map[k];
      if (goalOn) {
        var hitSub = hits.subjects.indexOf(e.subject) >= 0;
        var hitWord = hits.words.some(function (wd) {
          return norm(e.name).indexOf(wd) >= 0 || norm(e.keywords).indexOf(wd) >= 0;
        });
        if (hitSub || hitWord) { e.w *= 1.8; e.wNote = '贴合你的目标'; }
        else if (hits.subjects.length) e.w *= 0.1;      // 目标是别的东西：这类几乎不推
        else e.w *= 0.45;                               // 只认出关键词：轻压，留点拓展
      }
      var sk = DB.skipOf ? DB.skipOf(e.name) : 0;
      if (sk) e.w *= 1 / (1 + sk * 0.8);
      var ssk = DB.skipSubject ? DB.skipSubject(e.subject) : 0;
      if (ssk) e.w *= 1 / (1 + ssk * 0.3);
      if (e.w < 0.02) e.w = 0.02;                       // 不清零，兜底还能推得出东西
    });
  }

  RECO.cfg = function () {
    var ui = DB.settings().ui || {};
    var r = ui.reco || {};
    return {
      banks: r.banks !== false,
      recent: r.recent !== false,
      weak: r.weak !== false,
      stage: r.stage !== false,
      strength: U.clamp(U.num(r.strength, 2), 1, 3),   // 1 保守 / 2 均衡 / 3 激进
      recentW: U.clamp(U.num(r.recentWindow, 120), 30, 400)
    };
  };

  /**
   * 收集候选知识点。返回 [{name, subject, stage, grade, w, why, from}]，同名的会合并权重。
   * from ∈ banks | recent | weak | stage
   */
  RECO.candidates = function () {
    var c = RECO.cfg();
    var map = {};
    var counts = { banks: 0, recent: 0, weak: 0, stage: 0 };

    function add(p, weight, why, from) {
      if (!p || !p.name) return;
      var k = norm(p.name).slice(0, 28);
      if (!k) return;
      var e = map[k];
      if (!e) {
        e = map[k] = {
          name: p.name, subject: p.subject || '', stage: p.stage || '', grade: p.grade || '',
          stageId: p.stageId || '', keywords: p.keywords || '', sample: p.sample || '',
          w: 0, whys: [], froms: {}, byFrom: {}, whyOf: {}
        };
      }
      // 补全信息（题库里给的知识点常常缺 stage/grade）
      if (!e.subject && p.subject) e.subject = p.subject;
      if (!e.stage && p.stage) e.stage = p.stage;
      if (!e.grade && p.grade) e.grade = p.grade;
      if (!e.stageId && p.stageId) e.stageId = p.stageId;
      if (!e.keywords && p.keywords) e.keywords = p.keywords;
      if (!e.sample && p.sample) e.sample = p.sample;
      e.w += weight;
      if (from) {
        e.byFrom[from] = (e.byFrom[from] || 0) + weight;   // 哪个来源贡献最大，就用它当主因
        if (why) e.whyOf[from] = why;
        if (!e.froms[from]) { e.froms[from] = 1; counts[from]++; }
      }
    }

    // ---------------------------------------------------------------- 1. 我的题库
    if (c.banks) {
      (DB.state.banks || []).forEach(function (b) {
        var base = b.isDefault ? 4 : 3;
        if ((b.cached || []).length >= 3) base += 1;      // 有缓存说明确实在用
        Bank.pointsOf(b).forEach(function (p) {
          add(p, base, '我的题库 · ' + b.name, 'banks');
        });
      });
    }

    // ---------------------------------------------------------------- 2. 最近刷题（越新越重，错的再加权）
    if (c.recent) {
      var all = DB.state.records || [];
      var recs = all.slice(-c.recentW);
      var n = recs.length;
      var perPoint = {};
      recs.forEach(function (r, i) {
        var name = r.point || '';
        if (!name) return;
        var k = norm(name).slice(0, 28);
        var e = perPoint[k] || (perPoint[k] = {
          p: { name: name, subject: r.subject || '', stage: r.stage || '', grade: r.grade || '' },
          w: 0, missed: false
        });
        var fresh = n > 1 ? (i + 1) / n : 1;               // 0→旧 1→新
        var w = (0.8 + fresh * 1.8) * (c.strength / 2);
        if (!r.correct) { w += 1.5; e.missed = true; }     // 做错过的最该再练
        if (r.givenUp) { w += 0.6; e.missed = true; }      // "我不会"的更该补
        e.w += Math.min(w, 5);
      });
      Object.keys(perPoint).forEach(function (k) {
        var e = perPoint[k];
        // 同一知识点在一段时间里反复出现，权重上限 8，避免单个点刷屏
        add(e.p, Math.min(e.w, 8), e.missed ? '最近做错过' : '最近在练', 'recent');
      });
    }

    // ---------------------------------------------------------------- 3. 薄弱知识点
    if (c.weak) {
      DB.weakPoints(2, 14).forEach(function (p) {
        add({ name: p.point, subject: p.subject, stage: p.stage, grade: '' },
          2.4 + (c.strength - 1) * 0.9, '正确率 ' + p.acc + '%', 'weak');
      });
    }

    // ---------------------------------------------------------------- 4. 学段拓展（兜底 + 拓宽）
    if (c.stage) {
      var need = 6 - Math.min(6, Object.keys(map).length);
      var extra = need > 0 ? need + 3 : 2;
      TAX.randomPoints(extra).forEach(function (p) {
        add(p, 1.2, '按你的学段拓展', 'stage');
      });
    }

    // ---------------------------------------------------------------- 5. 按我的资料调权（学段 / 目标 / 划走）
    applyProfile(map);

    var out = [];
    Object.keys(map).forEach(function (k) {
      var e = map[k];
      e.w = Math.round(e.w * 100) / 100;
      // 主因 = 贡献权重最大的那个来源，其次才是先来的
      var order = Object.keys(e.byFrom).sort(function (a, b) { return e.byFrom[b] - e.byFrom[a]; });
      order.forEach(function (f) { if (e.whyOf[f] && e.whys.indexOf(e.whyOf[f]) < 0 && e.whys.length < 3) e.whys.push(e.whyOf[f]); });
      e.why = e.wNote || e.whys[0] || '为你推荐';
      e.from = order[0] || 'stage';
      delete e.byFrom; delete e.whyOf;
      out.push(e);
    });
    counts.total = out.length;
    RECO._counts = counts;
    return out;
  };

  RECO.counts = function () {
    if (!RECO._counts) RECO.candidates();
    return RECO._counts;
  };

  /** 按权重不放回抽样 n 个知识点。 */
  function weightedPick(pool, n) {
    var list = pool.slice(), out = [];
    while (out.length < n && list.length) {
      var total = 0, i;
      for (i = 0; i < list.length; i++) total += list[i].w;
      var r = Math.random() * total, idx = list.length - 1;
      for (i = 0; i < list.length; i++) {
        r -= list[i].w;
        if (r <= 0) { idx = i; break; }
      }
      out.push(list.splice(idx, 1)[0]);
    }
    return out;
  }

  /** 本次要刷的知识点（默认 3 个）。 */
  RECO.points = function (n) {
    n = U.clamp(U.num(n, 3), 1, 8);
    var cands = RECO.candidates();
    if (!cands.length) return TAX.randomPoints(n);
    var picked = weightedPick(cands, n);
    // 同一科目最多占一半，避免一批题全扎在一科上
    var maxPerSubject = Math.max(1, Math.ceil(n / 2));
    var bySub = {}, out = [], dropped = [];
    picked.forEach(function (p) {
      var s = p.subject || '';
      bySub[s] = (bySub[s] || 0) + 1;
      if (s && bySub[s] > maxPerSubject) { dropped.push(p); return; }
      out.push(p);
    });
    if (out.length < n) {
      // 补位时先避开刚被压下去的同一科目，否则「最多占一半」等于没生效
      // （候选里若某科占绝大多数，补位几乎必然又抽回它）。
      var spare = cands.filter(function (p) { return out.indexOf(p) < 0 && dropped.indexOf(p) < 0; });
      out = out.concat(weightedPick(spare, n - out.length));
      if (out.length < n) {
        var rest = weightedPick(cands.filter(function (p) { return out.indexOf(p) < 0; }), n - out.length);
        out = out.concat(rest);
      }
    }
    return out.map(function (p) {
      return {
        name: p.name, subject: p.subject, stage: p.stage, grade: p.grade,
        stageId: p.stageId, keywords: p.keywords, sample: p.sample,
        why: p.why, from: p.from
      };
    });
  };

  /** 给设置页看的确定性榜单（按权重排序，不抽样）。 */
  RECO.top = function (n) {
    var c = RECO.candidates().slice();
    c.sort(function (a, b) { return b.w - a.w || a.name.localeCompare(b.name); });
    return c.slice(0, n || 6);
  };

  /** 空状态说明：为什么暂时推荐不出东西。 */
  RECO.summary = function () {
    var c = RECO.counts();
    var bits = [];
    if (c.banks) bits.push('我的题库 ' + c.banks + ' 个知识点');
    if (c.recent) bits.push('最近刷题 ' + c.recent + ' 个');
    if (c.weak) bits.push('薄弱点 ' + c.weak + ' 个');
    if (c.stage) bits.push('学段拓展 ' + c.stage + ' 个');
    return bits.join(' · ') || '数据还很少，先用学段随机';
  };

  w.RECO = RECO;
})(window);

</script>
<script>
/* ===== feed.js ===== */
/* 语学 — 刷题（无限流）：离线优先、AI 自动切换、报错 / 收藏 / 斩、我不会、暂时不做、划走重刷。 */
(function (w) {
  'use strict';

  var feedEl = null, tailEl = null, chipEl = null, list = [], loading = false, genCount = 0, appendSeq = 0;
  var seenStems = [], deferred = [], deferCount = {}, lastTip = 0, tipTimer = null;
  var session = null, source = null;
  // 每次重新开一轮就 +1：过期的出题响应会被丢掉，避免题目顺序错乱
  var genEpoch = 0, scrollTimer = null, aiTimer = null, scrollRun = null, settleTimer = null;

  /** 「跳过的题」最多记这么多道，取回时才不会一次涌进来一大片 */
  var DEFER_CAP = 12;

  /**
   * 定题模式：错题重练 / 从题库直接开刷这类「题目已经定好」的一轮。
   * 这期间不能让后台的 AI 出题往队列里插无关的新题，否则专项练习里会混进别的题。
   * 用户点末尾的「继续加载」或重新开一轮就退出定题模式。
   */
  var seedMode = false;

  var TIPS = [
    '正在挑选合适的知识点…',
    '正在组织题干与选项…',
    '正在核对答案与解析…',
    '马上就好，可以先回看上一题的解析…',
    '出题中，稍等片刻…'
  ];
  var OFFLINE_TIPS = [
    '正在从内置题库取题…',
    '接口暂时没响应，先用内置题库继续…',
    '内置题库优先，不影响继续刷题…'
  ];

  function S() { return DB.settings(); }
  function batch() { return Math.max(2, U.num(S().gen.batch, 5)); }

  /**
   * 兜底：把不合规的题修好，修不好就丢掉。
   *
   * 题目来源不止 AI 出题（那条路会在 ai.js 里规范化），还有：
   *   · 题库离线缓存 b.cached
   *   · 从备份 JSON 导入的题库
   *   · 错题本里的历史题
   * 这些都没经过校验，只要有一张题 type 是 choice 却没有 options，
   * 渲染时就会抛异常，整批题目一起铺不出来（首页留空）。所以进队列前统一过一遍。
   */
  function safeQuestion(q) {
    if (!q || typeof q !== 'object') return null;
    if (!q.stem || !String(q.stem).trim()) return null;
    var L = 'ABCDEF';
    if (q.type === 'choice') {
      var opts = Array.isArray(q.options) ? q.options.filter(function (o) {
        return o != null && String(o).trim() !== '';
      }) : [];
      q.options = opts;
      if (opts.length < 2) {
        q.type = 'subjective';                 // 与 ai.js 的规范化规则保持一致
      } else {
        var a = q.answer == null ? '' : String(q.answer).toUpperCase();
        var i = L.indexOf(a);
        if (i < 0 || i >= opts.length) q.answer = '';   // 答案越界就当没有答案（显示参考答案）
      }
    }
    if (q.type === 'fill') {
      q.options = [];
      q.answer = q.answer == null ? '' : String(q.answer);
      if (!Array.isArray(q.accept)) q.accept = q.accept ? [String(q.accept)] : [];
      // 没有标准答案就退化成主观题，交给 AI 判
      if (!q.answer && !q.accept.length) { q.type = 'subjective'; q.referenceAnswer = q.referenceAnswer || ''; }
    } else if (q.type !== 'choice') {
      q.options = [];
      // rubric 可能是字符串（导入的旧数据），renderResult 里会直接 .map，那就抛异常，
      // 而且是在 settle 里抛的 —— 记录已经写了、页脚却停在「判定中…」，这张卡就废了。
      if (q.rubric != null && !Array.isArray(q.rubric)) q.rubric = [String(q.rubric)];
      if (!q.referenceAnswer && q.answer) q.referenceAnswer = String(q.answer);
    }
    return q;
  }

  // ---------------------------------------------------------------- source
  function recommendSrc() { return { type: 'recommend', label: '默认推荐' }; }

  function getSource() {
    var s = DB.state.feed.source;
    if (!s || s.type === 'random') {           // 2.1 起「随机题库」并入「默认推荐」
      s = recommendSrc();
      DB.state.feed.source = s;
    }
    source = s;
    return source;
  }
  function setSource(src) {
    source = src;
    DB.state.feed.source = src;
    DB.state.feed.queue = [];
    DB.save();
    updateTopLabel();
  }
  function sourceKey() { var s = getSource(); return s.type + '|' + (s.bankId || s.label || ''); }

  function recoPointCount() {
    var r = (S().ui || {}).reco || {};
    return U.clamp(U.num(r.points, 3), 1, 6);
  }

  function pointsFor(n) {
    var s = getSource();
    if (s.type === 'recommend') {
      var pts = RECO.points(recoPointCount());
      if (pts && pts.length) return pts;
      return TAX.randomPoints(n);
    }
    if (s.type === 'bank') {
      var b = Bank.get(s.bankId);
      if (b) return Bank.pointsOf(b);
      return TAX.randomPoints(n);
    }
    if ((s.type === 'points' || s.type === 'custom') && s.points && s.points.length) return s.points;
    return TAX.randomPoints(n);
  }

  function specFor(count) {
    var s = getSource();
    var pts = pointsFor(3);
    var weak = S().gen.preferWrong ? DB.weakPoints(2, 6) : [];
    var subject = '', stage = '', grade = '';
    if (pts.length) {
      subject = pts[0].subject || '';
      stage = pts[0].stage || '';
      grade = pts[0].grade || '';
      if (!pts.every(function (p) { return p.subject === subject; })) subject = '';
      if (!pts.every(function (p) { return p.stage === stage; })) { stage = ''; grade = ''; }
    }
    var spec = {
      stage: stage, grade: grade, subject: subject, points: pts,
      difficulty: S().gen.difficulty, weaknesses: weak,
      avoid: seenStems.slice(-16), label: s.label,
      source: s.type === 'bank' ? 'bank' : 'feed'
    };
    if (s.type === 'recommend') {
      var whys = [];
      pts.forEach(function (p) { if (p.why && whys.indexOf(p.why) < 0) whys.push(p.why); });
      spec.reco = true;
      spec.recoWhy = whys.slice(0, 2).join('、') || '为你推荐';
      spec.extra = '以下知识点是根据该学习者的题库、练习记录和薄弱点挑出来的，请优先覆盖：' +
        pts.map(function (p) { return p.name; }).join('、') +
        '。可以自然地结合相关前置知识点，但不要跳到他没学过的内容。';
    }
    return spec;
  }

  // ---------------------------------------------------------------- card
  function cardFor(q, index) {
    var st = {
      q: q, state: 'idle', picked: '', startedAt: Date.now(), answeredAt: 0, ms: 0,
      result: null, thread: [], recId: null, timerOn: false, defers: 0
    };
    st.inner = U.h('div', { class: 'qcard-inner' });
    st.foot = U.h('div', { class: 'qfoot' });
    st.el = U.h('div', { class: 'qcard' }, U.h('div', { class: 'feed-top-spacer' }), st.inner, st.foot);
    renderHead(st);
    renderBody(st);
    renderFoot(st);
    observe(st);
    return st;
  }

  var io = null;
  function observe(st) {
    if (!('IntersectionObserver' in w)) { st.startedAt = Date.now(); st.timerOn = true; return; }
    if (!io) {
      io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          var s = en.target.__st;
          if (!s) return;
          if (en.isIntersecting && en.intersectionRatio > 0.55) {
            s.timerOn = true;
            onVisible(s);
          } else if (!en.isIntersecting) {
            s.timerOn = false;
          }
        });
      }, { threshold: [0, 0.55, 1] });
    }
    st.el.__st = st;
    io.observe(st.el);
  }

  function onVisible(st) {
    if (st.state === 'idle' && !st.answeredAt) st.startedAt = Date.now();
    var idx = list.indexOf(st);
    if (idx >= 0) DB.state.feed.cursor = idx;
    // 自动读题：每张卡只读一次
    if (S().quiz.readAuto && !st.readOnce && st.state === 'idle' && !FX.isSpeaking()) {
      st.readOnce = 1;
      readCard(st, st.readBtn);
    }
    updateTail();
    // 剩余不足半批就继续出题
    if (remaining() <= Math.max(2, Math.floor(batch() / 2))) prefetch();
  }

  /**
   * 未作答就划走：留到后面再刷到。扫描当前卡片之前的未答题目。
   * 只在用户停下来之后调用（见 mount 里的滚动处理），滚动过程中不删卡，
   * 否则一边滚一边改 DOM 会让题目闪烁、吸附位置跳掉。
   * 删卡后按「当前卡片」的真实位置补偿滚动量，画面不会动。
   */
  function sweepSkipped() {
    var cur = cursorIndex();
    if (cur <= 0) return;
    var anchor = list[cur];
    var anchorTop = anchor ? cardTop(anchor.el) : 0;
    var viewTop = feedEl.scrollTop;
    var victims = list.slice(0, cur).filter(function (st) {
      if (st.state !== 'idle' || (st.defers || 0) >= 3) return false;
      // 只收「整张已经滚出屏幕上方」的卡。
      // 光标线以上的卡就删，会让内容高度紧贴着可视区突变，
      // scroll-snap 很容易把画面抓回去，看起来就是自己跳到了上面那道没做的题。
      return cardTop(st.el) + (st.el.offsetHeight || 0) <= viewTop;
    });
    if (!victims.length) return;
    // 上限要先算好再逐一放入：过滤阶段 deferred.length 一直没变，
    // 原来把判断写在 filter 里会让一次划走几十张时突破上限。
    var room = Math.max(0, DEFER_CAP - deferred.length);
    holdSnap();
    victims.forEach(function (st, i) {
      st.defers = (st.defers || 0) + 1;
      if (i < room) deferred.push({ q: st.q, at: appendSeq, kind: 'swept' });
      if (DB.skip) DB.skip(st.q);          // 划走多次 = 不想学这类，后续推荐降权
      removeCard(st, false);
    });
    if (anchor && anchor.el.parentNode) {
      feedEl.scrollTop = Math.max(0, feedEl.scrollTop + (cardTop(anchor.el) - anchorTop));
    }
    releaseSnap();
    updateTail();
  }

  function remaining() {
    var n = 0;
    for (var i = cursorIndex(); i < list.length; i++) if (list[i].state === 'idle') n++;
    return n;
  }

  function diffStars(d) {
    var s = '';
    for (var i = 1; i <= 5; i++) s += i <= d ? '●' : '○';
    return s;
  }

  function renderHead(st) {
    var q = st.q;
    var hd = st.inner.querySelector('.qhead');
    var box = U.h('div', { class: 'qhead' });
    if (q.subject) box.appendChild(U.h('span', { class: 'chip tag', text: q.subject }));
    if (q.grade) box.appendChild(U.h('span', { class: 'chip tag', text: q.grade }));
    box.appendChild(U.h('span', { class: 'chip tag', text: q.type === 'choice' ? '选择题' : (q.type === 'fill' ? '填空题' : '主观题') }));
    box.appendChild(U.h('span', { class: 'chip tag', text: '难度 ' + diffStars(q.difficulty) }));
    if (q.redo) {
      box.appendChild(U.h('span', { class: 'chip on xs', text: '重练' }));
    } else if (q.fromAI) {
      box.appendChild(U.h('span', { class: 'chip ai', text: 'AI 生成' }));
    } else if (q.fromOffline || q.source === 'offline') {
      box.appendChild(U.h('span', { class: 'chip warn', text: '离线题库' }));
    } else if (q.source === 'cache') {
      box.appendChild(U.h('span', { class: 'chip warn', text: '题库缓存' }));
    }
    if (q.recoWhy) box.appendChild(U.h('span', { class: 'chip rec', text: '推荐 · ' + q.recoWhy }));
    box.appendChild(actionsFor(st));
    if (hd) hd.replaceWith(box); else st.inner.appendChild(box);
    st.head = box;
  }

  /** 顶部操作：读题 / 报错 / 收藏 / 斩 */
  function actionsFor(st) {
    var q = st.q;
    var wrap = U.h('div', { class: 'qactions' });
    var readBtn = U.h('button', { class: 'act-btn', title: '读题', html: ICON('speaker', 17) });
    readBtn.addEventListener('click', function () { readCard(st, readBtn); });
    st.readBtn = readBtn;
    var favOn = DB.isFav(q);
    var favBtn = U.h('button', { class: 'act-btn' + (favOn ? ' on' : ''), title: '收藏', html: ICON(favOn ? 'starFill' : 'star', 17) });
    favBtn.addEventListener('click', function () {
      var on = DB.toggleFav(q, { bankName: q.bankLabel });
      favBtn.classList.toggle('on', on);
      favBtn.innerHTML = ICON(on ? 'starFill' : 'star', 17);
      FX.tap();
      U.toast(on ? '已收藏' : '已取消收藏');
    });
    var reportBtn = U.h('button', { class: 'act-btn' + (DB.isReported(q) ? ' danger' : ''), title: '报错', html: ICON('flag', 17) });
    reportBtn.addEventListener('click', function () { reportCard(st, reportBtn); });
    var chopBtn = U.h('button', { class: 'act-btn', title: '斩：已会，不再出现', html: ICON('sword', 17) });
    chopBtn.addEventListener('click', function () { chopCard(st); });
    var ui = S().ui || {};
    if (ui.btnRead !== false) wrap.appendChild(readBtn);
    if (ui.btnReport !== false) wrap.appendChild(reportBtn);
    if (ui.btnFav !== false) wrap.appendChild(favBtn);
    wrap.appendChild(chopBtn);
    return wrap;
  }

  /** 把这道题读出来：题干 + 选项；再点一次停止。 */
  function readText(q) {
    var s = String(q.stem || '');
    if (q.type === 'choice' && q.options && q.options.length) {
      s += '。选项：' + q.options.map(function (o, i) { return AI.LETTERS[i] + '、' + o; }).join('；') + '。';
    } else if (q.type === 'fill') {
      s += '。请填写答案。';
    } else if (q.type !== 'choice') {
      s += '。这是一道主观题。';
    }
    return s;
  }

  function readCard(st, btn) {
    if (FX.isSpeaking()) { FX.stopSpeak(); setReadBtn(st, false); return; }
    var ok = FX.speak(readText(st.q), { onend: function () { setReadBtn(st, false); } });
    if (!ok) { FX.warn(); U.toast('这台设备暂时不能朗读'); return; }
    setReadBtn(st, true);
  }

  function setReadBtn(st, on) {
    var b = st.readBtn;
    if (!b) return;
    b.classList.toggle('live', !!on);
    b.innerHTML = ICON(on ? 'speakerOff' : 'speaker', 17);
    b.title = on ? '停止朗读' : '读题';
  }

  /**
   * 题目正文。结构固定成两栏：.qcol-main 放题干，.qcol-side 放作答区与判定结果。
   * 手机上 CSS 把 .qbody 按块级排（看起来和以前完全一样），
   * 平板 / 横屏再变成左右两栏 —— 左边题干、右边选项，判定与解析也留在右边。
   */
  function renderBody(st) {
    var q = st.q;
    var body = st.body;
    if (!body) {
      body = U.h('div', { class: 'qbody' });
      st.colMain = U.h('div', { class: 'qcol qcol-main' });
      st.colSide = U.h('div', { class: 'qcol qcol-side' });
      body.appendChild(st.colMain);
      body.appendChild(st.colSide);
      st.body = body;
      st.inner.appendChild(body);
    } else {
      U.clear(st.colMain);
      U.clear(st.colSide);
    }

    st.colMain.appendChild(U.h('div', { class: 'qstem', html: U.esc(q.stem) }));

    if (q.type === 'choice') {
      st.opts = [];
      var grid = U.h('div', { class: 'opts-grid' });
      (Array.isArray(q.options) ? q.options : []).forEach(function (o, i) {
        var L = AI.LETTERS[i];
        var b = U.h('button', { class: 'opt', 'data-l': L },
          U.h('span', { class: 'key', text: L }),
          U.h('span', { class: 'grow', text: o })
        );
        b.addEventListener('click', function () { choose(st, L); });
        st.opts.push(b);
        grid.appendChild(b);
      });
      st.colSide.appendChild(grid);
      st.input = null;
    } else if (q.type === 'fill') {
      // 填空题：单行输入，回车即提交（本地判分，秒出结果）
      var wrap = U.h('div', { class: 'fill-wrap' });
      var inp = U.h('input', {
        class: 'fill-input', type: 'text', placeholder: '在这里填写答案…',
        autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false'
      });
      inp.addEventListener('input', function () {
        var btn = st.foot.querySelector('[data-role=submit]');
        if (btn) btn.disabled = !inp.value.trim();
      });
      inp.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') { ev.preventDefault(); if (inp.value.trim()) submit(st); }
      });
      wrap.appendChild(inp);
      if (q.hint) wrap.appendChild(U.h('div', { class: 'fill-hint', text: '提示：' + q.hint }));
      st.input = inp;
      st.colSide.appendChild(wrap);
    } else {
      var ta = U.h('textarea', { placeholder: '在此写出你的解答思路或答案…', rows: 5 });
      ta.addEventListener('input', function () {
        var btn = st.foot.querySelector('[data-role=submit]');
        if (btn) btn.disabled = !ta.value.trim();
      });
      ta.addEventListener('focus', function () {
        setTimeout(function () { try { st.el.scrollIntoView({ block: 'start' }); } catch (e) { } }, 260);
      });
      st.input = ta;
      st.colSide.appendChild(ta);
    }
    st.result = U.h('div', { class: 'qresult' });
    st.colSide.appendChild(st.result);
  }

  function renderFoot(st) {
    var q = st.q;
    U.clear(st.foot);
    if (st.state === 'done') {
      var next = U.h('button', { class: 'btn primary grow', text: '下一题', onclick: function () { nextAfter(st); } });
      var fav = U.h('button', { class: 'btn ghost sm', title: '收藏', html: ICON(DB.isFav(q) ? 'starFill' : 'star', 16), onclick: function () {
        var on = DB.toggleFav(q, { bankName: q.bankLabel });
        this.innerHTML = ICON(on ? 'starFill' : 'star', 16);
        FX.tap();
        U.toast(on ? '已收藏' : '已取消收藏');
      } });
      var ask = U.h('button', { class: 'btn ghost sm', html: ICON('robot', 16) + '<span>提问</span>', onclick: function () { openDoubt(st); } });
      var varBtn = U.h('button', { class: 'btn ghost sm', html: ICON('sparkles', 16) + '<span>举一反三</span>', onclick: function () { variants(st); } });
      st.foot.appendChild(fav);
      st.foot.appendChild(ask);
      st.foot.appendChild(varBtn);
      st.foot.appendChild(next);
      renderTimer(st);
      return;
    }

    var timer = U.h('div', { class: 'timer', text: S().quiz.showTimer ? '0″' : '' });
    st.timerEl = timer;
    var hint = U.h('div', { class: 'grow qhint' });
    var giveUp = U.h('button', { class: 'btn ghost sm', html: ICON('answer', 16) + '<span>我不会</span>' });
    giveUp.addEventListener('click', function () { iDontKnow(st); });
    var later = null;
    if (q.type !== 'choice') {
      later = U.h('button', { class: 'btn ghost sm', html: ICON('skip', 16) + '<span>暂时不做</span>' });
      later.addEventListener('click', function () { doLater(st); });
    }
    var btn = U.h('button', { class: 'btn primary sm', text: q.type === 'choice' ? '提交答案' : '提交作答', 'data-role': 'submit' });
    btn.disabled = true;
    btn.addEventListener('click', function () { submit(st); });
    if (q.type === 'choice') {
      hint.appendChild(U.h('span', { text: S().quiz.tapSubmit ? '点击选项直接判定' : '选择后点提交' }));
      btn.disabled = !st.picked;
    } else if (q.type === 'fill') {
      hint.appendChild(U.h('span', { text: '填完按回车，或点右边提交' }));
      btn.disabled = !(st.input && st.input.value.trim());
    } else {
      hint.appendChild(U.h('span', { text: '自动评分' }));
    }
    st.submitBtn = btn;
    st.foot.appendChild(timer);
    st.foot.appendChild(hint);
    st.foot.appendChild(giveUp);
    if (later) st.foot.appendChild(later);
    st.foot.appendChild(btn);
  }

  function renderTimer(st) {
    if (!S().quiz.showTimer || !st.timerEl) return;
    var t = st.ms || (st.answeredAt ? st.answeredAt - st.startedAt : 0);
    st.timerEl.textContent = U.fmtDur(t);
  }

  // ---------------------------------------------------------------- answering
  function choose(st, L) {
    if (st.state !== 'idle') return;
    st.picked = L;
    if (st.opts) st.opts.forEach(function (o) { o.classList.toggle('sel', o.getAttribute('data-l') === L); });
    if (st.submitBtn) st.submitBtn.disabled = false;
    FX.select();
    if (S().quiz.tapSubmit) submit(st);
  }

  /**
   * 答对后自动翻页。这里必须用「刚答完的那张卡」，不能重新按光标取：
   * 1.1 秒内用户很可能已经滑到下一张，那时按光标取到的可能是另一张
   * （甚至是早就答对过、正在回看的题），会把用户莫名往前顶。
   */
  function autoNext(target) {
    setTimeout(function () {
      if (!S().quiz.autoNext) return;
      var st = target || list[cursorIndex()];
      if (st && st.el.parentNode && st.state === 'done' && st.res && st.res.correct) nextAfter(st);
    }, 1100);
  }

  function finishTiming(st) {
    st.answeredAt = Date.now();
    st.ms = Math.max(0, st.answeredAt - st.startedAt);
  }

  /** 提交（或 AI 判分失败后重试） */
  function submit(st, opts) {
    opts = opts || {};
    if (st.state !== 'idle') return;
    st.state = 'grading';
    if (!st.answeredAt) finishTiming(st);
    var q = st.q;
    var ans = q.type === 'choice' ? st.picked : (st.input ? st.input.value.trim() : '');
    st.answer = ans;
    if (st.submitBtn) { st.submitBtn.disabled = true; st.submitBtn.textContent = '判定中…'; }
    if (st.opts) st.opts.forEach(function (o) { o.style.pointerEvents = 'none'; });
    if (st.input) st.input.disabled = true;

    // 填空题本地判分（单词拼写、口算、单位换算）：不用等网络，也不用花 token。
    // 没有标准答案的填空题 gradeFill 会返回 null，自动退回下面的 AI 判分。
    var localFill = q.type === 'fill' ? AI.gradeFill(q, ans) : null;

    // 选择题有选项字母答案时本地判（快、不花 token）；答案没能解析成字母时交给 AI 阅卷。
    // 直接调 gradeLocal 会拿到 null，那条路就是「无论选哪个都判错」。
    var p = localFill ? Promise.resolve(localFill)
      : (q.type === 'choice' && q.answer)
        ? Promise.resolve(AI.gradeLocal(q, ans))
        : AI.grade(q, ans).catch(function (e) { return { __error: String(e && e.message || e) }; });

    p.then(function (res) {
      if (!res || res.__error) { gradeFailed(st, (res && res.__error) || '未能判定'); return; }
      settle(st, res, { givenUp: !!opts.givenUp });
    });
  }

  /** 我不会：直接看答案，按答错计入并进错题本。 */
  function iDontKnow(st) {
    if (st.state !== 'idle') return;
    st.state = 'grading';
    finishTiming(st);
    FX.warn();
    st.answer = '';
    if (st.opts) st.opts.forEach(function (o) { o.style.pointerEvents = 'none'; });
    if (st.input) st.input.disabled = true;
    if (st.submitBtn) st.submitBtn.disabled = true;
    settle(st, { score: 0, correct: false, comment: '这题先看答案，记住思路下次就会了。', mistakes: [], betterAnswer: '', givenUp: true },
      { givenUp: true });
  }

  function settle(st, res, opts) {
    // 主观题判分要走网络（最长 60 秒），用户等不及很可能中途点了「斩」或「报错」。
    // 那张卡已经被移除，晚到的判定结果不能再计入成绩，也不能塞进错题本。
    // 注意：trim() 回收旧卡时不会打这个标记，那种情况下记录要正常写。
    if (st.removed) return;
    var q = st.q;
    st.state = 'done';
    st.el.classList.add('done');   // 判定后允许把下滑手势交给整屏（下滑即下一题）
    st.res = res;
    res.givenUp = !!(opts && opts.givenUp);
    var rec = DB.addRecord({
      sessionId: session && session.id, bankId: q.bankId || '', bankName: q.bankLabel || getSource().label,
      point: q.point, subject: q.subject, stage: q.stage, grade: q.grade, type: q.type,
      difficulty: q.difficulty, stem: q.stem.slice(0, 160), userAnswer: st.answer || '',
      correct: !!res.correct, score: res.score == null ? (res.correct ? 100 : 0) : res.score, ms: st.ms,
      givenUp: !!res.givenUp
    });
    st.recId = rec.id;
    if (!res.correct && S().quiz.autoWrong) {
      DB.addWrong({ question: q, userAnswer: st.answer || '（未作答）', score: res.score, comment: res.comment, explanation: q.explanation, bankId: q.bankId, bankName: q.bankLabel });
    }
    if (S().quiz.vibrate || S().quiz.sound) FX.result(!!res.correct);
    renderResult(st, res);
    renderFoot(st);
    rememberQueue();
    updateTail();
    paintTodayStat();
    celebrateGoal();
    if (res.correct) autoNext(st);
    checkAch();
  }

  /* 每答完一题顺手看一眼有没有刚解锁的成就 */
  function checkAch() {
    if (!w.ACH) return;
    try {
      ACH.invalidate();
      var fresh = ACH.check();
      if (!fresh.length) return;
      FX.done();
      U.toast('解锁成就 · ' + fresh[0].name, 'ok');
      var body = U.h('div');
      body.appendChild(U.h('div', { class: 'tiny muted mb12', text: fresh.length > 1 ? '一次解锁了 ' + fresh.length + ' 个成就' : '做得好，继续保持' }));
      fresh.forEach(function (a) {
        body.appendChild(U.h('div', { class: 'ach-row got' },
          U.h('div', { class: 'ach-ico', html: ICON(a.icon, 20) }),
          U.h('div', { class: 'grow' },
            U.h('div', { class: 'ach-n', text: a.name }),
            U.h('div', { class: 'tiny muted', text: a.desc })
          )
        ));
      });
      U.sheet({ title: '获得成就', body: body });
    } catch (e) { }
  }

  function gradeFailed(st, msg) {
    st.state = 'idle';
    if (st.opts) st.opts.forEach(function (o) { o.style.pointerEvents = ''; });
    if (st.input) st.input.disabled = false;
    if (st.submitBtn) { st.submitBtn.disabled = false; st.submitBtn.textContent = '重新提交'; }
    U.clear(st.result);
    st.result.appendChild(U.h('div', { class: 'warnbox' },
      U.h('div', { text: '评分失败，本题未计入成绩：' + msg }),
      U.h('div', { class: 'mt8 btn-row' },
        U.h('button', { class: 'btn primary sm', text: '重试', onclick: function () { U.clear(st.result); submit(st); } }),
        U.h('button', { class: 'btn ghost sm', text: '检查接口设置', onclick: function () { Profile.openSettings('ai'); } })
      )
    ));
    U.toast('评分失败：' + msg, 'bad', 2600);
  }

  function renderResult(st, res) {
    var q = st.q;
    U.clear(st.result);
    var ok = !!res.correct;
    var partial = !ok && !res.givenUp && res.score >= 60;
    var v = U.h('div', { class: 'verdict ' + (ok ? 'ok' : (partial ? 'part' : 'bad')) },
      U.h('span', { class: 'ic-wrap', html: ICON(ok ? 'check' : (partial ? 'answer' : 'cross'), 19) }),
      U.h('span', { text: ok ? '回答正确' : (res.givenUp ? '已看答案' : (partial ? '部分正确' : '回答错误')) }),
      res.score != null && q.type !== 'choice' ? U.h('span', { class: 'sc', text: res.score + ' 分' }) : null
    );
    st.result.appendChild(v);

    if (q.type === 'choice') {
      var correctLetter = q.answer || '';
      if (st.opts) st.opts.forEach(function (o) {
        var L = o.getAttribute('data-l');
        o.style.pointerEvents = 'none';
        o.classList.remove('sel');
        if (L === correctLetter) o.classList.add('right');
        else if (L === st.picked) o.classList.add('wrong');
        else o.classList.add('dim');
      });
      if (!correctLetter && q.answerText) st.result.appendChild(U.h('div', { class: 'explain', html: '<span class="lbl">参考答案</span>：' + U.esc(q.answerText) }));
    } else if (q.type === 'fill') {
      var lines = ['<h4>正确答案</h4>' + U.esc(q.answer || '—')];
      if (q.accept && q.accept.length) {
        lines.push(q.accept.map(function (a) { return '· 也接受：' + U.esc(a); }).join('\n'));
      }
      if (!ok && st.answer) lines.push('你填写的是：' + U.esc(st.answer));
      st.result.appendChild(U.h('div', { class: 'explain', html: lines.join('\n\n') }));
    } else if (q.referenceAnswer) {
      st.result.appendChild(U.h('div', { class: 'explain', html: '<h4>参考答案</h4>' + U.esc(q.referenceAnswer) +
        (q.rubric && q.rubric.length ? '\n\n<h4>评分要点</h4>' + q.rubric.map(function (r) { return '· ' + U.esc(r); }).join('\n') : '') }));
    }

    if (res.comment) {
      st.result.appendChild(U.h('div', { class: 'explain', html: '<h4>点评</h4>' + U.esc(res.comment) +
        (res.mistakes && res.mistakes.length ? '\n\n' + res.mistakes.map(function (m) { return '· ' + U.esc(m); }).join('\n') : '') +
        (res.betterAnswer ? '\n\n<h4>更好的作答</h4>' + U.esc(res.betterAnswer) : '') }));
    }
    if (S().quiz.showExplain && q.explanation) {
      st.result.appendChild(U.h('div', { class: 'explain', html: '<h4>解析</h4>' + U.esc(q.explanation) }));
    }
    if (!ok && res.local) {
      var why = U.h('button', { class: 'btn ghost sm mb8', html: ICON('bulb', 15) + '<span>看详细讲解</span>' });
      why.addEventListener('click', function () {
        var self = this; self.disabled = true; self.textContent = '生成中…';
        AI.explain(q, st.answer).then(function (t) {
          st.result.insertBefore(U.h('div', { class: 'explain', html: '<h4>讲解</h4>' + U.esc(t) }), self.nextSibling);
          self.remove();
        }).catch(function (e) { self.disabled = false; self.innerHTML = ICON('bulb', 15) + '<span>看详细讲解</span>'; U.toast('失败：' + (e.message || e), 'bad'); });
      });
      st.result.appendChild(why);
    }
    st.result.appendChild(U.h('div', { class: 'tiny muted mt8', text: '用时 ' + U.fmtDur(st.ms) + (res.givenUp ? ' · 已加入错题本' : '') }));
    if (!S().quiz.autoNext) st.result.appendChild(U.h('div', { class: 'tiny muted swipe-hint', text: '下滑看下一题' }));
  }

  // ---------------------------------------------------------------- 斩 / 报错 / 暂不做
  function chopCard(st) {
    var q = st.q;
    DB.chop(q);
    FX.haptic('warn');
    U.toast('已斩：这道题不会再出现', 'ok');
    var nxt = neighborOf(st);
    st.removed = 1;                      // 判定还在路上：晚到的结果作废
    removeCard(st, true);
    updateTail();
    if (nxt && nxt.el.parentNode) scrollToCard(nxt, { instant: true });
    prefetch();
  }

  function reportCard(st) {
    var q = st.q;
    if (!AI.ready()) {
      var body = U.h('div');
      body.appendChild(U.h('div', { class: 'hintbox', text: '接口暂时不可用，无法自动复核。可以先记录下来，之后仍会保留在这道题的标记里。' }));
      var ta = U.h('textarea', { rows: 3, placeholder: '这道题哪里有问题？（可选）' });
      body.appendChild(ta);
      var sh1;
      sh1 = U.sheet({
        title: '报错', body: body,
        footer: (function () {
          var f = U.h('div', { class: 'btn-row' });
          f.appendChild(U.h('button', { class: 'btn ghost', text: '取消', onclick: function () { sh1.close(); } }));
          f.appendChild(U.h('button', { class: 'btn primary', text: '确认报错', onclick: function () {
            DB.reportQuestion(q, { reason: ta.value.trim() });
            sh1.close();
            U.toast('已记录，谢谢反馈', 'ok');
            st.removed = 1;
            removeCard(st, true);
            updateTail();
          } }));
          return f;
        })()
      });
      return;
    }
    U.busy('正在复核这道题…');
    AI.reviewQuestion(q).then(function (r) {
      U.busyHide();
      showReportVerdict(st, r);
    }).catch(function (e) {
      U.busyHide();
      U.toast('复核失败：' + (e.message || e), 'bad', 2600);
    });
  }

  function showReportVerdict(st, r) {
    var q = st.q;
    var body = U.h('div');
    body.appendChild(U.h('div', {
      class: r.hasProblem ? 'warnbox' : 'hintbox',
      html: '<b>' + (r.hasProblem ? '这道题可能有问题' : '这道题看起来没问题') + '</b>' +
        (r.severity && r.hasProblem ? '（严重程度：' + U.esc(r.severity) + '）' : '') + '<br>' + U.esc(r.reason || '')
    }));
    if (r.suggestion) body.appendChild(U.h('div', { class: 'explain', html: '<h4>建议</h4>' + U.esc(r.suggestion) }));
    body.appendChild(U.h('div', { class: 'explain', html: '<h4>原题</h4>' + U.esc(q.stem) }));
    if (q.options && q.options.length) {
      body.appendChild(U.h('div', { class: 'explain', html: q.options.map(function (o, i) { return AI.LETTERS[i] + '. ' + U.esc(o); }).join('\n') +
        '\n\n<h4>标注答案</h4>' + U.esc(q.answer || q.referenceAnswer || '') }));
    }
    var sh;
    sh = U.sheet({
      title: '复核结果', body: body,
      footer: (function () {
        var f = U.h('div', { class: 'btn-row' });
        f.appendChild(U.h('button', { class: 'btn ghost', text: '我理解了', onclick: function () { sh.close(); } }));
        f.appendChild(U.h('button', { class: 'btn primary', text: '确认报错', onclick: function () {
          DB.reportQuestion(q, { reason: r.reason, aiSaid: true });
          sh.close();
          U.toast('已记录，这道题不会再出现', 'ok');
          st.removed = 1;
          removeCard(st, true);
          updateTail();
          prefetch();
        } }));
        return f;
      })()
    });
  }

  /** 暂时不做：留到后面再刷到 */
  function doLater(st) {
    if (st.state !== 'idle') return;
    st.defers = (st.defers || 0) + 1;
    if (deferred.length < DEFER_CAP) deferred.push({ q: st.q, at: appendSeq, kind: 'later' });
    if (DB.skip) DB.skip(st.q);              // 主动跳过也算：这类题以后少推
    var nxt = neighborOf(st);
    holdSnap();
    removeCard(st, true);
    releaseSnap();
    updateTail();
    FX.tap();
    U.toast('已放到后面，稍后会再刷到', 'ok');
    if (nxt && nxt.el.parentNode) scrollToCard(nxt, { instant: true });
    else prefetch();
  }

  /** 卡片在队列里的下一张（删除前先取好，别用 indexOf 之后的下标算） */
  function neighborOf(st) {
    var i = list.indexOf(st);
    if (i < 0) return null;
    return list[i + 1] || null;
  }

  // ---------------------------------------------------------------- doubt
  function openDoubt(st) {
    var q = st.q;
    var thread = st.thread;
    var bodyEl = U.h('div');
    var chat = U.h('div', { class: 'chat' });
    bodyEl.appendChild(U.h('div', { class: 'hintbox', text: '对答案或解析有疑问？把疑问说清楚，它会重新审题，必要时纠正自己的答案。' }));
    bodyEl.appendChild(chat);
    var ta = U.h('textarea', { placeholder: '例如：我觉得 B 也对，因为……', rows: 3 });
    var s = U.sheet({
      title: '提问', page: true, body: bodyEl,
      footer: (function () {
        var f = U.h('div', { class: 'btn-row' });
        f.appendChild(U.h('div', { class: 'grow' }, ta));
        f.appendChild(U.h('button', { class: 'btn primary', text: '发送', onclick: function () { doSend(); } }));
        return f;
      })()
    });
    function bubble(role, text) {
      chat.appendChild(U.h('div', { class: 'bub ' + (role === 'user' ? 'me' : 'ai'), text: text }));
      bodyEl.scrollTop = bodyEl.scrollHeight;
    }
    function doSend() {
      var msg = ta.value.trim();
      if (!msg) { U.toast('请输入你的疑问'); return; }
      ta.value = '';
      thread.push({ role: 'user', content: msg });
      bubble('user', msg);
      var thinking = U.h('div', { class: 'bub ai', text: '正在重新审题…' });
      chat.appendChild(thinking);
      bodyEl.scrollTop = bodyEl.scrollHeight;
      AI.challenge(q, st.answer, thread.slice(0, -1), msg).then(function (r) {
        thinking.remove();
        thread.push({ role: 'assistant', content: r.reply });
        bubble('ai', r.reply);
        if (r.revised) {
          if (q.type === 'choice' && r.answer) {
            var L = String(r.answer).toUpperCase().replace(/[^A-F]/g, '').charAt(0);
            if (L) { q.answer = L; q.answerText = ''; }
          } else if (r.answer) { q.referenceAnswer = r.answer; q.answerText = r.answer; }
          if (r.explanation) q.explanation = r.explanation;
          bubble('ai', '已更正本题答案与解析，卡片已同步更新。');
          if (st.state === 'done') {
            var wasCorrect = st.res && st.res.correct;
            var nowCorrect = q.type === 'choice' ? (String(st.picked || '').toUpperCase() === q.answer) : wasCorrect;
            st.res.correct = nowCorrect;
            st.res.revised = true;
            updateRecord(st, nowCorrect);
            reRenderOptions(st);
            U.toast(nowCorrect && !wasCorrect ? '答案已更正，本题记为正确' : '答案已更正', 'ok');
          }
        }
      }).catch(function (e) {
        thinking.remove();
        bubble('ai', '出错：' + (e.message || e));
      });
    }
    ta.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) doSend(); });
    setTimeout(function () { ta.focus(); }, 320);
  }

  function updateRecord(st, correct) {
    if (!st.recId) return;
    var rs = DB.state.records;
    for (var i = rs.length - 1; i >= 0; i--) {
      if (rs[i].id === st.recId) {
        if (rs[i].correct !== correct) {
          var dk = U.dayKey(rs[i].ts);
          var d = DB.state.days[dk];
          if (d) d.correct = Math.max(0, d.correct + (correct ? 1 : -1));
          // 只有这条记录仍属于「当前这一轮」时才改会话计数：
          // 用户可能已经开始了新一轮（例如去刷错题重练），那时改的就不是它自己那一轮了。
          var cur = DB.state.current;
          if (cur && (!rs[i].sessionId || rs[i].sessionId === cur.id)) {
            cur.correct = Math.max(0, (cur.correct || 0) + (correct ? 1 : -1));
          }
        }
        rs[i].correct = correct;
        rs[i].revised = true;
        break;
      }
    }
    DB.save();
  }

  function reRenderOptions(st) {
    var q = st.q;
    if (q.type !== 'choice' || !st.opts) return;
    st.opts.forEach(function (o) {
      var L = o.getAttribute('data-l');
      o.classList.remove('right', 'wrong', 'dim', 'sel');
      if (L === q.answer) o.classList.add('right');
      else if (L === st.picked) o.classList.add('wrong');
      else o.classList.add('dim');
    });
    var v = st.result.querySelector('.verdict');
    if (v && st.res.correct) v.className = 'verdict ok';
  }

  // ---------------------------------------------------------------- variants
  function variants(st) {
    U.busy('正在生成变式题…');
    var epoch = genEpoch;                // 出题期间可能已经换了一轮（切题库 / 错题重练）
    AI.variants(st.q, 3).then(function (qs) {
      U.busyHide();
      if (epoch !== genEpoch) return;    // 上一轮的响应：丢掉，别插进新的一轮
      qs.forEach(function (q) {
        q.bankLabel = st.q.bankLabel;
        q.subject = q.subject || st.q.subject;
        q.stage = q.stage || st.q.stage;
        q.grade = q.grade || st.q.grade;
      });
      // 这张卡可能已经被斩掉或被 trim 回收：indexOf 会返回 -1，
      // 直接 +1 得到 0，变式题就插到最前面并把用户拉到第一题去了。
      var idx = list.indexOf(st);
      var at = idx < 0 ? list.length : idx + 1;
      insertCards(qs, at);
      U.toast('已插入 ' + qs.length + ' 道变式题', 'ok');
      goto(at);
    }).catch(function (e) {
      U.busyHide();
      U.confirm('举一反三失败', String(e.message || e) + '\n\n是否检查接口设置？', '去设置').then(function (yes) {
        if (yes) Profile.openSettings('ai');
      });
    });
  }

  function insertCards(qs, at) {
    var clean = [];
    (qs || []).forEach(function (q) { q = safeQuestion(q); if (q) clean.push(q); });
    qs = clean;
    var ref = list[at] ? list[at].el : null;
    qs.forEach(function (q, i) {
      var st = cardFor(q, at + i);
      list.splice(at + i, 0, st);
      if (ref && ref.parentNode) ref.parentNode.insertBefore(st.el, ref);
      else feedEl.insertBefore(st.el, tailEl);
    });
    updateTail();
  }

  /**
   * 冻结吸附：在视口上方增删卡片时，内容高度会突变，而 .feed 是 scroll-snap-type:y mandatory，
   * 吸附引擎会自己重新对齐到某个吸附点，常常把用户甩回上面的一张题。
   * 所以改 DOM 的这段时间先关掉吸附，补偿完滚动位置、等一帧再放开。
   */
  var snapHold = 0;
  function holdSnap() {
    snapHold++;
    if (feedEl && feedEl.classList) feedEl.classList.add('frozen');
  }
  function releaseSnap() {
    if (snapHold > 0) snapHold--;
    if (snapHold > 0) return;
    var run = function () {
      if (snapHold > 0) return;
      if (feedEl && feedEl.classList) feedEl.classList.remove('frozen');
    };
    if (typeof requestAnimationFrame === 'function') requestAnimationFrame(run);
    else setTimeout(run, 32);
  }

  function removeCard(st, compensate) {
    var idx = list.indexOf(st);
    if (idx < 0) return;
    var cur = cursorIndex();
    var hgt = st.el.offsetHeight || feedEl.clientHeight;
    var above = idx < cur;
    if (above) holdSnap();
    list.splice(idx, 1);
    if (io) { try { io.unobserve(st.el); } catch (e) { } }
    st.el.remove();
    if (compensate && above) feedEl.scrollTop = Math.max(0, feedEl.scrollTop - hgt);
    if (above) releaseSnap();
  }

  // ---------------------------------------------------------------- loading / tail
  var tailSig = null;

  /**
   * 末尾卡片（加载中 / 继续加载）。内容由签名决定：签名没变就不重建，
   * 否则每次滚动、每次卡片进入视口都会重建一遍，进度条动画重启、文案闪一下。
   */
  function updateTail() {
    if (!tailEl) return;
    var mode = loading ? (list.length ? 'loading' : 'first') : 'tail';
    var gen = !SRC.aiOnline();
    var arr = gen ? OFFLINE_TIPS : TIPS;
    var redoLeft = redoLeftCount();
    var sig = [mode, gen ? 1 : 0, AI.ready() ? 1 : 0, getSource().label, SRC.label(),
      mode === 'loading' || mode === 'first' ? lastTip % arr.length : '',
      mode === 'tail' ? deferred.length : '',
      mode === 'tail' && !deferred.length ? redoLeft : ''].join('|');
    if (sig === tailSig && tailEl.firstChild) return;
    tailSig = sig;
    U.clear(tailEl);
    if (mode === 'first') { firstLoading(); return; }
    if (mode === 'loading') {
      tailEl.appendChild(U.h('div', { class: 't-ic', html: ICON(gen ? 'database' : 'sparkles', 38) }));
      tailEl.appendChild(U.h('div', { class: 't-t', text: gen ? '正在准备题目…' : '正在出题…' }));
      tailEl.appendChild(U.h('div', { class: 'progress' }, U.h('i')));
      tailEl.appendChild(U.h('div', { class: 'tip', text: arr[lastTip % arr.length] }));
      tailEl.appendChild(U.h('div', { class: 't-d', text: '你可以上下滑动回看之前的题目' }));
      return;
    }
    var hasDeferred = deferred.length > 0;
    tailEl.appendChild(U.h('div', { class: 't-ic', html: ICON(hasDeferred ? 'refresh' : (redoLeft ? 'wrongbook' : 'cards'), 38) }));
    tailEl.appendChild(U.h('div', { class: 't-t', text: hasDeferred ? '还有 ' + deferred.length + ' 道没做的题' : (redoLeft ? '错题本里还有 ' + redoLeft + ' 道没掌握' : '继续加载更多题目') }));
    tailEl.appendChild(U.h('div', {
      class: 't-d',
      text: hasDeferred ? '点一下先把跳过的题捡回来，也可以继续加载新题'
        : (redoLeft ? '继续加载时会自动把做错的题排进来重练' : '点下面按钮，或继续上滑自动加载')
    }));
    var row = U.h('div', { class: 'mt16 btn-row', style: { maxWidth: '320px' } });
    row.appendChild(U.h('button', { class: 'btn primary', html: ICON('chevronDown', 16) + '<span>继续加载</span>', onclick: function () { prefetch(true); } }));
    if (hasDeferred) row.appendChild(U.h('button', { class: 'btn ghost', text: '取回跳过的', onclick: function () { reinsertDeferred(deferred.length); } }));
    else if (redoLeft) row.appendChild(U.h('button', { class: 'btn ghost', html: ICON('wrongbook', 15) + '<span>重练错题</span>', onclick: function () { redoNow(); } }));
    tailEl.appendChild(row);
  }

  /** 首屏加载界面：还没拿到题时不要让用户看到空屏。 */
  function firstLoading() {
    var gen = !SRC.aiOnline();
    var arr = gen ? OFFLINE_TIPS : TIPS;
    tailEl.appendChild(U.h('div', { class: 'feed-loading' },
      U.h('div', { class: 'fl-ic', html: ICON(gen ? 'database' : 'sparkles', 24) }),
      U.h('div', { class: 'fl-t', text: gen ? '正在准备题目' : '正在出题' }),
      U.h('div', { class: 'fl-d', text: getSource().label + (AI.ready() ? ' · ' + SRC.label() : ' · 先用内置题库') }),
      U.h('div', { class: 'progress' }, U.h('i')),
      U.h('div', { class: 'tip', text: arr[lastTip % arr.length] }),
      U.h('div', { class: 'fl-steps', html: '通常 <b>3–10 秒</b>。接口长时间没有响应时会自动改用内置题库，不会一直卡在这里。' })
    ));
  }

  /** 加载中的提示语元素：每次从 DOM 里取，避免指向已经被重建掉的旧节点。 */
  function tipEl() {
    if (!tailEl) return null;
    try { return tailEl.querySelector('.tip'); } catch (e) { return null; }
  }

  function tickTip() {
    if (!loading) return;
    var el = tipEl();
    if (!el) return;
    lastTip++;
    var arr = !SRC.aiOnline() ? OFFLINE_TIPS : TIPS;
    el.style.opacity = '0';
    setTimeout(function () {
      var cur = tipEl();
      if (cur) { cur.textContent = arr[lastTip % arr.length]; cur.style.opacity = '1'; }
    }, 300);
  }

  function reinsertDeferred(n) {
    if (!deferred.length) return;
    var take = deferred.splice(0, U.clamp(n || 3, 1, 6)).map(function (e) { return e.q; });
    var first = null;
    // 必须倒着插：insertAfterCursor 每次都插到「当前这张」的后面，
    // 正着插会把顺序反过来，而且 first 会落在最旧的那一题上，
    // 滚动过去正好跳过另外几题（用户一滚动，sweepSkipped 又把它们收回去）。
    take.slice().reverse().forEach(function (q) {
      q = safeQuestion(q);
      if (!q) return;
      var st = cardFor(q, 0);
      insertAfterCursor(st);
      first = st;                       // 最后插入的这张，正好紧跟当前卡片
    });
    U.toast('已取回 ' + take.length + ' 道题', 'ok');
    // 取回跳过的题是「往回翻」，沿途的卡不算被划过，不能让 sweepSkipped 把它们又收走
    if (first) scrollToCard(first, { instant: true, noSweep: true });
    else goto(list.length - take.length, { noSweep: true });
  }

  function setLoading(on) {
    loading = on;
    if (on) {
      lastTip = 0;
      if (tipTimer) clearInterval(tipTimer);
      tipTimer = setInterval(tickTip, 2600);
    } else if (tipTimer) {
      clearInterval(tipTimer);
      tipTimer = null;
    }
    updateTail();
    updateBadge();
  }

  function updateBadge() {
    var b = U.$('#src-badge');
    if (!b) return;
    var st = SRC.ai.state;
    b.className = 'src-badge ' + (SRC.aiOnline() ? 'online' : (st === 'checking' ? 'checking' : 'offline'));
    var label = loading ? (SRC.aiOnline() ? '正在出题' : '离线取题中') : SRC.label();
    var ic = loading ? 'refresh' : (SRC.aiOnline() ? 'cloud' : (st === 'checking' ? 'refresh' : 'cloudOff'));
    b.innerHTML = ICON(ic, 12) + '<span>' + U.esc(label) + '</span>';
  }

  // ---------------------------------------------------------------- 自动重练
  function unfixedWrong() {
    return (DB.state.wrong || []).filter(function (x) { return x && x.question && !x.fixed; });
  }

  /** 还能排进来重练的错题数量（不含当前队列里已有的）。 */
  function redoLeftCount() {
    if (!S().quiz.redoWeak) return 0;
    var inQ = {}, n = 0;
    list.forEach(function (st) { if (st.q && st.q.stem) inQ[st.q.stem] = 1; });
    unfixedWrong().forEach(function (x) {
      var q = x.question;
      if (!q.stem || inQ[q.stem]) return;
      if (DB.isChopped(q) || DB.isReported(q)) return;
      n++;
    });
    return n;
  }

  /** 从错题本里取最多 k 道题，标成「重练」。 */
  function redoPool(k) {
    if (!S().quiz.redoWeak || k <= 0) return [];
    var inQ = {}, out = [];
    list.forEach(function (st) { if (st.q && st.q.stem) inQ[st.q.stem] = 1; });
    deferred.forEach(function (e) { if (e.q && e.q.stem) inQ[e.q.stem] = 1; });
    var cands = unfixedWrong().slice().sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
    for (var i = 0; i < cands.length && out.length < k; i++) {
      var q = cands[i].question;
      if (!q || !q.stem || inQ[q.stem]) continue;
      if (DB.isChopped(q) || DB.isReported(q)) continue;
      var cp = JSON.parse(JSON.stringify(q));
      cp.redo = true;
      cp.fromAI = false;
      cp.fromOffline = false;
      cp.source = 'redo';
      cp.recoWhy = '上次做错过';
      out.push(cp);
      inQ[q.stem] = 1;
    }
    return out;
  }

  /** 出的题不够时用错题补满，保证「刷不完、不用等」。 */
  function fillRedo(k) {
    var qs = redoPool(Math.min(k, 20));
    if (!qs.length) return 0;
    appendCards(qs);
    return qs.length;
  }

  function redoNow() {
    var qs = redoPool(Math.max(3, batch()));
    if (!qs.length) { U.toast('错题本里的题都已经排上了'); return; }
    appendCards(qs);
    U.toast('已排入 ' + qs.length + ' 道错题重练', 'ok');
    goto(list.length - qs.length, { noSweep: true });
  }

  // ---------------------------------------------------------------- prefetch
  function prefetch(force) {
    if (loading) return;
    // 定题模式（错题重练 / 指定题集）下不自动出题：题目已经定好了，
    // 后台再插新题会让「错题重练」里混进别的题。用户点「继续加载」时 force 为真，从这里出去。
    if (seedMode && !force) { updateTail(); return; }
    if (force) seedMode = false;
    if (!force && remaining() > Math.max(2, Math.floor(batch() / 2))) return;
    setLoading(true);
    var n = batch();
    var epoch = genEpoch;
    var spec = specFor(n);
    var exclude = seenStems.concat(DB.state.chopped);

    // 题库离线缓存优先（用户自己缓存的题）
    var src = getSource();
    if (src.type === 'bank') {
      var b = Bank.get(src.bankId);
      if (b && b.cached && b.cached.length) {
        var take = b.cached.splice(0, Math.min(n, b.cached.length));
        DB.save();
        take.forEach(function (q) { q.bankLabel = b.name; q.bankId = b.id; q.source = 'cache'; });
        // 用真正插进去的数量：缓存里的题可能已经被斩过/报错过而被丢掉，
        // 按 take.length 算会让 n 提前归零，直接 return，一条兜底请求都不发。
        n -= appendCards(take).length;
        if (n <= 0) { setLoading(false); return; }
      }
    }

    SRC.fetch(spec, n, exclude, { preferInstant: true, force: !!force }).then(function (res) {
      if (epoch !== genEpoch) return;             // 已经换了一轮，丢弃这批过期题目
      setLoading(false);
      var qs = (res.questions || []).filter(function (q) { return q && q.stem; });
      // 让卡片能显示"这题为什么推给我"
      if (spec.recoWhy) qs.forEach(function (q) { if (!q.recoWhy) q.recoWhy = spec.recoWhy; });
      if (qs.length) appendCards(qs);
      var redone = qs.length < n ? fillRedo(n - qs.length) : 0;
      if (!qs.length && !redone) {
        U.toast('暂时取不到题目，稍后再试', 'bad', 2600);
        updateTail();
        return;
      }
      if (res.from === 'offline' && res.error) {
        U.toast('接口暂时不可用，先用内置题库继续', 'bad', 2600);
      }
      genCount++;
    }).catch(function (e) {
      if (epoch !== genEpoch) return;
      setLoading(false);
      if (!fillRedo(n)) {
        U.toast('出题失败：' + (e.message || e), 'bad', 2600);
        if (!list.length) showError(e);
      }
      updateTail();
    });
  }

  /** 插到当前这张的后面（当作「下一条」出现），不会把画面拉回上面的题 */
  function insertAfterCursor(st) {
    var cur = cursorIndex();
    var at = (cur >= 0 && cur < list.length) ? cur + 1 : list.length;
    list.splice(at, 0, st);
    feedEl.insertBefore(st.el, list[at + 1] ? list[at + 1].el : tailEl);
  }

  /** 同一轮里去重用的题干键：去掉空白再截断（和 store.js 的 stemKey 同一套规则） */
  function stemKeyOf(s) { return String(s || '').replace(/\s+/g, '').slice(0, 120); }

  function appendCards(qs) {
    var added = [];
    // 队列里已有的题干先登记一遍：AI 出题只看 prompt 里的 16 条 avoid 提示，
    // 模型完全可能把正在队列里的题再出一道，那样同一轮就会出现两道一样的题，
    // 记录/正确率也会重复计数。
    var have = {};
    list.forEach(function (s) { if (s.q && s.q.stem) have[stemKeyOf(s.q.stem)] = 1; });
    deferred.forEach(function (e) { if (e.q && e.q.stem) have[stemKeyOf(e.q.stem)] = 1; });
    qs.forEach(function (q) {
      q = safeQuestion(q);
      if (!q) return;
      if (have[stemKeyOf(q.stem)]) return;         // 同一轮不重复出题
      if (DB.isChopped(q) || DB.isReported(q)) return;
      var st = cardFor(q, list.length);
      list.push(st);
      feedEl.insertBefore(st.el, tailEl);
      seenStems.push(q.stem);
      have[stemKeyOf(q.stem)] = 1;
      added.push(q);
    });
    if (!added.length) { updateTail(); return added; }   // 全是重复题：不算一批，避免刚划走的题提前回来
    appendSeq++;
    if (seenStems.length > 240) seenStems = seenStems.slice(-140);
    // 跳过的题过一会儿再回来：
    //  · 主动点「暂时不做」的，隔两批新题之后插到当前这一张后面，当作下一条回来
    //  · 手指划过去的，隔三批之后放回队尾 —— 划走就是不想看，不该马上又挡在眼前
    var ahead = list.length - cursorIndex();
    var due = deferred.filter(function (e) { return e.kind !== 'swept' && appendSeq - e.at >= 2; });
    if (due.length && ahead >= 3) {
      var back = due.slice(0, 2);
      deferred = deferred.filter(function (e) { return back.indexOf(e) < 0; });
      // 倒着插，保证回插顺序与原顺序一致
      back.slice().reverse().forEach(function (e) {
        insertAfterCursor(cardFor(e.q, 0));
      });
    }
    var dueTail = deferred.filter(function (e) { return e.kind === 'swept' && appendSeq - e.at >= 3; });
    if (dueTail.length) {
      var tailBack = dueTail.slice(0, 3);
      deferred = deferred.filter(function (e) { return tailBack.indexOf(e) < 0; });
      tailBack.forEach(function (e) {
        if (DB.isChopped(e.q) || DB.isReported(e.q)) return;
        var st = cardFor(e.q, list.length);
        list.push(st);
        feedEl.insertBefore(st.el, tailEl);
      });
    }
    trim();
    rememberQueue();
    updateTail();
    return added;
  }

  /** Insert AI questions right after the current card (offline→online upgrade). */
  function prependQuestions(qs, stamp) {
    if (!feedEl || !qs || !qs.length) return;
    if (stamp !== undefined && stamp !== genEpoch) return;   // 上一轮的响应，丢掉
    var at = cursorIndex() + 1;
    insertCards(qs.filter(function (q) { return q && q.stem && !DB.isChopped(q) && !DB.isReported(q); }), at);
  }

  function trim() {
    while (list.length > 26 && cursorIndex() > 4) {
      var st = list[0];
      if (st.state !== 'done' && st.state !== 'grading') break;
      removeCard(st, true);
    }
  }

  function rememberQueue() {
    var pending = list.filter(function (st) { return st.state === 'idle'; }).map(function (st) { return st.q; })
      .slice(0, batch() * 2);
    DB.state.feed.queue = pending;
    DB.state.feed.queueSource = sourceKey();
    DB.state.feed.queueAt = Date.now();
    DB.save();
  }

  function restorableQueue() {
    var f = DB.state.feed;
    if (!f.queue || !f.queue.length) return [];
    if (f.queueSource && f.queueSource !== sourceKey()) { f.queue = []; return []; }
    if (f.queueAt && Date.now() - f.queueAt > 12 * 3600e3) { f.queue = []; return []; }
    return f.queue.slice();
  }

  // ---------------------------------------------------------------- guide cards
  function sentinelCard(node) {
    var c = U.h('div', { class: 'qcard sentinel' }, U.h('div', { class: 'qcard-inner' }, node));
    feedEl.appendChild(c);
    return c;
  }

  function showError(e) {
    U.clear(feedEl);
    list = []; tailEl = null;
    sentinelCard(U.h('div', { class: 'empty', style: { paddingTop: '16vh' } },
      U.h('div', { class: 'e-ico', html: ICON('flag', 38) }),
      U.h('div', { class: 'e-t', text: '出题失败' }),
      U.h('div', { class: 'e-d', text: String(e && e.message || e) }),
      U.h('div', { class: 'mt16 btn-row' },
        U.h('button', { class: 'btn primary', text: '重试', onclick: function () { restart(); } }),
        U.h('button', { class: 'btn ghost', text: '检查设置', onclick: function () { Profile.openSettings('ai'); } })
      )
    ));
  }

  // ---------------------------------------------------------------- navigation
  /**
   * 卡片顶部的真实像素位置。优先用 offsetTop；垫片/老内核没有 offsetTop 时
   * 按前面兄弟节点的高度累加，效果一致。
   */
  function cardTop(el) {
    if (typeof el.offsetTop === 'number') return el.offsetTop;
    var top = 0, n = el.parentNode && el.parentNode.firstChild;
    while (n && n !== el) {
      if (n.nodeType === 1) top += (n.offsetHeight || 0);
      n = n.nextSibling;
    }
    return top;
  }

  /** 当前正在看的卡片：取「上半屏那条线」落在哪张卡上。 */
  function cursorIndex() {
    if (!feedEl || !list.length) return 0;
    var y = feedEl.scrollTop + Math.max(1, (feedEl.clientHeight || 0) * 0.35);
    var best = 0;
    for (var i = 0; i < list.length; i++) {
      if (cardTop(list[i].el) <= y) best = i; else break;
    }
    return U.clamp(best, 0, list.length - 1);
  }

  /**
   * 滚到某张卡。用 requestAnimationFrame 自己缓动，不用 CSS 的 smooth：
   * WebView 里 smooth 的时长和曲线不可控，慢、还会和 scroll-snap 打架。
   * 动画期间给容器加 .moving 关掉吸附，动画结束再打开，翻页就是一段平顺的位移。
   */
  function scrollToCard(st, opts) {
    if (!st || !feedEl || !st.el.parentNode) return;
    var instant = !!(opts && opts.instant);
    var noSweep = !!(opts && opts.noSweep);
    var from = feedEl.scrollTop;
    var to = cardTop(st.el);
    var i = list.indexOf(st);
    if (i >= 0) { DB.state.feed.cursor = i; DB.save(); }
    if (from === to || instant) {
      feedEl.scrollTop = to;
      finishScroll(st, instant, noSweep);
      return;
    }
    var dist = Math.abs(to - from);
    var dur = U.clamp(Math.round(180 + dist * 0.35), 220, 420);
    var t0 = Date.now();
    var raf = (typeof requestAnimationFrame === 'function') ? requestAnimationFrame : null;
    // 没有 rAF（老内核 / 单元测试环境）就直接落位，行为可预期
    if (!raf) { feedEl.scrollTop = to; finishScroll(st, true, noSweep); return; }
    feedEl.classList && feedEl.classList.add('moving');
    var self = { st: null };                       // 当前动画句柄，晚到的帧不再动
    scrollRun = self;
    (function step() {
      if (scrollRun !== self) return;              // 被新的翻页接管
      if (!st.el.parentNode) { feedEl.classList && feedEl.classList.remove('moving'); return; }
      var to2 = cardTop(st.el);                    // 期间可能插题，目标实时跟着卡片走
      var k = U.clamp((Date.now() - t0) / dur, 0, 1);
      var e = 1 - Math.pow(1 - k, 3);              // easeOutCubic
      if (k >= 1) {
        feedEl.scrollTop = to2;
        feedEl.classList && feedEl.classList.remove('moving');
        finishScroll(st, false, noSweep);
        return;
      }
      feedEl.scrollTop = from + (to2 - from) * e;
      raf(step);
    })();
  }

  function finishScroll(st, instant, noSweep) {
    if (scrollTimer) clearTimeout(scrollTimer);
    scrollTimer = setTimeout(function () {
      scrollTimer = null;
      if (!st.el.parentNode || !feedEl) return;
      var want = cardTop(st.el);
      if (!instant && Math.abs(feedEl.scrollTop - want) > 2) feedEl.scrollTop = want;  // 落地校正
      // 一次跳过很多张（取回跳过的 / 重练错题）不算「划过了」，不能把沿途的题当跳过收走
      if (!noSweep) sweepSkipped();
      updateTail();
    }, instant ? 0 : 90);
  }

  function goto(i, opts) {
    if (!feedEl || !list.length) return;
    i = U.clamp(i, 0, list.length - 1);
    scrollToCard(list[i], opts);
    if (remaining() <= Math.max(2, Math.floor(batch() / 2))) prefetch();
  }

  /**
   * 下一题：优先跳到后面第一张「还没答」的卡；都没有就往前翻一张；
   * 已经是最后一张就接着出题。全部按元素走，不再依赖下标。
   */
  function nextAfter(st) {
    if (!feedEl || !list.length) { prefetch(true); return; }
    var i = list.indexOf(st);
    var from = (i >= 0 ? i : cursorIndex()) + 1;
    var target = null;
    for (var j = Math.max(0, from); j < list.length; j++) {
      if (list[j].state === 'idle') { target = list[j]; break; }
    }
    if (!target && from >= 0 && from < list.length) target = list[from];
    if (target && target.el.parentNode) {
      scrollToCard(target);
      if (remaining() <= Math.max(2, Math.floor(batch() / 2))) prefetch();
      return;
    }
    // 不要在这里先 setLoading(true)：prefetch 的第一行就是 if (loading) return，
    // 先置位会让这次调用必然空转，而且 loading 再也没人清 ——
    // 此后滚动加载、末尾「继续加载」、每分钟的 tickAI 全部失效，
    // 末尾卡永远停在「正在出题…」。prefetch 内部自己会 setLoading。
    prefetch(true);
    U.toast('正在准备下一题…');
  }

  function ensureTail() {
    if (!tailEl) {

    } else {

  function restart(src) {

    if (scrollTimer) { clearTimeout(scrollTimer); scrollTimer = null; }

    scrollRun = null;                            // 停掉正在跑的翻页动画
    // 动画被杀掉时不会再走到收尾那一步，.moving 会留在 .feed 上（CSS 里它关掉了
    // scroll-snap），之后滑动手感会一直不对，所以这里手动清掉。

    U.clear(feedEl);

  /**

   *
   * 和 restart 的区别：本轮题目是定好的，会丢弃所有在途的旧批次并禁止后台自动出题，

   * 用户滑到底点「继续加载」时（prefetch(true)）自动退出定题模式。

  function seedQuestions(qs, src) {
