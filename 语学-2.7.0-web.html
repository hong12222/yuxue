          DB.state.wrong = []; DB.flush(); render(); U.toast('错题本已清空', 'ok');
        });
      } })
    ));
    body.appendChild(U.h('div', { class: 'btn-row mb8' },
      U.h('button', { class: 'btn danger', text: '清空题库缓存', onclick: function () {
        U.confirm('清空缓存', '将删除所有题库的离线缓存题目。', '清空', true).then(function (y) {
          if (!y) return;
          DB.state.banks.forEach(function (b) { b.cached = []; b.cacheMeta = null; });
          DB.flush(); render(); U.toast('缓存已清空', 'ok');
        });
      } }),
      U.h('button', { class: 'btn danger', text: '清空斩/报错记录', onclick: function () {
        U.confirm('清空标记', '将清空「已斩」与「报错」标记，这些题目会重新出现。', '清空', true).then(function (y) {
          if (!y) return;
          DB.state.chopped = []; DB.state.reports = [];
          DB.flush(); render(); U.toast('标记已清空', 'ok');
        });
      } })
    ));
    body.appendChild(U.h('button', { class: 'btn danger block', text: '恢复出厂设置（保留 API 设置）', onclick: function () {
      U.confirm('恢复出厂设置', '将删除全部数据（保留 API 设置）。', '确定恢复', true).then(function (y) {
        if (!y) return;
        DB.reset(true); render(); U.toast('已恢复出厂设置', 'ok');
      });
    } }));
    U.sheet({ title: '清除数据', body: body });
  }

  w.Profile = {
    render: render, openSettings: openSettings, openWrong: openWrong, openFav: openFav,
    openHistory: openHistory, openBackup: openBackup, openAbout: openAbout,
    version: VERSION, author: AUTHOR, changelog: CHANGELOG,
    // 供 js/settings.js 复用（三级设置页需要这些预设与入口）
    _int: {
      PRESETS: PRESETS, OTHER_AI: OTHER_AI, editProfile: editProfile,
      openAbout: openAbout, clearData: clearData, render: render,
      exportBackup: exportBackup, openBackup: openBackup
    }
  };
})(window);

</script>
<script>
/* ===== settings.js ===== */
/* 语学 — 设置（二级入口 + 三级页面）
 *
 * 结构：
 *   二级： 设置  →  通用 / AI 设置 / 个性化  三个入口
 *   三级： 每个入口一个整页（page:true），返回箭头回到二级
 *
 * Profile.openSettings(cat) 仍然可用：带 cat（'general' | 'ai' | 'personal'）
 * 时直接打开对应三级页（首页「去配置 AI」等按钮走这条捷径）。
 */
(function (w) {
  'use strict';

  var SET = {};

  function I() { return (w.Profile && w.Profile._int) || {}; }
  function S() { return DB.settings(); }

  /** 保存后的统一收尾：落盘 + 屏幕常亮 + 顺手再探一次 AI。 */
  function afterSave(msg) {
    var s = S();
    DB.flush();
    if (B.native && B.keepScreenOn) B.keepScreenOn(s.quiz.keepScreen);
    if (AI.ready()) SRC.configChanged();
    U.toast(msg || '设置已保存', 'ok');
  }

  /** 三级页返回二级页的守卫：主动跳转/保存时不要回退。 */
  function navGuard(back) {
    var blocked = false;
    return {
      block: function () { blocked = true; },
      onClose: function () { if (!blocked && back) setTimeout(function () { catsSheet(); }, 0); }
    };
  }

  function row(ic, title, desc, onclick) {
    return U.h('div', { class: 'lrow', onclick: onclick },
      U.h('div', { class: 'ico', html: ICON(ic, 18) }),
      U.h('div', { class: 'grow' }, U.h('div', { class: 't', text: title }), desc ? U.h('div', { class: 'd', text: desc }) : null),
      U.h('span', { class: 'chev', html: ICON('chevronRight', 16) })
    );
  }

  function swRow(title, desc, ctrl) {
    return U.h('div', { class: 'row between mb12' },
      U.h('div', { class: 'grow' }, U.h('div', { class: 'small', text: title }), desc ? U.h('div', { class: 'tiny muted', text: desc }) : null),
      ctrl
    );
  }

  function sect(title) {
    return U.h('div', { class: 'cat-title' }, U.h('span', { text: title }), U.h('span', { class: 'line' }));
  }

  // ================================================================ 二级：入口页
  function catsSheet() {
    var s = S();
    var body = U.h('div');
    var a = s.api || {};
    var c = RECO.counts();

    body.appendChild(U.h('div', { class: 'hintbox', text: '全部设置都保存在本机，不会上传到任何服务器。' }));

    var cats = [
      { id: 'general', ic: 'settings', t: '通用', d: '主题与显示 · 刷题偏好 · 数据与备份 · 关于软件' },
      { id: 'ai', ic: 'sparkles', t: 'AI 设置', d: (a.baseUrl ? (a.model || a.baseUrl) : '未配置接口') + ' · 出题偏好 · 连接诊断' },
      { id: 'personal', ic: 'target', t: '个性化', d: '个人信息 · 推荐设置（题库' + c.banks + ' / 最近' + c.recent + ' / 薄弱' + c.weak + '）' }
    ];
    var sh;
    cats.forEach(function (cat) {
      body.appendChild(row(cat.ic, cat.t, cat.d, function () {
        sh.close();
        setTimeout(function () { SET.open(cat.id, null, true); }, 0);
      }));
    });

    body.appendChild(sect('快捷入口'));
    body.appendChild(row('info', '关于软件', '版本 ' + ((w.Profile && w.Profile.version) || '') + ' · 更新内容 · 作者与 B 站主页', function () {
      sh.close();
      setTimeout(function () { I().openAbout && I().openAbout(); }, 0);
    }));

    sh = U.sheet({ title: '设置', page: true, body: body });
    return sh;
  }

  // ================================================================ 三级：通用
  function generalPage(rerender, back) {
    var s = S();
    var body = U.h('div');
    var nav = navGuard(back);

    // ---- 主题与显示
    body.appendChild(sect('主题与显示'));
    var themeSeg = U.h('div', { class: 'seg mb8' });
    [['system', '跟随系统', 'settings'], ['light', '白夜', 'sun'], ['dark', '黑夜', 'moon']].forEach(function (t) {
      var cur = s.ui.theme || 'system';
      var b = U.h('button', { class: cur === t[0] ? 'on' : '', html: ICON(t[2], 15) + '<span>' + t[1] + '</span>' });
      b.addEventListener('click', function () {
        s.ui.theme = t[0];
        DB.save();
        U.applyTheme(t[0]);
        Array.prototype.forEach.call(themeSeg.children, function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        U.toast('已切换：' + t[1], 'ok');
      });
      themeSeg.appendChild(b);
    });
    body.appendChild(themeSeg);
    body.appendChild(U.h('div', { class: 'tiny muted mb12', text: '刷题页右上角也有一个快捷切换按钮。' }));

    // ---- 刷题偏好
    body.appendChild(sect('刷题偏好'));
    var q = s.quiz;
    var tapSubmit = U.switchEl(q.tapSubmit !== false);
    var autoNext = U.switchEl(q.autoNext !== false);
    var autoWrong = U.switchEl(q.autoWrong !== false);
    var vibrate = U.switchEl(q.vibrate !== false);
    var sound = U.switchEl(q.sound !== false);
    var readAuto = U.switchEl(!!q.readAuto);
    var redoWeak = U.switchEl(q.redoWeak !== false);
    var keepScreen = U.switchEl(q.keepScreen !== false);
    var showTimer = U.switchEl(q.showTimer !== false);
    var showExplain = U.switchEl(q.showExplain !== false);
    var shuffleOptions = U.switchEl(q.shuffleOptions !== false);
    body.appendChild(swRow('单击选项直接判定', '关闭后需要点「提交答案」再判定', tapSubmit));
    body.appendChild(swRow('答对自动进入下一题', '答错会停留在当前题看解析', autoNext));
    body.appendChild(swRow('答错自动加入错题本', '', autoWrong));
    body.appendChild(swRow('刷题时屏幕常亮', '', keepScreen));
    body.appendChild(swRow('显示计时器', '', showTimer));
    body.appendChild(swRow('显示题目解析', '', showExplain));
    body.appendChild(swRow('打乱选择题选项', '避免背答案位置', shuffleOptions));

    // ---- 答题反馈（震动 / 音效 / 读题）
    body.appendChild(sect('答题反馈'));
    body.appendChild(swRow('答题震动', '答对与答错用不同的细腻触感', vibrate));
    body.appendChild(swRow('答题音效', '选择、答对、答错各有提示音', sound));
    body.appendChild(U.h('div', { class: 'mb16' },
      U.h('button', { class: 'btn ghost block', html: ICON('speaker', 15) + '<span>试听（音效 + 触感）</span>', onclick: function () {
        FX.play('correct');
        FX.haptic('correct');
      } })
    ));
    body.appendChild(swRow('进入题目自动朗读', '用系统语音读出题干与选项', readAuto));
    var rateSeg = U.h('div', { class: 'seg mb12' });
    [['0.8', '慢'], ['1', '正常'], ['1.25', '快']].forEach(function (r) {
      var cur = String(q.readRate == null ? '1' : q.readRate);
      var b = U.h('button', { class: cur === r[0] ? 'on' : '', text: r[1] });
      b.addEventListener('click', function () {
        q.readRate = Number(r[0]);
        DB.save();       // 和主题切换一致：改了立刻存，强杀进程也不会丢
        Array.prototype.forEach.call(rateSeg.children, function (x) { x.classList.remove('on'); });
        b.classList.add('on');
      });
      rateSeg.appendChild(b);
    });
    body.appendChild(U.h('div', { class: 'small mb8', text: '朗读语速' }));
    body.appendChild(rateSeg);
    body.appendChild(U.h('div', { class: 'mb16' },
      U.h('button', { class: 'btn ghost block', html: ICON('speaker', 15) + '<span>试听朗读</span>', onclick: function () {
        if (!FX.speak('这道题选 B，解析里说明了判断依据。', { rate: Number(q.readRate) || 1 })) U.toast('这台设备暂时不能朗读', 'bad');
      } })
    ));
    body.appendChild(swRow('错题自动重练', '出的题不够时，自动把错题排进队列', redoWeak));

    // ---- 界面（自定义外观与首页内容）
    body.appendChild(sect('界面'));
    var ui = s.ui = s.ui || {};
    function segRow(label, items, cur, onPick) {
      var seg = U.h('div', { class: 'seg mb12' });
      items.forEach(function (it) {
        var b = U.h('button', { class: String(cur) === String(it[0]) ? 'on' : '', text: it[1] });
        b.addEventListener('click', function () {
          Array.prototype.forEach.call(seg.children, function (x) { x.classList.remove('on'); });
          b.classList.add('on');
          onPick(it[0]);
        });
        seg.appendChild(b);
      });
      body.appendChild(U.h('div', { class: 'small mb8', text: label }));
      body.appendChild(seg);
    }
    function live() { try { App.applyUI(); } catch (e) { } }

    // 立即落盘：以前只改内存，靠别处的保存或退出时的 flush「顺便」写下去，
    // 进程被强杀时这几项就丢了（同一页的主题切换是立刻 DB.save 的）。
    segRow('字体大小', [['small', '小'], ['standard', '标准'], ['large', '大']], ui.font || 'standard', function (v) { ui.font = v; DB.save(); live(); });
    segRow('界面密度', [['cozy', '舒适'], ['compact', '紧凑']], ui.density || 'cozy', function (v) { ui.density = v; DB.save(); live(); });
    // 宽屏（平板 / 横屏）刷题布局：左边题干、右边选项
    segRow('宽屏刷题布局', [['auto', '自动分栏'], ['single', '单栏'], ['split', '强制分栏']], ui.wide || 'auto',
      function (v) { ui.wide = v; DB.save(); live(); });
    body.appendChild(U.h('div', { class: 'tiny muted mb12', text: '屏幕够宽时（平板、横屏）题目与选项左右分栏：左边题干、右边选项，判定与解析也在右侧。窄屏不受影响。' }));

    var anim = U.switchEl(ui.anim !== false);
    var showStat = U.switchEl(ui.showStat !== false);
    var showChip = U.switchEl(ui.showChip !== false);
    var btnRead = U.switchEl(ui.btnRead !== false);
    var btnReport = U.switchEl(ui.btnReport !== false);
    var btnFav = U.switchEl(ui.btnFav !== false);
    // 开关一点就生效：不必等「保存设置」，中途退出也不会两处状态不一致
    function syncUI() {
      ui.anim = anim.classList.contains('on');
      ui.showStat = showStat.classList.contains('on');
      ui.showChip = showChip.classList.contains('on');
      ui.btnRead = btnRead.classList.contains('on');
      ui.btnReport = btnReport.classList.contains('on');
      ui.btnFav = btnFav.classList.contains('on');
      DB.save();          // 立即落盘，不再指望别处的保存顺手带上
      live();
    }
    var uiSwitches = [anim, showStat, showChip, btnRead, btnReport, btnFav];
    uiSwitches.forEach(function (sw) {
      if (sw && sw.addEventListener) sw.addEventListener('click', function () { syncUI(); }, false);
    });
    body.appendChild(swRow('界面动画', '关闭后更省电，翻页与按钮不再有过渡', anim));
    body.appendChild(swRow('首页显示今日统计', '顶部「今日 N 题 · 正确率」', showStat));
    body.appendChild(swRow('首页显示题库标签', '左上角显示当前题库名称', showChip));
    body.appendChild(U.h('div', { class: 'small muted mt12 mb8', text: '题目卡片上的快捷按钮' }));
    body.appendChild(swRow('读题按钮', '把题干与选项念出来', btnRead));
    body.appendChild(swRow('报错按钮', '提交题目纠错', btnReport));
    body.appendChild(swRow('收藏按钮', '', btnFav));
    body.appendChild(U.h('div', { class: 'hintbox mb12', text: '「斩」按钮固定保留：用它可以标记「这题我会了」，之后不再出现。' }));

    // ---- 每日目标
    body.appendChild(sect('每日目标'));
    var goal = s.goal = s.goal || { on: true, daily: 20 };
    var goalOn = U.switchEl(goal.on !== false);
    var goalSel = U.h('select');
    [10, 20, 30, 50, 100].forEach(function (n) {
      goalSel.appendChild(U.h('option', { value: n, text: '每天 ' + n + ' 题' + (n === 20 ? '（推荐）' : '') }));
    });
    goalSel.value = String(U.clamp(Math.round(U.num(goal.daily, 20)), 1, 999));
    body.appendChild(swRow('每日目标', '首页顶部显示「今日 N / 目标」', goalOn));
    body.appendChild(U.field('目标题数', goalSel, '只用来显示进度和触发提醒，不会限制你刷题'));

    // ---- 学习提醒
    body.appendChild(sect('学习提醒'));
    var rm = s.remind = s.remind || { on: false, time: '20:00', onlyIfGoal: true };
    var rmOn = U.switchEl(rm.on === true);
    var rmOnlyGoal = U.switchEl(rm.onlyIfGoal !== false);
    var rmTime = U.input(rm.time || '20:00', '20:00', { type: 'time' });
    body.appendChild(swRow('学习提醒', '到点而且今天还没达标时，打开 App 提醒一次', rmOn));
    body.appendChild(U.field('提醒时间', rmTime, '每天过了这个时间，第一次打开或切回 App 会提醒'));
    body.appendChild(swRow('达标后不再提醒', '当天目标完成后就安静下来', rmOnlyGoal));
    body.appendChild(U.h('div', { class: 'hintbox', text: '关于提醒方式：这个安装包的原生外壳里没有系统通知能力（没有通知、后台服务与定时任务），所以提醒是在你打开或切回语学时弹出，没法像聊天软件那样在锁屏上弹横幅。' }));
    body.appendChild(U.h('div', { class: 'mb16' },
      U.h('button', {
        class: 'btn ghost block', html: ICON('clock', 15) + '<span>预览这条提醒</span>',
        onclick: function () { syncGoalRemind(); if (w.REMIND) REMIND.preview(); }
      })
    ));
    function syncGoalRemind() {
      goal.on = goalOn.classList.contains('on');
      goal.daily = U.clamp(Math.round(U.num(goalSel.value, 20)), 1, 999);
      rm.on = rmOn.classList.contains('on');
      rm.time = String(rmTime.value || '20:00');
      rm.onlyIfGoal = rmOnlyGoal.classList.contains('on');
      DB.save();
    }
    // 开关一点即生效，边上也立刻存一次
    [goalOn, rmOn, rmOnlyGoal].forEach(function (sw) {
      sw.addEventListener('click', function () { syncGoalRemind(); }, false);
    });
    goalSel.addEventListener('change', syncGoalRemind);
    rmTime.addEventListener('change', syncGoalRemind);

    // ---- 数据与备份
    body.appendChild(sect('数据与备份'));
    var st = B.storageInfo();
    body.appendChild(U.h('div', { class: 'card tight' },
      U.h('div', { class: 'kv' }, U.h('span', { class: 'k', text: '存储占用' }), U.h('span', { class: 'v', text: Math.round((st.bytes || 0) / 1024) + ' KB / ' + (st.files || 0) + ' 个文件' })),
      U.h('div', { class: 'kv' }, U.h('span', { class: 'k', text: '题库 / 缓存' }), U.h('span', { class: 'v', text: DB.state.banks.length + ' 个 / ' + DB.state.banks.reduce(function (n, b) { return n + ((b.cached || []).length); }, 0) + ' 题' })),
      U.h('div', { class: 'kv' }, U.h('span', { class: 'k', text: '记录 / 错题 / 收藏 / 斩' }), U.h('span', { class: 'v', text: DB.state.records.length + ' / ' + DB.state.wrong.length + ' / ' + DB.state.fav.length + ' / ' + DB.state.chopped.length })),
      U.h('div', { class: 'kv' }, U.h('span', { class: 'k', text: '内置知识点 / 离线题' }), U.h('span', { class: 'v', text: TAX.count() + ' 个 / ' + OFFLINE.count() + ' 题' }))
    ));
    body.appendChild(U.h('div', { class: 'btn-row mb12' },
      U.h('button', { class: 'btn ghost', html: ICON('download', 15) + '<span>导出备份</span>', onclick: function () {
        // 走和「我的 → 备份」同一套流程：默认不把 API Key 写进文件
        if (I().exportBackup) I().exportBackup();
        else U.toast(B.exportJson('yuxue-backup-' + U.fmtDate(Date.now()) + '.json', DB.exportText(false)), 'ok', 3400);
      } }),
      U.h('button', { class: 'btn ghost', html: ICON('upload', 15) + '<span>导入备份</span>', onclick: function () { importFlow(rerender); } })
    ));
    body.appendChild(U.h('button', { class: 'btn danger block', html: ICON('broom', 15) + '<span>清除数据…</span>', onclick: function () { nav.block(); I().clearData && I().clearData(); } }));

    // ---- 关于
    body.appendChild(sect('关于'));
    body.appendChild(row('info', '关于软件', '版本 ' + ((w.Profile && w.Profile.version) || '') + ' · 作者 ' + ((w.Profile && w.Profile.author) || '') + ' · 更新内容与 B 站主页', function () {
      nav.block();
      I().openAbout && I().openAbout();
    }));

    var sh = U.sheet({
      title: '通用', page: true, body: body,
      onClose: nav.onClose,
      footer: (function () {
        var f = U.h('div', { class: 'btn-row' });
        f.appendChild(U.h('button', { class: 'btn primary block', html: ICON('check', 16) + '<span>保存设置</span>', onclick: function () {
          q.tapSubmit = tapSubmit.classList.contains('on');
          q.autoNext = autoNext.classList.contains('on');
          q.autoWrong = autoWrong.classList.contains('on');
          q.vibrate = vibrate.classList.contains('on');
          q.sound = sound.classList.contains('on');
          q.readAuto = readAuto.classList.contains('on');
          q.redoWeak = redoWeak.classList.contains('on');
          q.keepScreen = keepScreen.classList.contains('on');
          q.showTimer = showTimer.classList.contains('on');
          q.showExplain = showExplain.classList.contains('on');
          q.shuffleOptions = shuffleOptions.classList.contains('on');
          ui.anim = anim.classList.contains('on');
          ui.showStat = showStat.classList.contains('on');
          ui.showChip = showChip.classList.contains('on');
          ui.btnRead = btnRead.classList.contains('on');
          ui.btnReport = btnReport.classList.contains('on');
          ui.btnFav = btnFav.classList.contains('on');
          s.ui.theme = s.ui.theme || 'system';
          syncUI();
          syncGoalRemind();
          afterSave('设置已保存');
          nav.block();
          sh.close();
          if (rerender) rerender();
        } }));
        return f;
      })()
    });
    return sh;
  }

  // ================================================================ 三级：AI 设置
  function aiPage(rerender, back) {
    var s = S();
    var a = s.api;
    var P = I().PRESETS || {};
    var OTHER = I().OTHER_AI || [];
    var body = U.h('div');
    var nav = navGuard(back);

    // ---- 预设
    body.appendChild(sect('接口'));
    var presetRow = U.h('div', { class: 'chips mb12' });
    Object.keys(P).forEach(function (k) {
      var pr = P[k];
      var c = U.h('button', { class: 'chip' + ((a.preset || 'deepseek') === k ? ' on' : ''), text: pr.name });
      c.addEventListener('click', function () {
        a.preset = k;
        if (k === 'deepseek') { a.baseUrl = pr.baseUrl; a.model = pr.model; a.format = pr.format; }
        baseUrl.value = a.baseUrl; model.value = a.model; format.value = a.format || 'openai';
        Array.prototype.forEach.call(presetRow.children, function (x) { x.classList.remove('on'); });
        c.classList.add('on');
        DB.save();
        U.toast(k === 'deepseek' ? '已填入 DeepSeek 预设，只需填写 API Key' : '已切换为自定义', 'ok');
      });

    var strengthSeg = U.h('div', { class: 'seg mb12' });

  // ================================================================ 导入备份（通用页用）
  function importFlow(rerender) {

      U.confirm('导入方式', '「合并」会保留现有数据并追加备份内容；\n「覆盖」会清空现有记录后导入（API 设置保留）。', '合并').then(function (mergeIt) {

<script>
/* ===== guide.js ===== */
/* 语学 — 新手引导（8 屏，可跳过、可回看）
 *
 * 一条主线讲清楚现在的语学是什么：它是个刷题外壳（出题 / 判分 / 学情都走
 * 你自己配置的 AI 接口），以及这一版真正能用上的六件事 —— 配置 AI、每日目标、
 * 预设题库、填空题本地判分、平板与横屏分栏、学习画像。
 *
 * 三条底线：
 *   1. 存储键名与结构不变：DB.state.guide = { done, step, at }。
 *      老用户升级后不会莫名其妙再弹一遍引导。
 *   2. 任何一次「看完 / 跳过 / 关闭 / 返回键」都算看过（done = true），
 *      不会第二天又冒出来；想重看走「我的 → 新手引导」，那里用 start(true)。
 *   3. 全程不抛异常：所有 DOM / 数据访问都在 try 里，缺什么就少画什么。
 *
 * 对外接口（与旧版完全一致，签名不变）：
 *   GUIDE.steps          屏幕定义数组 [{ icon, title, lead, body }]
 *   GUIDE.start(force)   打开引导；force 为真时即使看过也重看（从第一屏起）
 *   GUIDE.close()        只关闭浮层，不改「看过」标记
 *   GUIDE.finish()       关闭并标记「看过」
 *   GUIDE.step(i)        记录当前看到第几屏（写入 DB.state.guide.step）
 *   GUIDE.shouldShow()   是否应该自动弹出（没看过就弹）
 *   GUIDE.done()         是否已经看过 / 跳过
 *
 * 浮层不走 U.sheet：引导是全屏的（z-index 900，高于 sheet-root 的 60），
 * 但关闭函数压进了 U.Sheets.stack —— 返回键（js/app.js 的 w.__yxBack）
 * 因此会先关掉引导，而不是直接退出应用。
 */
(function (w) {
  'use strict';

  var U = w.U;
  var ICON = w.ICON;
  var DB = w.DB;
  var doc = w.document;

  /* ---------------------------------------------------------------- 状态 */

  /**
   * DB.state.guide 的读取（没有就建）。键名与形状与旧版一字不差：
   * { done: false, step: 0 } —— 老用户存下的 done 照样被认。
   */
  function gs() {
    var s = DB && DB.state;
    if (!s || typeof s !== 'object') return { done: true, step: 0 };
    if (!s.guide || typeof s.guide !== 'object') s.guide = { done: false, step: 0 };
    return s.guide;
  }

  /**
   * 「看过」这种只写一次的标记必须立刻落盘：DB.save() 是 350ms 防抖的，
   * 用户点完「开始刷题」就把应用划掉，晚写的那 350ms 就没了 —— 次日又弹一遍。
   */
  function persist(now) {
    try {
      if (!DB) return;
      if (DB.save) DB.save();
      if (now && DB.flush) DB.flush();
    } catch (e) { }
  }

  /** 只认 ICON.has() 认得的名字：写错的名字会静默渲染成空白，这里退到 info。 */
  function icon(name, size) {
    try {
      if (!ICON) return '';
      if (typeof ICON.has === 'function' && !ICON.has(name)) name = 'info';
      return ICON(name, size) || '';
    } catch (e) { return ''; }
  }

  /** 轻量排版：只喂静态文案，U.md 内部会先转义再拼标签。 */
  function md(text) {
    try { return U.h('div', { class: 'md', html: U.md(text) }); }
    catch (e) { return U.h('div', { class: 'guide-p', text: text }); }
  }

  /* ---------------------------------------------------------------- 外部数据 */

  /** DeepSeek 预设：与「我的 → AI 设置」用的是同一份数据（Profile._int.PRESETS）。 */
  function presets() {
    var P = (w.Profile && w.Profile._int && w.Profile._int.PRESETS) || {};
    return P.deepseek || {
      name: 'DeepSeek', baseUrl: 'https://api.deepseek.com/v1', model: 'deepseek-chat',
      site: 'https://platform.deepseek.com/', keys: 'https://platform.deepseek.com/api_keys'
    };
  }

  /** 预设题库的真实数量（随包数据在 js/presets.js + js/offline-extra.js）。 */
  function presetInfo() {
    var out = { list: [], banks: 6, total: 150 };
    try {
      var P = w.YX_PRESETS;
      if (P && P.banks && P.banks.length) {
        var i, t = 0, n;
        out.banks = P.banks.length;
        for (i = 0; i < P.banks.length; i++) {
          var b = P.banks[i] || {};
          n = 0;
          try { if (P.countOf) n = P.countOf(b.id) || 0; } catch (e) { n = 0; }
          t += n;
          out.list.push({ name: String(b.name == null ? '' : b.name), n: n });
        }
        if (t > 0) out.total = t;
      }
    } catch (e) { }
    return out;
  }

  function hasAI() {
    try { return !!(w.AI && w.AI.ready && w.AI.ready()); } catch (e) { return false; }
  }

  /* ---------------------------------------------------------------- 跳转 */

  function openSettings(cat) {
    try {
      if (w.Profile && w.Profile.openSettings) { w.Profile.openSettings(cat || 'ai'); return; }
      if (w.SET && w.SET.open) w.SET.open(cat || 'ai', null, null);
    } catch (e) { }
  }

  function goTab(name) {
    try { if (w.App && w.App.tab) w.App.tab(name); } catch (e) { }
  }

  /** 先关引导再开设置：引导浮层在 z-index 900，sheet 在 60，叠着会看不见。 */
  function toAI() { close(); openSettings('ai'); }

  function toPersona() {
    close();
    try {
      if (w.PERSONA && w.PERSONA.open) { w.PERSONA.open(); return; }
    } catch (e) { }
    goTab('me');
  }

  function applyUrl(url) {
    try { if (w.B && w.B.openUrl && url) w.B.openUrl(url); } catch (e) { }
  }

  /* ---------------------------------------------------------------- 各屏正文 */

  function apiBody(b) {
    var P = presets();
    b.appendChild(U.h('div', { class: 'guide-card' },
      U.h('div', { class: 'gc-hd' }, U.h('span', { class: 'ico', html: icon('key', 18) }), U.h('b', { text: P.name + ' 接口（已预设）' })),
      U.h('div', { class: 'tiny muted', text: '地址 ' + P.baseUrl }),
      U.h('div', { class: 'tiny muted', text: '模型 ' + P.model }),
      U.h('div', { class: 'tiny muted', text: '申请地址 ' + P.keys })
    ));
    b.appendChild(U.h('ol', { class: 'guide-ol' },
      U.h('li', { text: '打开「' + P.name + ' 开放平台」，用手机号或邮箱注册。' }),
      U.h('li', { text: '进「API Keys」页点「创建」，复制 sk- 开头的那串字符。' }),
      U.h('li', { text: '回到语学，粘贴进设置里的「API Key」，地址与模型保持预设。' }),
      U.h('li', { text: '点「测试连接」，成功就能用 AI 出题了。' })
    ));
    b.appendChild(U.h('div', { class: 'btn-row' },
      U.h('button', { class: 'btn primary lead', html: icon('key', 16) + '<span>去填写 Key</span>', onclick: toAI }),
      U.h('button', { class: 'btn ghost', html: icon('external', 16) + '<span>申请页面</span>', onclick: function () { applyUrl(P.keys); } })
    ));
    b.appendChild(U.h('div', { class: 'hintbox mt12', text: '暂时不填也能刷题：首页会先用内置题库出题，随时可以在「我的 → AI 设置」里补上。Key 只保存在这台手机上。' }));
  }

  function goalBody(b) {
    b.appendChild(md('在**设置 → 通用 → 每日目标**里挑一个：每天 **10 / 20 / 30 / 50 / 100** 题。\n' +
      '首页顶部会一直显示「**今日 N / 目标**」，一眼就知道还差多少。\n' +
      '达标会弹一句提示，并把**连续达标天数**一起累计下来。'));
    b.appendChild(U.h('div', { class: 'guide-card' },
      U.h('div', { class: 'gc-hd' }, U.h('span', { class: 'ico', html: icon('target', 18) }), U.h('b', { text: '首页顶部' })),
      U.h('div', { class: 'tiny muted', text: '今日 12 / 20 · 60%' }),
      U.h('div', { class: 'tiny muted', text: '目标达成后：今日目标达成 · 20 题（连续 7 天）' })
    ));
    b.appendChild(U.h('div', { class: 'tiny muted', text: '目标只用来显示进度和提醒，不会限制你刷题。' }));
  }

  function presetBody(b) {
    var info = presetInfo();
    b.appendChild(U.h('div', { class: 'guide-p', text: '题库页顶部的「预设题库」标签里，点一下就建好一整组题；随包内置，建完完全离线可刷。' }));
    var chips = U.h('div', { class: 'chips' });
    for (var i = 0; i < info.list.length; i++) {
      var it = info.list[i];
      /* 名字与题数来自数据，一律走 text:（textContent），不拼进 innerHTML */
      chips.appendChild(U.h('span', { class: 'chip tag', text: it.n ? it.name + ' · ' + it.n + ' 题' : it.name }));
    }
    b.appendChild(chips);
    b.appendChild(U.h('div', { class: 'tiny muted mt8', text: '共 ' + info.banks + ' 个题库 · ' + info.total + ' 道题，建好即可离线刷。' }));
    b.appendChild(U.h('div', { class: 'btn-row mt12' },
      U.h('button', { class: 'btn ghost lead', html: icon('library', 16) + '<span>去题库创建</span>', onclick: function () { close(); goTab('bank'); } })
    ));
  }

  function fillBody(b) {
    b.appendChild(md('单词拼写、口算、单位换算这类题在**本机判分**：填完按**回车**（或点右边「提交」）立刻出结果和解析。\n' +
      '不等网络，也**不消耗 API 额度**，离线照样判。\n' +
      '需要写长句、论述的主观题才交给 AI 评分。'));
    b.appendChild(U.h('div', { class: 'hintbox', text: '例：拼写 apple · 口算 37 + 45 · 换算 1 米 = 100 厘米' }));
  }

  function splitBody(b) {
    b.appendChild(md('屏幕够宽时（平板、横屏）自动左右分栏：**左边题干、右边选项**，判定与解析也在右侧。\n' +
      '想固定？**设置 → 通用 → 界面 → 宽屏刷题布局**：**自动分栏 / 单栏 / 强制分栏**。\n' +
      '手机窄屏不受影响，仍然是上下滑动。'));
  }

  function personaBody(b) {
    b.appendChild(md('**我的 → 学习画像**：由 AI 依据你的真实刷题数据（正确率、用时、薄弱知识点）写一份画像。\n' +
      '包含标题、标签、学习风格、优势、待提升和今天就能做的下一步，可复制或分享。\n' +
      '题刷得越多，画像越准。'));
    b.appendChild(U.h('div', { class: 'btn-row mt12' },
      U.h('button', { class: 'btn ghost lead', html: icon('sparkles', 16) + '<span>看看学习画像</span>', onclick: toPersona })
    ));
  }

  function endBody(b) {
    b.appendChild(md('随时可以在「**我的 → 新手引导**」里再看一遍这份说明。\n' +
      '做题时发现题目有问题，用卡片上的「报错」按钮告诉我。'));
    var row = U.h('div', { class: 'btn-row mt12' });
    row.appendChild(U.h('button', {
      class: 'btn primary lead', text: '开始刷题',
      onclick: function () { finish(); goTab('home'); }
    }));
    if (!hasAI()) {
      row.appendChild(U.h('button', {
        class: 'btn ghost', html: icon('key', 15) + '<span>配置 AI</span>', onclick: toAI
      }));
    }
    b.appendChild(row);
  }

  /* ---------------------------------------------------------------- 8 屏 */

  var STEPS = [
    {
      icon: 'mark',
      title: '欢迎使用语学',
      lead: '一个刷题外壳：出题、判分、学情都走你的 AI',
      body: function (b) {
        b.appendChild(md('**语学**本身不提供题库内容，它把出题、判分、学习诊断全部交给你自己配置的 AI 接口。\n' +
          '不配置也能立刻开刷：内置离线题库随包自带。\n' +
          '配置之后，它会按你的薄弱点出题、自动评分、生成诊断报告。'));
        b.appendChild(U.h('div', { class: 'hintbox', text: '接下来 8 屏，每屏只讲一件事，随时可以「跳过」。' }));
      }
    },
    {
      icon: 'key',
      title: '配置 AI：DeepSeek 预设',
      lead: '填一个 Key 就能在线出题',
      body: apiBody
    },
    {
      icon: 'target',
      title: '设一个每日目标',
      lead: '每天 10 ~ 100 题，自己定',
      body: goalBody
    },
    {
      icon: 'library',
      title: '预设题库：一键建好',
      lead: '6 个题库 · 150 道题 · 建完离线刷',
      body: presetBody
    },
    {
      icon: 'edit',
      title: '填空题：按回车就出结果',
      lead: '本机判分，不消耗 API 额度',
      body: fillBody
    },
    {
      icon: 'cards',
      title: '平板 / 横屏：左右分栏',
      lead: '左边题干，右边选项与解析',
      body: splitBody
    },
    {
      icon: 'sparkles',
      title: '学习画像',
      lead: '让 AI 说说你是什么样的学习者',
      body: personaBody
    },
    {
      icon: 'rocket',
      title: '可以开始了',
      lead: '先刷三道，找找手感',
      body: endBody
    }
  ];

  /* ---------------------------------------------------------------- 浮层 */

  var el = null;        // 浮层根节点（.gd-wrap）
  var bodyEl = null;    // 屏幕内容容器（可滚动，进页面滑动动画）
  var dotsEl = null;    // 分页圆点
  var countEl = null;   // 「3 / 8」
  var prevBtn = null;   // 上一步
  var nextBtn = null;   // 下一步 / 开始刷题
  var idx = 0;          // 当前第几屏

  function clampStep(n) {
    n = n | 0;
    if (n < 0) return 0;
    if (n > STEPS.length - 1) return STEPS.length - 1;
    return n;
  }

  /**
   * 把关闭函数压进 U.Sheets 的栈：返回键先关引导，而不是「再按一次退出语学」。
   * 与 util.js 里 sheet() 的做法一致，关掉时自己出栈。
   */
  function onBack() { finish(); }

  function register() {
    try {
      var S = w.U && w.U.Sheets;
      if (!S || !S.stack || typeof S.stack.push !== 'function') return;
      unregister();
      S.stack.push(onBack);
    } catch (e) { }
  }

  function unregister() {
    try {
      var S = w.U && w.U.Sheets;
      if (!S || !S.stack) return;
      for (var i = S.stack.length - 1; i >= 0; i--) {
        if (S.stack[i] === onBack) S.stack.splice(i, 1);
      }
    } catch (e) { }
  }

  /** 关闭浮层：不写任何标记，也不留残骸（连别的实例留下的浮层一起清掉）。 */
  function close() {
    unregister();
    try {
      if (el && el.parentNode) el.parentNode.removeChild(el);
      if (doc && doc.querySelectorAll) {
        var stale = doc.querySelectorAll('.gd-wrap');
        for (var i = 0; i < stale.length; i++) {
          if (stale[i] && stale[i].parentNode) stale[i].parentNode.removeChild(stale[i]);
        }
      }
    } catch (e) { }
    el = null; bodyEl = null; dotsEl = null; countEl = null; prevBtn = null; nextBtn = null;
  }

  /** 画第 idx 屏。dir < 0 表示往回翻（动画方向不同）。 */
  function paint(dir) {
    if (!bodyEl || !U) return;
    var st = STEPS[idx] || STEPS[0];
    try {
      U.clear(bodyEl);
      var slide = U.h('div', { class: 'gd-slide' + (dir < 0 ? ' gd-back' : '') });
      slide.appendChild(U.h('div', { class: 'guide-ico', html: icon(st.icon, 28) }));
      slide.appendChild(U.h('h3', { class: 'guide-t', text: st.title }));
      if (st.lead) slide.appendChild(U.h('div', { class: 'guide-lead', text: st.lead }));
      var box = U.h('div', { class: 'guide-body' });
      try {
        if (typeof st.body === 'function') st.body(box);
        else if (st.body) box.appendChild(U.h('div', { class: 'guide-p', text: st.body }));
      } catch (e) { }
      slide.appendChild(box);
      bodyEl.appendChild(slide);

      /* 过渡只用 class 切换：下一帧加上 gd-in，滑动交给 CSS 关键帧。
         关掉「界面动画」（html.no-anim）时 CSS 里直接不跑动画。 */
      setTimeout(function () {
        try { if (slide.classList) slide.classList.add('gd-in'); } catch (e) { }
      }, 16);

      if (dotsEl) {
        U.clear(dotsEl);
        for (var i = 0; i < STEPS.length; i++) {
          dotsEl.appendChild(U.h('i', { class: 'gd' + (i === idx ? ' on' : '') }));
        }
      }
      if (countEl) countEl.textContent = (idx + 1) + ' / ' + STEPS.length;
      var last = idx === STEPS.length - 1;
      if (prevBtn) {
        if (idx === 0) prevBtn.setAttribute('disabled', '');
        else prevBtn.removeAttribute('disabled');
      }
      if (nextBtn) nextBtn.textContent = last ? '开始刷题' : '下一步';
    } catch (e) { }
    try { if (bodyEl.scrollTo) bodyEl.scrollTo({ top: 0 }); } catch (e) { }
  }

  function go(n) {
    n = clampStep(n);
    if (n === idx) return;
    var dir = n < idx ? -1 : 1;
    idx = n;
    step(idx);            // 记下看到第几屏：中途被杀进程，下次从这一屏接着看
    paint(dir);
  }

  function start(force) {
    if (!U || !doc || !doc.body) return false;
    if (!force && gs().done) return false;
    close();              // 连点两下也只留一个浮层
    try {
      idx = force ? 0 : clampStep(gs().step);
      bodyEl = U.h('div', { class: 'guide-card-box gd-view' });
      dotsEl = U.h('div', { class: 'guide-dots' });
      countEl = U.h('span', { class: 'gd-count tiny muted' });
      prevBtn = U.h('button', { class: 'btn ghost', text: '上一步', onclick: function () { go(idx - 1); } });
      nextBtn = U.h('button', {
        class: 'btn primary lead', text: '下一步',
        onclick: function () { if (idx === STEPS.length - 1) { finish(); goTab('home'); } else go(idx + 1); }
      });
      el = U.h('div', { class: 'guide-wrap gd-wrap' },
        U.h('div', { class: 'guide-panel' },
          U.h('div', { class: 'guide-hd' },
            U.h('b', { text: '新手指引' }),
            countEl,
            U.h('div', { class: 'grow' }),
            U.h('button', { class: 'btn ghost xs gd-skip', text: '跳过', onclick: finish }),
            U.h('button', { class: 'icon-btn', title: '关闭', html: icon('close', 18), onclick: finish })
          ),
          bodyEl,
          U.h('div', { class: 'gd-ft' },
            dotsEl,
            U.h('div', { class: 'btn-row mt12' }, prevBtn, nextBtn)
          )
        )
      );
      doc.body.appendChild(el);
    } catch (e) {
      close();
      return false;
    }
    register();
    paint(1);
    return true;
  }

  /** 看完 / 跳过 / 关闭 / 返回键：都算看过，并把下一轮重看拉回第一屏。 */
  function finish() {
    var g = gs();
    g.done = true;
    g.step = 0;
    g.at = Date.now();
    close();
    persist(true);
  }

  /** 记录当前屏（保留的旧接口：写 DB.state.guide.step）。 */
  function step(i) {
    var g = gs();
    g.step = Math.max(0, i | 0);
    persist(false);
  }

  w.GUIDE = {
    steps: STEPS,
    start: start,
    close: close,
    finish: finish,
    step: step,
    shouldShow: function () { return !gs().done; },
    done: function () { return !!gs().done; }
  };
})(window);

</script>
<script>
/* ===== app.js ===== */
/* 语学 — 应用入口：底栏、主题、返回键与生命周期。 */
(function (w) {
  'use strict';

  var App = { cur: 'home' };
  var mounted = { home: false, bank: false, stats: false, me: false };
  var lastBack = 0;

  /* 底栏：首页 → 刷题 */
  var TABS = [
    { id: 'home', label: '刷题', icon: 'feed' },
    { id: 'bank', label: '题库', icon: 'library' },
    { id: 'stats', label: '学情', icon: 'chart' },
    { id: 'me', label: '我的', icon: 'user' }
  ];
  var TITLES = { home: '刷题', bank: '题库', stats: '学情', me: '我的' };

  function buildTabbar() {
    var box = U.$('#tabbar-inner');
    if (!box) return;
    U.clear(box);
    TABS.forEach(function (t) {
      var b = U.h('button', { class: 'tab' + (t.id === App.cur ? ' active' : ''), 'data-tab': t.id },
        U.h('span', { class: 'ic-wrap', html: ICON(t.icon, 23) }),
        U.h('span', { class: 'lb', text: t.label })
      );
      b.addEventListener('click', function () { App.tab(t.id); });
      box.appendChild(b);
    });
  }

  App.tab = function (name) {
    if (!TITLES[name]) name = 'home';
    App.cur = name;
    U.$$('#tabbar .tab').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-tab') === name);
    });
    U.$$('#views .view').forEach(function (v) {
      v.classList.toggle('active', v.id === 'v-' + name);
    });
    try {
      if (name === 'home') {
        if (!mounted.home) { Feed.mount(U.$('#v-home')); mounted.home = true; }
        else Feed.onShow();
      } else if (name === 'bank') { BankView.render(); mounted.bank = true; }
      else if (name === 'stats') { StatsView.render(); mounted.stats = true; }
      else if (name === 'me') { Profile.render(); mounted.me = true; }
    } catch (e) {
      B.log('tab render error (' + name + '): ' + (e && e.stack || e));
      U.toast('页面渲染出错：' + (e && e.message || e), 'bad', 3000);
    }
  };

  App.refresh = function () {
    if (App.cur === 'bank') BankView.render();
    else if (App.cur === 'stats') StatsView.render();
    else if (App.cur === 'me') Profile.render();
  };

  App.theme = function (mode) {
    if (mode) { DB.settings().ui.theme = mode; DB.save(); }
    return U.applyTheme(DB.settings().ui.theme || 'system');
  };

  /**
   * 全局按钮触感：按钮、开关、标签页、分段控件点一下都有轻微震感。
   * 答题/翻页这类已经有自己触感的操作，用 FX.recent() 去重，不会震两下。
   * 不想震的元素挂 data-nohaptic 即可豁免。
   */
  function bindHaptics() {
    if (!document.addEventListener || !w.FX) return;
    document.addEventListener('click', function (ev) {
      try {
        var el = ev.target;
        var kind = null;
        while (el && el.nodeType === 1) {
          if (el.getAttribute && el.getAttribute('data-nohaptic') != null) return;
          var cls = ' ' + String(el.className || '') + ' ';
          if (el.tagName === 'SELECT' || el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') return;
          if (/\bswitch\b/.test(cls) || /\bseg\b/.test(cls) || /\bopt\b/.test(cls) || /\blrow\b/.test(cls)) { kind = 'pick'; break; }
          if (el.tagName === 'BUTTON' || /\b(btn|chip|tab|act-btn|icon-btn|exam-tile|nb-item|avatar-btn)\b/.test(cls)) { kind = 'tap'; break; }
          el = el.parentNode;
        }
        if (!kind) return;
        if (FX.recent && FX.recent() < 90) return;      // 这个控件自己已经给过反馈
        FX.haptic(kind);
      } catch (e) { }
    }, false);
  }

  // ---- 界面自定义（设置 → 界面）----------------------------------------
  function applyUI() {
    try {
      var ui = DB.settings().ui || (DB.settings().ui = {});
      var app = U.$('#app');
      var root = document.documentElement;
      if (app && app.setAttribute) {
        app.setAttribute('data-font', ui.font || 'standard');
        app.setAttribute('data-density', ui.density || 'cozy');
        // 宽屏刷题布局：auto / single / split（CSS 依据这个属性决定要不要左右分栏）
        app.setAttribute('data-wide', ui.wide || 'auto');
      }
      var cl = root && root.classList;
      if (cl) {
        if (ui.anim === false) cl.add('no-anim'); else cl.remove('no-anim');
        if (ui.showStat === false) cl.add('hide-stat'); else cl.remove('hide-stat');
        if (ui.showChip === false) cl.add('hide-chip'); else cl.remove('hide-chip');
      }
    } catch (e) { }
  }

  function boot() {
    DB.load();
    var s = DB.settings();

    // 主题先落地，避免闪白/闪黑
    U.applyTheme(s.ui.theme || 'system');
    var logo = U.$('#boot-logo');
    if (logo) logo.innerHTML = ICON.appLogo;

    buildTabbar();
    bindHaptics();
    applyUI();
