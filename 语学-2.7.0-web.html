grade":"五年级","gradeId":"p5","difficulty":3,"source":"offline","createdAt":0},{"id":"p-math-012","type":"choice","stem":"一个圆的半径是 3 厘米，它的周长是多少厘米？（π 取 3.14）","options":["9.42","18.84","28.26","37.68"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"圆的周长 C = 2πr = 2 × 3.14 × 3 = 18.84 厘米；28.26 是它的面积，不要把周长公式和面积公式弄混。","point":"圆的周长","subject":"数学","stage":"小学","stageId":"primary","grade":"六年级","gradeId":"p6","difficulty":3,"source":"offline","createdAt":0},{"id":"p-math-013","type":"choice","stem":"80 的 25% 是多少？","options":["16","20","25","60"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"求一个数的百分之几是多少，用乘法：80 × 25% = 80 × 0.25 = 20。也可以把 80 平均分成 4 份，取其中 1 份。","point":"百分数","subject":"数学","stage":"小学","stageId":"primary","grade":"六年级","gradeId":"p6","difficulty":2,"source":"offline","createdAt":0},{"id":"p-chinese-014","type":"choice","stem":"下面哪一组词语的意思相反？","options":["高兴 —— 快乐","冷清 —— 热闹","认真 —— 仔细","明亮 —— 光亮"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"“冷清”指寂静、人少，“热闹”指繁盛活跃，两者意思相反；其余三组的两个词意思都相近，是近义词。","point":"反义词","subject":"语文","stage":"小学","stageId":"primary","grade":"二年级","gradeId":"p2","difficulty":2,"source":"offline","createdAt":0},{"id":"p-chinese-015","type":"choice","stem":"下面哪个词语中的“长”读作 zhǎng？","options":["长跑","长大","长江","长处"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"“长大”的“长”表示生长，读 zhǎng；长跑、长江、长处的“长”都读 cháng。","point":"多音字","subject":"语文","stage":"小学","stageId":"primary","grade":"三年级","gradeId":"p3","difficulty":2,"source":"offline","createdAt":0},{"id":"p-chinese-016","type":"subjective","stem":"修改病句：通过这次活动，使我明白了团结的重要。","options":[],"answer":"","referenceAnswer":"删去“通过”或“使”，如：这次活动使我明白了团结的重要。","rubric":["指出病因是滥用介词导致句子缺少主语","给出修改后的完整通顺的句子"],"explanation":"“通过……使……”连用会让句子缺少主语，去掉其中一个词，主语就出现了。","point":"修改病句","subject":"语文","stage":"小学","stageId":"primary","grade":"三年级","gradeId":"p3","difficulty":3,"source":"offline","createdAt":0},{"id":"p-chinese-017","type":"choice","stem":"下面哪个成语形容做事专心、一点也不马虎？","options":["三心二意","专心致志","东张西望","心不在焉"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"“专心致志”指一心一意、集中精神，正合题意；另外三个成语都表示注意力不集中。","point":"成语","subject":"语文","stage":"小学","stageId":"primary","grade":"四年级","gradeId":"p4","difficulty":2,"source":"offline","createdAt":0},{"id":"p-chinese-018","type":"choice","stem":"“弯弯的月亮像一只小船。”这句话运用了什么修辞手法？","options":["拟人","比喻","夸张","排比"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"句中把月亮比作小船，用“像”把本体和喻体连起来，所以是比喻；这里没有把物当作人来写，也没有夸大或并列的句式。","point":"修辞手法","subject":"语文","stage":"小学","stageId":"primary","grade":"四年级","gradeId":"p4","difficulty":2,"source":"offline","createdAt":0},{"id":"p-chinese-019","type":"choice","stem":"选择合适的关联词填空：（ ）明天下雨，我们（ ）不去公园了。","options":["因为……所以……","如果……就……","虽然……但是……","不但……而且……"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"前半句提出假设，后半句是假设成立后产生的结果，应该用表示假设关系的“如果……就……”。","point":"关联词","subject":"语文","stage":"小学","stageId":"primary","grade":"五年级","gradeId":"p5","difficulty":2,"source":"offline","createdAt":0},{"id":"p-chinese-020","type":"choice","stem":"“欲穷千里目”的下一句是什么？","options":["更上一层楼","白日依山尽","黄河入海流","一片孤城万仞山"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"这两句出自王之涣的《登鹳雀楼》：“欲穷千里目，更上一层楼。”其余三项也都出自这首诗或《凉州词》，但不是它的下句。","point":"古诗积累","subject":"语文","stage":"小学","stageId":"primary","grade":"五年级","gradeId":"p5","difficulty":2,"source":"offline","createdAt":0},{"id":"p-chinese-021","type":"subjective","stem":"默写《静夜思》中表达思念家乡的两句诗。","options":[],"answer":"","referenceAnswer":"举头望明月，低头思故乡。","rubric":["两句诗完整，标点和字词没有错误","能说明这两句由望月写出思乡之情"],"explanation":"《静夜思》后两句由抬头望月写到低头思乡，直接抒发了诗人的思乡之情。","point":"古诗默写","subject":"语文","stage":"小学","stageId":"primary","grade":"六年级","gradeId":"p6","difficulty":2,"source":"offline","createdAt":0},{"id":"p-english-022","type":"choice","stem":"英语中表示“苹果”的单词是哪一个？","options":["apple","banana","orange","pear"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"apple 意为“苹果”；banana 是香蕉，orange 是橙子，pear 是梨。","point":"词汇","subject":"英语","stage":"小学","stageId":"primary","grade":"三年级","gradeId":"p3","difficulty":1,"source":"offline","createdAt":0},{"id":"p-english-023","type":"subjective","stem":"用所给词的适当形式填空：He ______ (like) playing football.","options":[],"answer":"","referenceAnswer":"likes","rubric":["填出 likes","说明主语是第三人称单数，动词要加 s"],"explanation":"主语 He 是第三人称单数，一般现在时的动词要加 s，所以填 likes。","point":"一般现在时","subject":"英语","stage":"小学","stageId":"primary","grade":"三年级","gradeId":"p3","difficulty":2,"source":"offline","createdAt":0},{"id":"p-english-024","type":"choice","stem":"选择正确的形式：My sister ______ to school by bus every day.","options":["go","goes","going","went"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"every day 表示习惯性的动作，句子用一般现在时；主语 My sister 是第三人称单数，动词用 goes。","point":"一般现在时","subject":"英语","stage":"小学","stageId":"primary","grade":"四年级","gradeId":"p4","difficulty":2,"source":"offline","createdAt":0},{"id":"p-english-025","type":"choice","stem":"The book is ______ the desk. 表示“书在桌子上”，横线处应填哪个词？","options":["in","on","under","behind"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"on 表示“在……表面上”，书在桌面上用 on；in 表示在内部，under 是在下面，behind 是在后面。","point":"方位介词","subject":"英语","stage":"小学","stageId":"primary","grade":"四年级","gradeId":"p4","difficulty":2,"source":"offline","createdAt":0},{"id":"p-english-026","type":"subjective","stem":"用所给词的适当形式填空：I ______ (visit) my grandma last Sunday.","options":[],"answer":"","referenceAnswer":"visited","rubric":["填出 visited","说明 last Sunday 表示过去，动词要用过去式"],"explanation":"last Sunday 是过去的时间，句子要用一般过去时，visit 的过去式是 visited。","point":"一般过去时","subject":"英语","stage":"小学","stageId":"primary","grade":"五年级","gradeId":"p5","difficulty":2,"source":"offline","createdAt":0},{"id":"p-english-027","type":"choice","stem":"Look! The children ______ football on the playground.","options":["play","plays","are playing","played"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"Look! 提示动作正在发生，要用现在进行时 be + 动词-ing；主语 The children 是复数，be 动词用 are。","point":"现在进行时","subject":"英语","stage":"小学","stageId":"primary","grade":"五年级","gradeId":"p5","difficulty":3,"source":"offline","createdAt":0},{"id":"p-english-028","type":"choice","stem":"This box is ______ than that one.","options":["heavy","heavier","heaviest","more heavy"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"than 前面要用比较级；heavy 以“辅音字母加 y”结尾，变比较级时把 y 变成 i 再加 er，即 heavier。","point":"形容词比较级","subject":"英语","stage":"小学","stageId":"primary","grade":"六年级","gradeId":"p6","difficulty":3,"source":"offline","createdAt":0},{"id":"p-english-029","type":"choice","stem":"I ______ visit the museum next week.","options":["am going to","went","was going to","have visited"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"next week 表示将来的时间，用 be going to + 动词原形表示打算做某事，主语 I 对应的 be 动词是 am。","point":"一般将来时","subject":"英语","stage":"小学","stageId":"primary","grade":"六年级","gradeId":"p6","difficulty":3,"source":"offline","createdAt":0},{"id":"p-science-030","type":"choice","stem":"绿色植物制造养料主要依靠什么作用？","options":["呼吸作用","光合作用","蒸腾作用","吸收作用"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"植物利用光能，把水和二氧化碳在叶绿体中合成有机物并放出氧气，这就是光合作用；呼吸作用消耗养料，蒸腾作用主要是散失水分。","point":"植物的光合作用","subject":"科学","stage":"小学","stageId":"primary","grade":"三年级","gradeId":"p3","difficulty":2,"source":"offline","createdAt":0},{"id":"p-science-031","type":"choice","stem":"关于声音的传播，下列说法正确的是哪一项？","options":["声音在真空中也能传播","声音在固体中不能传播","声音在空气中可以传播","声音的传播不需要任何介质"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"声音的传播需要介质，气体、液体、固体都能传声，所以声音能在空气中传播，但真空不能传声。","point":"声音的传播","subject":"科学","stage":"小学","stageId":"primary","grade":"四年级","gradeId":"p4","difficulty":2,"source":"offline","createdAt":0},{"id":"p-science-032","type":"choice","stem":"地球自转一周大约需要多长时间？","options":["1 小时","12 小时","24 小时","365 天"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"地球自转一周约 24 小时，形成昼夜交替；365 天是地球公转一周的时间，形成四季变化。","point":"地球的运动","subject":"科学","stage":"小学","stageId":"primary","grade":"五年级","gradeId":"p5","difficulty":2,"source":"offline","createdAt":0},{"id":"p-science-033","type":"choice","stem":"使用杠杆时，如果动力臂比阻力臂长，这样的杠杆属于哪一种？","options":["省力杠杆","费力杠杆","等臂杠杆","不是杠杆"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"动力臂大于阻力臂时，动力小于阻力，是省力杠杆；等臂杠杆的动力臂等于阻力臂，费力杠杆的动力臂小于阻力臂。","point":"简单机械","subject":"科学","stage":"小学","stageId":"primary","grade":"六年级","gradeId":"p6","difficulty":3,"source":"offline","createdAt":0},{"id":"p-morality-034","type":"choice","stem":"上课铃响了，我们应该怎么做？","options":["继续和同学说笑","回到座位准备好上课用品","跑出教室去玩耍","站在门口大声喊叫"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"上课铃是上课的信号，按时回到座位、准备好学习用品，是遵守课堂纪律、尊重老师和同学的表现。","point":"校园规则","subject":"道德与法治","stage":"小学","stageId":"primary","grade":"一年级","gradeId":"p1","difficulty":1,"source":"offline","createdAt":0},{"id":"p-morality-035","type":"choice","stem":"小明不小心打碎了教室的玻璃，他应该怎么做？","options":["悄悄走开，装作不知道","主动向老师承认错误","把责任推给同桌","回家后谁也不告诉"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"做错了事要勇于承认并及时弥补；说谎或推卸责任会失去别人的信任，诚实守信才是正确的做法。","point":"诚实守信","subject":"道德与法治","stage":"小学","stageId":"primary","grade":"三年级","gradeId":"p3","difficulty":1,"source":"offline","createdAt":0},{"id":"p-morality-036","type":"choice","stem":"下面哪种做法有利于保护环境？","options":["随手丢弃废电池","把垃圾分类投放","大量使用一次性餐具","往河里倒生活垃圾"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"垃圾分类投放能提高资源回收利用率、减少污染；废电池含重金属，随意丢弃会污染土壤和水源，一次性餐具则会造成大量垃圾。","point":"环境保护","subject":"道德与法治","stage":"小学","stageId":"primary","grade":"五年级","gradeId":"p5","difficulty":2,"source":"offline","createdAt":0},{"id":"p-morality-037","type":"subjective","stem":"请写出两条小学生应当遵守的交通规则。","options":[],"answer":"","referenceAnswer":"过马路要走人行横道，做到红灯停、绿灯行；不在马路上追逐打闹，未满 12 周岁不骑自行车上路。","rubric":["写出两条具体、可操作的交通规则","规则内容符合法律要求，体现安全意识"],"explanation":"遵守交通规则既是对自己的生命安全负责，也是法律对小学生的基本要求，如走人行横道、不闯红灯、不在马路上追逐打闹。","point":"交通法规","subject":"道德与法治","stage":"小学","stageId":"primary","grade":"六年级","gradeId":"p6","difficulty":2,"source":"offline","createdAt":0},{"id":"j-chinese-001","type":"choice","stem":"曹操《观沧海》中，借助奇特想象表现大海吞吐日月星辰的气概、抒发诗人博大胸襟的句子是？","options":["水何澹澹，山岛竦峙","树木丛生，百草丰茂","日月之行，若出其中","秋风萧瑟，洪波涌起"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"“日月之行，若出其中；星汉灿烂，若出其里”以想象之笔写出大海吞吐日月星辰的气概，最能体现诗人的博大胸襟。","point":"古代诗歌名句的理解","subject":"语文","stage":"初中","stageId":"junior","grade":"七年级","gradeId":"j7","difficulty":2,"source":"offline","createdAt":0},{"id":"j-chinese-002","type":"subjective","stem":"修改下面的病句：“通过这次社会实践活动，使我明白了合作的重要性。”请写出修改后的句子，并简要说明理由。","options":[],"answer":"","referenceAnswer":"删去“通过”或“使”，改为“这次社会实践活动使我明白了合作的重要性”，或改为“通过这次社会实践活动，我明白了合作的重要性”。","rubric":["指出滥用介词导致句子缺少主语","给出修改后的正确句子","修改后句子通顺且原意不变"],"explanation":"“通过……使……”连用会使句子缺少主语，删去“通过”或“使”其中一个词，句子成分就完整了。","point":"病句的辨析与修改","subject":"语文","stage":"初中","stageId":"junior","grade":"七年级","gradeId":"j7","difficulty":3,"source":"offline","createdAt":0},{"id":"j-chinese-003","type":"choice","stem":"《三峡》中“自非亭午夜分，不见曦月”一句里“曦”的意思是？","options":["清晨","太阳","天气","明亮"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"“曦”本义指日光，这里指太阳；只有正午和半夜才能看见太阳和月亮，突出三峡两岸山高岭连、遮天蔽日。","point":"文言实词的含义","subject":"语文","stage":"初中","stageId":"junior","grade":"八年级","gradeId":"j8","difficulty":3,"source":"offline","createdAt":0},{"id":"j-chinese-004","type":"choice","stem":"《苏州园林》中“苏州园林与北京的园林不同，极少使用彩绘”一句主要运用了哪种说明方法？","options":["举例子","作比较","打比方","列数字"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"把苏州园林与北京园林放在一起相互对照，突出苏州园林极少使用彩绘的特点，这属于作比较的说明方法。","point":"说明方法的辨析","subject":"语文","stage":"初中","stageId":"junior","grade":"九年级","gradeId":"j9","difficulty":2,"source":"offline","createdAt":0},{"id":"j-chinese-005","type":"subjective","stem":"范仲淹《岳阳楼记》中表达作者远大政治抱负的名句是哪两句？请完整写出来。","options":[],"answer":"","referenceAnswer":"先天下之忧而忧，后天下之乐而乐。","rubric":["完整写出“先天下之忧而忧”","完整写出“后天下之乐而乐”","书写正确且无错别字"],"explanation":"这两句以“忧”“乐”对举，表现了作者以天下为己任、忧在天下人之先的政治抱负。","point":"古诗文名句的积累与运用","subject":"语文","stage":"初中","stageId":"junior","grade":"九年级","gradeId":"j9","difficulty":2,"source":"offline","createdAt":0},{"id":"j-math-006","type":"choice","stem":"解方程 2x + 5 = 13，则 x 的值是？","options":["3","4","9","6.5"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"移项得 2x = 13 − 5 = 8，两边同时除以 2 得 x = 4。","point":"一元一次方程的解法","subject":"数学","stage":"初中","stageId":"junior","grade":"七年级","gradeId":"j7","difficulty":1,"source":"offline","createdAt":0},{"id":"j-math-007","type":"choice","stem":"下列各组条件中，不能判定两个三角形全等的是？","options":["三边分别对应相等","两边及其夹角分别对应相等","两角及其夹边分别对应相等","两边及其中一边的对角分别对应相等"],"answer":"D","referenceAnswer":"","rubric":[],"explanation":"判定三角形全等有 SSS、SAS、ASA、AAS 和 HL 等方法，而两边及其中一边的对角对应相等（SSA）不能判定全等。","point":"全等三角形的判定","subject":"数学","stage":"初中","stageId":"junior","grade":"八年级","gradeId":"j8","difficulty":3,"source":"offline","createdAt":0},{"id":"j-math-008","type":"choice","stem":"计算 (x + 3)(x − 3) 的结果是？","options":["x² − 9","x² + 9","x² − 6x + 9","x² + 6x + 9"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"由平方差公式 (a + b)(a − b) = a² − b² 得 (x + 3)(x − 3) = x² − 9。","point":"平方差公式","subject":"数学","stage":"初中","stageId":"junior","grade":"八年级","gradeId":"j8","difficulty":1,"source":"offline","createdAt":0},{"id":"j-math-009","type":"choice","stem":"关于 x 的一元二次方程 x² − 2x + m = 0 有两个不相等的实数根，则 m 的取值范围是？","options":["m < 1","m > 1","m ≤ 1","m ≥ 1"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"方程有两个不相等的实数根，则判别式 Δ = (−2)² − 4 × 1 × m = 4 − 4m > 0，解得 m < 1。","point":"一元二次方程根的判别式","subject":"数学","stage":"初中","stageId":"junior","grade":"九年级","gradeId":"j9","difficulty":3,"source":"offline","createdAt":0},{"id":"j-math-010","type":"choice","stem":"在 Rt△ABC 中，∠C = 90°，若 sinA = 3/5，则 cosA 的值是？","options":["3/5","4/5","3/4","4/3"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"同角三角函数满足 sin²A + cos²A = 1，所以 cosA = √(1 − 9/25) = 4/5。","point":"锐角三角函数","subject":"数学","stage":"初中","stageId":"junior","grade":"九年级","gradeId":"j9","difficulty":3,"source":"offline","createdAt":0},{"id":"j-math-011","type":"subjective","stem":"已知二次函数 y = x² − 4x + 3，求它的图象的顶点坐标以及与 x 轴交点的坐标。","options":[],"answer":"","referenceAnswer":"配方得 y = (x − 2)² − 1，顶点坐标为 (2, −1)；令 y = 0 得 x² − 4x + 3 = 0，解得 x = 1 或 x = 3，与 x 轴交点为 (1, 0) 和 (3, 0)。","rubric":["用配方法或公式求出顶点坐标 (2, −1)","令 y = 0 得到对应的一元二次方程","正确解出交点 (1, 0) 和 (3, 0)"],"explanation":"配方后可直接从顶点式 (x − 2)² − 1 读出顶点坐标；抛物线与 x 轴交点的纵坐标为 0，解对应方程即可求出横坐标。","point":"二次函数的图象与性质","subject":"数学","stage":"初中","stageId":"junior","grade":"九年级","gradeId":"j9","difficulty":3,"source":"offline","createdAt":0},{"id":"j-english-012","type":"choice","stem":"My sister ______ to school by bike every day.","options":["go","goes","going","went"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"主语 My sister 是第三人称单数，every day 表示经常发生的动作，用一般现在时，动词要用第三人称单数形式 goes。","point":"一般现在时","subject":"英语","stage":"初中","stageId":"junior","grade":"七年级","gradeId":"j7","difficulty":2,"source":"offline","createdAt":0},{"id":"j-english-013","type":"choice","stem":"This book is ______ than that one.","options":["interesting","more interesting","most interesting","the most interesting"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"than 前面要用比较级，interesting 是多音节形容词，其比较级在前面加 more，即 more interesting。","point":"形容词的比较级","subject":"英语","stage":"初中","stageId":"junior","grade":"八年级","gradeId":"j8","difficulty":1,"source":"offline","createdAt":0},{"id":"j-english-014","type":"choice","stem":"Could you tell me ______?","options":["where is the bank","where the bank is","where was the bank","the bank where is"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"宾语从句要用陈述句语序，即“引导词 + 主语 + 谓语”，所以应选 where the bank is。","point":"宾语从句的语序","subject":"英语","stage":"初中","stageId":"junior","grade":"九年级","gradeId":"j9","difficulty":3,"source":"offline","createdAt":0},{"id":"j-english-015","type":"choice","stem":"The homework ______ by the students yesterday.","options":["finishes","finished","was finished","is finished"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"主语 The homework 是动作 finished 的承受者，且时间状语是 yesterday，因此用一般过去时的被动语态 was finished。","point":"一般过去时的被动语态","subject":"英语","stage":"初中","stageId":"junior","grade":"九年级","gradeId":"j9","difficulty":3,"source":"offline","createdAt":0},{"id":"j-english-016","type":"subjective","stem":"把下面的句子翻译成英语：我打算明天去图书馆。","options":[],"answer":"","referenceAnswer":"I am going to the library tomorrow. 也可以写成 I will go to the library tomorrow.","rubric":["用 be going to 或 will 表示“打算”","be 动词或助动词与主语 I 搭配正确","时间状语和地点状语表达正确、语序通顺"],"explanation":"“打算做某事”常用 be going to do 或 will do 结构，主语 I 对应的 be 动词是 am。","point":"一般将来时","subject":"英语","stage":"初中","stageId":"junior","grade":"八年级","gradeId":"j8","difficulty":2,"source":"offline","createdAt":0},{"id":"j-physics-017","type":"choice","stem":"声音在下列介质中传播速度最快的是？","options":["空气","水","钢铁","真空"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"声音在固体中传播最快，在液体中次之，在气体中最慢；真空不能传声，所以速度最快的是钢铁。","point":"声音的传播","subject":"物理","stage":"初中","stageId":"junior","grade":"八年级","gradeId":"j8","difficulty":1,"source":"offline","createdAt":0},{"id":"j-physics-018","type":"choice","stem":"把物体放在凸透镜二倍焦距以外，在光屏上得到的像是？","options":["倒立、缩小的实像","倒立、放大的实像","正立、放大的虚像","正立、等大的虚像"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"由凸透镜成像规律可知，物距大于二倍焦距时成倒立、缩小的实像，照相机就是这一规律的应用。","point":"凸透镜成像规律","subject":"物理","stage":"初中","stageId":"junior","grade":"八年级","gradeId":"j8","difficulty":2,"source":"offline","createdAt":0},{"id":"j-physics-019","type":"choice","stem":"一块冰全部熔化成水以后，下列物理量中不变的是？","options":["质量","体积","密度","状态"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"冰熔化成水，状态由固态变为液态，体积变小、密度变大，但所含物质的多少没变，即质量不变。","point":"质量与密度","subject":"物理","stage":"初中","stageId":"junior","grade":"八年级","gradeId":"j8","difficulty":2,"source":"offline","createdAt":0},{"id":"j-physics-020","type":"choice","stem":"某导体两端电压为 4V 时，通过它的电流为 0.5A，该导体的电阻是？","options":["2Ω","8Ω","0.125Ω","20Ω"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"由欧姆定律 I = U/R 变形得 R = U/I = 4V ÷ 0.5A = 8Ω。","point":"欧姆定律","subject":"物理","stage":"初中","stageId":"junior","grade":"九年级","gradeId":"j9","difficulty":2,"source":"offline","createdAt":0},{"id":"j-physics-021","type":"choice","stem":"一只标有“220V 100W”的灯泡正常发光时，通过灯丝的电流约为？","options":["0.45A","2.2A","0.22A","4.5A"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"正常发光时灯泡两端电压为 220V、功率为 100W，由 P = UI 得 I = P/U = 100W ÷ 220V ≈ 0.45A。","point":"电功率","subject":"物理","stage":"初中","stageId":"junior","grade":"九年级","gradeId":"j9","difficulty":3,"source":"offline","createdAt":0},{"id":"j-physics-022","type":"subjective","stem":"有一个物体质量为 540g，体积为 200cm³。求该物体的密度，并判断把它放入水中后是上浮还是下沉。","options":[],"answer":"","referenceAnswer":"ρ = m/V = 540g ÷ 200cm³ = 2.7g/cm³ = 2.7×10³kg/m³；因为物体的密度大于水的密度 1.0×10³kg/m³，所以把它放入水中会下沉。","rubric":["正确写出密度公式 ρ = m/V","代入数据算出 2.7g/cm³ 或 2.7×10³kg/m³","比较物体与水的密度并得出下沉的结论"],"explanation":"先用密度公式算出物体的密度，再与水的密度比较：物体密度大于水的密度时物体下沉。","point":"密度公式的应用与物体的浮沉条件","subject":"物理","stage":"初中","stageId":"junior","grade":"八年级","gradeId":"j8","difficulty":3,"source":"offline","createdAt":0},{"id":"j-chemistry-023","type":"subjective","stem":"写出铁在氧气中燃烧的化学方程式，并注明反应条件。","options":[],"answer":"","referenceAnswer":"3Fe + 2O₂ --点燃--> Fe₃O₄","rubric":["反应物和生成物书写正确","化学方程式配平正确","注明点燃的反应条件"],"explanation":"铁在氧气中燃烧生成四氧化三铁，属于化合反应，书写时要注意配平并注明点燃的条件。","point":"化学方程式的书写与配平","subject":"化学","stage":"初中","stageId":"junior","grade":"九年级","gradeId":"j9","difficulty":3,"source":"offline","createdAt":0},{"id":"j-chemistry-024","type":"choice","stem":"在化学反应前后，下列各项中一定不发生改变的是？","options":["分子的种类","原子的种类","分子的数目","物质的种类"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"由质量守恒定律可知，化学反应前后原子的种类、数目和质量都不变；分子的种类和物质的种类一定改变，分子的数目可能改变。","point":"质量守恒定律","subject":"化学","stage":"初中","stageId":"junior","grade":"九年级","gradeId":"j9","difficulty":3,"source":"offline","createdAt":0},{"id":"j-chemistry-025","type":"choice","stem":"要检验一瓶无色气体是否为二氧化碳，应该使用？","options":["燃着的木条","澄清石灰水","带火星的木条","紫色石蕊试液"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"把气体通入澄清石灰水，若石灰水变浑浊即可证明是二氧化碳；能使燃着的木条熄灭的气体不一定是二氧化碳。","point":"二氧化碳的检验","subject":"化学","stage":"初中","stageId":"junior","grade":"九年级","gradeId":"j9","difficulty":2,"source":"offline","createdAt":0},{"id":"j-chemistry-026","type":"choice","stem":"把 20g 食盐完全溶解在 80g 水中，所得溶液中溶质的质量分数是？","options":["20%","25%","80%","16%"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"溶液质量 = 20g + 80g = 100g，溶质质量分数 = 溶质质量 ÷ 溶液质量 × 100% = 20g ÷ 100g × 100% = 20%。","point":"溶质质量分数","subject":"化学","stage":"初中","stageId":"junior","grade":"九年级","gradeId":"j9","difficulty":2,"source":"offline","createdAt":0},{"id":"j-chemistry-027","type":"choice","stem":"下列金属中，金属活动性最强的是？","options":["铜","铁","镁","银"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"常见金属的活动性顺序中镁排在铁、铜、银的前面，所以四种金属里镁的活动性最强。","point":"金属活动性顺序","subject":"化学","stage":"初中","stageId":"junior","grade":"九年级","gradeId":"j9","difficulty":1,"source":"offline","createdAt":0},{"id":"j-biology-028","type":"choice","stem":"与动物细胞相比，植物细胞特有的结构是？","options":["细胞膜","细胞核","细胞壁","细胞质"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"植物细胞除了细胞膜、细胞质和细胞核外，还有细胞壁、液泡和叶绿体等动物细胞没有的结构。","point":"动植物细胞结构的比较","subject":"生物","stage":"初中","stageId":"junior","grade":"七年级","gradeId":"j7","difficulty":1,"source":"offline","createdAt":0},{"id":"j-biology-029","type":"choice","stem":"绿色植物进行光合作用的场所是？","options":["线粒体","叶绿体","细胞核","液泡"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"叶绿体是光合作用的场所，它利用光能把二氧化碳和水合成有机物并释放氧气；线粒体则是呼吸作用的主要场所。","point":"光合作用的场所","subject":"生物","stage":"初中","stageId":"junior","grade":"七年级","gradeId":"j7","difficulty":2,"source":"offline","createdAt":0},{"id":"j-biology-030","type":"choice","stem":"人体体循环的起点是？","options":["左心房","左心室","右心房","右心室"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"体循环的路线是左心室→主动脉→全身各级动脉→毛细血管→各级静脉→上、下腔静脉→右心房，所以起点是左心室。","point":"人体的血液循环","subject":"生物","stage":"初中","stageId":"junior","grade":"八年级","gradeId":"j8","difficulty":2,"source":"offline","createdAt":0},{"id":"j-biology-031","type":"choice","stem":"人的体细胞中有 23 对染色体，那么人的卵细胞中染色体数目是？","options":["46 条","23 条","23 对","22 对"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"形成生殖细胞时染色体数目减半，卵细胞中只有 23 条染色体，精子和卵细胞结合后又恢复为 23 对。","point":"基因在亲子代间的传递","subject":"生物","stage":"初中","stageId":"junior","grade":"八年级","gradeId":"j8","difficulty":2,"source":"offline","createdAt":0},{"id":"j-history-032","type":"choice","stem":"秦始皇为了加强对全国的统治，在地方上推行的制度是？","options":["分封制","郡县制","行省制","科举制"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"秦朝在地方推行郡县制，郡县的长官由朝廷直接任免，从而加强了中央对地方的控制。","point":"秦朝的中央集权制度","subject":"历史","stage":"初中","stageId":"junior","grade":"七年级","gradeId":"j7","difficulty":2,"source":"offline","createdAt":0},{"id":"j-history-033","type":"choice","stem":"中国近代史的开端是？","options":["虎门销烟","鸦片战争","甲午中日战争","辛亥革命"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"1840 年爆发的鸦片战争使中国开始沦为半殖民地半封建社会，是中国近代史的开端。","point":"鸦片战争","subject":"历史","stage":"初中","stageId":"junior","grade":"八年级","gradeId":"j8","difficulty":1,"source":"offline","createdAt":0},{"id":"j-history-034","type":"choice","stem":"五四运动中最能体现其反帝反封建性质的口号是？","options":["自强求富","变法维新","民主与科学","外争主权，内除国贼"],"answer":"D","referenceAnswer":"","rubric":[],"explanation":"“外争主权”体现反对帝国主义，“内除国贼”体现反对封建军阀统治，这一口号最能反映五四运动反帝反封建的性质。","point":"五四运动","subject":"历史","stage":"初中","stageId":"junior","grade":"九年级","gradeId":"j9","difficulty":3,"source":"offline","createdAt":0},{"id":"j-geography-035","type":"choice","stem":"在等高线地形图上，等高线越密集的地方表示？","options":["坡度越陡","坡度越缓","一定是山谷","一定是山脊"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"等高线越密集，说明单位水平距离上的高度差越大，坡就越陡；等高线稀疏的地方坡度较缓。","point":"等高线地形图的判读","subject":"地理","stage":"初中","stageId":"junior","grade":"七年级","gradeId":"j7","difficulty":2,"source":"offline","createdAt":0},{"id":"j-geography-036","type":"choice","stem":"下列现象中，由地球自转产生的是？","options":["四季的变化","昼夜交替","五带的划分","极昼和极夜"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"地球自转产生昼夜交替和时间的差异；四季变化、五带划分和极昼极夜现象都是地球公转产生的。","point":"地球的自转","subject":"地理","stage":"初中","stageId":"junior","grade":"七年级","gradeId":"j7","difficulty":2,"source":"offline","createdAt":0},{"id":"j-geography-037","type":"choice","stem":"我国冬季气温分布的特点是？","options":["南北温差很大","南北温差很小","东西温差很大","全国普遍高温"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"我国冬季南北气温差别很大，越往北气温越低；夏季则全国普遍高温，青藏高原等地除外。","point":"我国气温的分布特点","subject":"地理","stage":"初中","stageId":"junior","grade":"八年级","gradeId":"j8","difficulty":2,"source":"offline","createdAt":0},{"id":"j-geography-038","type":"choice","stem":"我国地势的基本特征是？","options":["东高西低，呈阶梯状分布","西高东低，呈三级阶梯状分布","南高北低，逐级降低","中部高、四周低"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"我国地势西高东低，大致呈三级阶梯状分布，这一特点使许多大河自西向东流入海洋。","point":"我国的地势特征","subject":"地理","stage":"初中","stageId":"junior","grade":"八年级","gradeId":"j8","difficulty":2,"source":"offline","createdAt":0},{"id":"j-morality-039","type":"choice","stem":"法律区别于道德等行为规范的最主要特征是？","options":["由国家制定或认可","靠社会舆论维护","由国家强制力保证实施","对全体社会成员具有普遍约束力"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"法律靠国家强制力保证实施，这是法律区别于道德等行为规范的最主要特征。","point":"法律的特征","subject":"道德与法治","stage":"初中","stageId":"junior","grade":"七年级","gradeId":"j7","difficulty":3,"source":"offline","createdAt":0},{"id":"j-morality-040","type":"choice","stem":"下列权利中，属于我国公民政治权利的是？","options":["选举权和被选举权","受教育权","劳动权","财产权"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"选举权和被选举权是公民的一项基本政治权利，行使这项权利是公民参与管理国家和管理社会的基础。","point":"公民的政治权利","subject":"道德与法治","stage":"初中","stageId":"junior","grade":"八年级","gradeId":"j8","difficulty":2,"source":"offline","createdAt":0},{"id":"j-morality-041","type":"choice","stem":"我国的根本政治制度是？","options":["人民代表大会制度","民族区域自治制度","基层群众自治制度","中国共产党领导的多党合作和政治协商制度"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"人民代表大会制度是我国的根本政治制度，其余三项是基本政治制度。","point":"我国的根本政治制度","subject":"道德与法治","stage":"初中","stageId":"junior","grade":"九年级","gradeId":"j9","difficulty":2,"source":"offline","createdAt":0},{"id":"s-chinese-001","type":"choice","stem":"下列各句中成语使用恰当的一项是？","options":["他做事总是首鼠两端，每次都果断地做出决定。","面对突如其来的灾难，大家齐心协力，共渡难关。","他的书法笔走龙蛇，工整得如同印刷体一般。","同学们津津有味地讨论着一道难题，会场气氛十分沉闷。"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"首鼠两端指迟疑不决，与果断矛盾；笔走龙蛇形容笔势雄健活泼，与工整如印刷矛盾；津津有味与沉闷矛盾。只有齐心协力与共渡难关一句成语使用恰当。","point":"正确使用成语","subject":"语文","stage":"高中","stageId":"senior","grade":"高一","gradeId":"s1","difficulty":3,"source":"offline","createdAt":0},{"id":"s-chinese-002","type":"choice","stem":"下列句子中没有语病的一项是？","options":["通过这次社会实践活动，使我明白了团结的重要性。","能否学好语文，关键在于要多读书、多积累。","图书馆里藏着许多关于中国历史的珍贵书籍。","为了防止此类事故不再发生，学校加强了安全管理。"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"第一句滥用介词导致主语残缺，去掉“通过”或“使”即可；第二句两面对一面，前面是能否后面只对应一方面；最后一句否定不当，防止与不再发生连用造成双重否定。","point":"辨析并修改病句","subject":"语文","stage":"高中","stageId":"senior","grade":"高一","gradeId":"s1","difficulty":3,"source":"offline","createdAt":0},{"id":"s-chinese-003","type":"choice","stem":"名句“先天下之忧而忧，后天下之乐而乐”出自下列哪篇作品？","options":["《醉翁亭记》","《小石潭记》","《桃花源记》","《岳阳楼记》"],"answer":"D","referenceAnswer":"","rubric":[],"explanation":"该句出自北宋范仲淹的《岳阳楼记》，表达了作者以天下为己任的政治抱负。","point":"文学常识与名句默写","subject":"语文","stage":"高中","stageId":"senior","grade":"高一","gradeId":"s1","difficulty":1,"source":"offline","createdAt":0},{"id":"s-chinese-004","type":"subjective","stem":"阅读杜甫《春望》中“感时花溅泪，恨别鸟惊心”两句，简要分析其运用的表现手法及表达效果。","options":[],"answer":"","referenceAnswer":"这两句运用了拟人（移情）的手法，把诗人感时伤别的情感移于花鸟，仿佛花也因感时而落泪、鸟也因恨别而惊心，实际上写的是诗人自己内心的巨大悲痛，使抒情更加深沉含蓄，感染力更强。","rubric":["指出拟人或移情的手法","说明花鸟之情实为诗人之情的投射","点出表达效果：情感深沉含蓄、富有感染力"],"explanation":"诗人以我观物，故物皆着我之色彩，花鸟的悲戚正是诗人忧国伤时、思念家人的情感外化，属于典型的移情于物。","point":"诗歌鉴赏中的表现手法","subject":"语文","stage":"高中","stageId":"senior","grade":"高二","gradeId":"s2","difficulty":3,"source":"offline","createdAt":0},{"id":"s-chinese-005","type":"subjective","stem":"把下面的句子翻译成现代汉语：君子博学而日参省乎己，则知明而行无过矣。","options":[],"answer":"","referenceAnswer":"君子广泛地学习，并且每天检查反省自己，就能智慧明达，行为也就没有过错了。","rubric":["译出“博学”为广泛地学习","译出“日参省乎己”为每天检查反省自己","译出“知”通“智”，智慧明达","译出“行无过”为行为没有过错，语句通顺"],"explanation":"句中“日”是名词作状语，译为每天；“知”是通假字，通“智”；“过”是名词，指过错。","point":"文言文翻译","subject":"语文","stage":"高中","stageId":"senior","grade":"高三","gradeId":"s3","difficulty":3,"source":"offline","createdAt":0},{"id":"s-math-006","type":"choice","stem":"函数 f(x) = x² - 2x + 3 在区间 [1, +∞) 上的单调性是？","options":["单调递减","先增后减","单调递增","先减后增"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"配方得 f(x) = (x - 1)² + 2，图象开口向上、对称轴为 x = 1，因此在 [1, +∞) 上单调递增。","point":"函数的单调性与最值","subject":"数学","stage":"高中","stageId":"senior","grade":"高一","gradeId":"s1","difficulty":2,"source":"offline","createdAt":0},{"id":"s-math-007","type":"choice","stem":"计算 log₂8 + log₃(1/9) 的值，结果为？","options":["3","5","-1","1"],"answer":"D","referenceAnswer":"","rubric":[],"explanation":"log₂8 = 3；因为 1/9 = 3⁻²，所以 log₃(1/9) = -2；两者相加得 3 + (-2) = 1。","point":"对数的运算性质","subject":"数学","stage":"高中","stageId":"senior","grade":"高一","gradeId":"s1","difficulty":2,"source":"offline","createdAt":0},{"id":"s-math-008","type":"choice","stem":"已知等差数列 {aₙ} 中 a₁ = 2，公差 d = 3，则 a₁₀ 的值为？","options":["29","30","32","27"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"由通项公式 aₙ = a₁ + (n - 1)d，得 a₁₀ = 2 + 9 × 3 = 29。","point":"等差数列的通项公式","subject":"数学","stage":"高中","stageId":"senior","grade":"高二","gradeId":"s2","difficulty":2,"source":"offline","createdAt":0},{"id":"s-math-009","type":"choice","stem":"从 1、2、3、4、5 这五个数字中任取两个不同的数字，两数之和为偶数的概率是？","options":["1/2","2/5","3/5","3/10"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"任取两个数字共有 10 种取法；两数之和为偶数须同奇或同偶，同奇有 3 种、同偶有 1 种，共 4 种，故概率为 4/10 = 2/5。","point":"古典概型","subject":"数学","stage":"高中","stageId":"senior","grade":"高二","gradeId":"s2","difficulty":3,"source":"offline","createdAt":0},{"id":"s-math-010","type":"subjective","stem":"已知函数 f(x) = x³ - 3x，求 f(x) 的极值。","options":[],"answer":"","referenceAnswer":"求导得 f′(x) = 3x² - 3，令 f′(x) = 0，解得 x = -1 或 x = 1。当 x 从左侧经过 -1 时 f′(x) 由正变负，所以 f(-1) = 2 是极大值；当 x 从左侧经过 1 时 f′(x) 由负变正，所以 f(1) = -2 是极小值。","rubric":["正确求出导数 f′(x) = 3x² - 3","求出驻点 x = -1 和 x = 1","判断极大值为 f(-1) = 2","判断极小值为 f(1) = -2"],"explanation":"f(x) 在 (-∞, -1) 与 (1, +∞) 上单调递增，在 (-1, 1) 上单调递减，因此先增后减处取极大值，先减后增处取极小值。","point":"利用导数求函数的极值","subject":"数学","stage":"高中","stageId":"senior","grade":"高三","gradeId":"s3","difficulty":3,"source":"offline","createdAt":0},{"id":"s-english-011","type":"choice","stem":"He ______ to the library every Sunday morning.","options":["go","going","goes","gone"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"every Sunday morning 表示经常性动作，用一般现在时；主语 He 是第三人称单数，动词用 goes。","point":"一般现在时与主谓一致","subject":"英语","stage":"高中","stageId":"senior","grade":"高一","gradeId":"s1","difficulty":1,"source":"offline","createdAt":0},{"id":"s-english-012","type":"choice","stem":"This is the book ______ I bought yesterday.","options":["who","whose","what","which"],"answer":"D","referenceAnswer":"","rubric":[],"explanation":"先行词 the book 指物，在从句中作 bought 的宾语，应用关系代词 which（或 that）；who 指人，whose 表所属，what 不能引导定语从句。","point":"定语从句的关系代词","subject":"英语","stage":"高中","stageId":"senior","grade":"高一","gradeId":"s1","difficulty":2,"source":"offline","createdAt":0},{"id":"s-english-013","type":"choice","stem":"If I ______ you, I would accept the offer.","options":["were","am","be","will be"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"与现在事实相反的虚拟条件句中，从句谓语用过去式，be 动词一律用 were，主句用 would + 动词原形。","point":"虚拟语气","subject":"英语","stage":"高中","stageId":"senior","grade":"高二","gradeId":"s2","difficulty":3,"source":"offline","createdAt":0},{"id":"s-english-014","type":"choice","stem":"The window ______ by Tom last night.","options":["broke","was broken","is broken","has broken"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"主语 the window 是动作的承受者，且时间状语 last night 表示过去，故用一般过去时的被动语态 was broken。","point":"一般过去时的被动语态","subject":"英语","stage":"高中","stageId":"senior","grade":"高二","gradeId":"s2","difficulty":2,"source":"offline","createdAt":0},{"id":"s-english-015","type":"subjective","stem":"将下面的句子翻译成英语：正是他的坚持才使得这个项目取得了成功。","options":[],"answer":"","referenceAnswer":"It was his persistence that made the project a success.","rubric":["使用强调句型 It was ... that ...","用 persistence 或 perseverance 等表达“坚持”","用 made the project a success 表达“使项目取得成功”","时态正确，句子结构完整"],"explanation":"本句强调主语 his persistence，应用强调句型 It is/was + 被强调部分 + that（指人时也可用 who）+ 其余部分，原句为过去发生的事，故用 was。","point":"强调句型的翻译","subject":"英语","stage":"高中","stageId":"senior","grade":"高三","gradeId":"s3","difficulty":3,"source":"offline","createdAt":0},{"id":"s-physics-016","type":"choice","stem":"物体由静止开始做匀加速直线运动，加速度为 2 m/s²，3 s 末的速度为？","options":["2 m/s","3 m/s","6 m/s","9 m/s"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"由 v = at = 2 × 3 = 6 m/s。","point":"匀变速直线运动的规律","subject":"物理","stage":"高中","stageId":"senior","grade":"高一","gradeId":"s1","difficulty":2,"source":"offline","createdAt":0},{"id":"s-physics-017","type":"choice","stem":"物体从 20 m 高处自由下落，取 g = 10 m/s²，不计空气阻力，落地所需时间为？","options":["1 s","2 s","3 s","4 s"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"由 h = ½gt² 得 20 = ½ × 10 × t²，即 t² = 4，解得 t = 2 s。","point":"自由落体运动","subject":"物理","stage":"高中","stageId":"senior","grade":"高一","gradeId":"s1","difficulty":2,"source":"offline","createdAt":0},{"id":"s-physics-018","type":"choice","stem":"质量为 2 kg 的物体受到 6 N 的合外力作用，其加速度为？","options":["1 m/s²","2 m/s²","3 m/s²","12 m/s²"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"由牛顿第二定律 a = F合 / m = 6 / 2 = 3 m/s²。","point":"牛顿第二定律","subject":"物理","stage":"高中","stageId":"senior","grade":"高二","gradeId":"s2","difficulty":2,"source":"offline","createdAt":0},{"id":"s-physics-019","type":"choice","stem":"在光滑水平面上，质量为 1 kg 的小球以 4 m/s 的速度与静止的、质量为 3 kg 的小球发生正碰并粘在一起运动，则碰后它们的共同速度为？","options":["2 m/s","3 m/s","4 m/s","1 m/s"],"answer":"D","referenceAnswer":"","rubric":[],"explanation":"碰撞过程动量守恒，取碰前方向为正：1 × 4 = (1 + 3) × v，解得 v = 1 m/s。","point":"动量守恒定律","subject":"物理","stage":"高中","stageId":"senior","grade":"高二","gradeId":"s2","difficulty":3,"source":"offline","createdAt":0},{"id":"s-physics-020","type":"subjective","stem":"在光滑水平面上，质量 m₁ = 2 kg 的物体以 v₁ = 3 m/s 向右运动，与质量 m₂ = 1 kg、原来静止的物体发生正碰。碰后 m₁ 以 1 m/s 的速度向右运动，求碰后 m₂ 的速度大小和方向。","options":[],"answer":"","referenceAnswer":"取向右为正方向。水平方向不受外力，系统动量守恒，由 m₁v₁ = m₁v₁′ + m₂v₂′ 得 2 × 3 = 2 × 1 + 1 × v₂′，解得 v₂′ = 4 m/s，方向向右。","rubric":["规定向右为正方向","写出动量守恒方程 m₁v₁ = m₁v₁′ + m₂v₂′","代入数据解得 v₂′ = 4 m/s","说明碰后 m₂ 的速度方向向右"],"explanation":"系统在水平方向所受合外力为零，动量守恒；代入已知量即得 m₂ 的速度。可检验碰前动能 9 J 与碰后动能 9 J 相等，符合弹性碰撞的规律。","point":"动量守恒定律的应用","subject":"物理","stage":"高中","stageId":"senior","grade":"高三","gradeId":"s3","difficulty":3,"source":"offline","createdAt":0},{"id":"s-chemistry-021","type":"choice","stem":"标准状况下，22.4 L 二氧化碳气体的物质的量约为？","options":["0.5 mol","1 mol","2 mol","22.4 mol"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"标准状况下气体摩尔体积约为 22.4 L/mol，故 n = 22.4 L ÷ 22.4 L/mol = 1 mol。","point":"气体摩尔体积","subject":"化学","stage":"高中","stageId":"senior","grade":"高一","gradeId":"s1","difficulty":1,"source":"offline","createdAt":0},{"id":"s-chemistry-022","type":"choice","stem":"在反应 2Na + 2H₂O = 2NaOH + H₂↑ 中，被氧化的物质是？","options":["H₂O","NaOH","Na","H₂"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"钠元素化合价由 0 升高到 +1，失电子被氧化；水中氢元素化合价由 +1 降低到 0，得电子被还原。","point":"氧化还原反应","subject":"化学","stage":"高中","stageId":"senior","grade":"高一","gradeId":"s1","difficulty":2,"source":"offline","createdAt":0},{"id":"s-chemistry-023","type":"choice","stem":"对于反应 N₂(g) + 3H₂(g) ⇌ 2NH₃(g)（正反应为放热反应），下列措施中能使平衡向正反应方向移动的是？","options":["升高温度","增大压强","使用催化剂","减小氮气的浓度"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"正反应放热，升温使平衡逆向移动；正反应气体分子数减少，增大压强使平衡正向移动；催化剂只加快反应速率不改变平衡状态；减小氮气浓度使平衡逆向移动。","point":"化学平衡移动原理","subject":"化学","stage":"高中","stageId":"senior","grade":"高二","gradeId":"s2","difficulty":3,"source":"offline","createdAt":0},{"id":"s-chemistry-024","type":"choice","stem":"将铁片放入稀盐酸中产生氢气，该反应的离子方程式书写正确的是？","options":["Fe + 2H⁺ = Fe³⁺ + H₂↑","2Fe + 6H⁺ = 2Fe³⁺ + 3H₂↑","Fe + H⁺ = Fe²⁺ + H₂↑","Fe + 2H⁺ = Fe²⁺ + H₂↑"],"answer":"D","referenceAnswer":"","rubric":[],"explanation":"铁与稀盐酸反应生成氯化亚铁和氢气，正确的一项原子守恒且电荷守恒；生成 Fe³⁺ 的两项不符合反应事实；Fe + H⁺ 一项电荷不守恒。","point":"离子方程式的书写","subject":"化学","stage":"高中","stageId":"senior","grade":"高二","gradeId":"s2","difficulty":3,"source":"offline","createdAt":0},{"id":"s-chemistry-025","type":"subjective","stem":"在铜锌原电池（稀硫酸作电解质溶液）中，指出正负极并写出两极的电极反应式。","options":[],"answer":"","referenceAnswer":"锌比铜活泼，锌片作负极，发生氧化反应：Zn - 2e⁻ = Zn²⁺；铜片作正极，发生还原反应：2H⁺ + 2e⁻ = H₂↑，正极上可观察到有气泡产生。","rubric":["指出锌为负极、铜为正极","写出负极反应式 Zn - 2e⁻ = Zn²⁺","写出正极反应式 2H⁺ + 2e⁻ = H₂↑","说明负极发生氧化反应、正极发生还原反应"],"explanation":"原电池中较活泼的金属作负极失去电子被氧化，溶液中的氢离子在正极得到电子被还原为氢气，电子由锌经导线流向铜。","point":"原电池的工作原理","subject":"化学","stage":"高中","stageId":"senior","grade":"高二","gradeId":"s2","difficulty":3,"source":"offline","createdAt":0},{"id":"s-biology-026","type":"choice","stem":"真核细胞的遗传物质主要存在于下列哪一结构中？","options":["细胞核","细胞质基质","细胞膜","核糖体"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"真核细胞的遗传物质 DNA 主要分布在细胞核内的染色体上，细胞质基质、细胞膜和核糖体都不是遗传物质的主要存在部位。","point":"细胞的结构与功能","subject":"生物","stage":"高中","stageId":"senior","grade":"高一","gradeId":"s1","difficulty":1,"source":"offline","createdAt":0},{"id":"s-biology-027","type":"choice","stem":"基因型为 AaBb 的个体自交，两对基因独立遗传且完全显性，后代中基因型为 aabb 的个体所占比例为？","options":["1/8","1/4","9/16","1/16"],"answer":"D","referenceAnswer":"","rubric":[],"explanation":"Aa 自交产生 aa 的概率为 1/4，Bb 自交产生 bb 的概率也为 1/4，两对基因独立遗传，故 aabb 的概率为 1/4 × 1/4 = 1/16。","point":"遗传规律中的自由组合定律","subject":"生物","stage":"高中","stageId":"senior","grade":"高二","gradeId":"s2","difficulty":3,"source":"offline","createdAt":0},{"id":"s-biology-028","type":"choice","stem":"正常情况下，人的精原细胞经减数分裂形成的精子中染色体数目为？","options":["46 条","23 条","92 条","24 条"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"人的体细胞含 46 条染色体，减数分裂后染色体数目减半，形成的精子中含 23 条染色体。","point":"减数分裂与配子的形成","subject":"生物","stage":"高中","stageId":"senior","grade":"高二","gradeId":"s2","difficulty":2,"source":"offline","createdAt":0},{"id":"s-biology-029","type":"subjective","stem":"孟德尔一对相对性状的杂交实验中，F₂ 的性状分离比是多少？请解释出现该比例的原因。","options":[],"answer":"","referenceAnswer":"F₂ 中显性性状与隐性性状的比例约为 3∶1。原因是 F₁（Dd）产生 D 和 d 两种配子且比例为 1∶1，受精时雌雄配子随机结合，形成的基因型及其比例为 DD∶Dd∶dd = 1∶2∶1，其中 DD 和 Dd 表现显性性状，dd 表现隐性性状，因此显性与隐性性状之比为 3∶1。","rubric":["答出性状分离比约为 3∶1","说明 F₁ 产生两种配子且比例为 1∶1","说明雌雄配子随机结合得到基因型比例 1∶2∶1","由基因型比例推出显隐性性状之比为 3∶1"],"explanation":"该比例成立的条件是显性作用完全、两种配子活力相同、受精随机且各基因型后代存活率相同。","point":"孟德尔一对相对性状的杂交实验","subject":"生物","stage":"高中","stageId":"senior","grade":"高三","gradeId":"s3","difficulty":3,"source":"offline","createdAt":0},{"id":"s-history-030","type":"choice","stem":"秦始皇为加强中央集权，在地方推行的制度是？","options":["分封制","行省制","郡县制","三省六部制"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"秦朝在地方废除分封制、全面推行郡县制，郡县长官由皇帝直接任免，加强了中央对地方的控制；行省制始于元朝，三省六部制始于隋唐。","point":"秦朝中央集权制度","subject":"历史","stage":"高中","stageId":"senior","grade":"高一","gradeId":"s1","difficulty":2,"source":"offline","createdAt":0},{"id":"s-history-031","type":"choice","stem":"中国近代史上第一个不平等条约是？","options":["《南京条约》","《北京条约》","《马关条约》","《辛丑条约》"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"1842 年鸦片战争后清政府被迫签订《南京条约》，这是中国近代史上第一个不平等条约，中国开始沦为半殖民地半封建社会。","point":"鸦片战争与近代不平等条约","subject":"历史","stage":"高中","stageId":"senior","grade":"高一","gradeId":"s1","difficulty":2,"source":"offline","createdAt":0},{"id":"s-history-032","type":"choice","stem":"标志着第二次世界大战全面爆发的事件是？","options":["日本偷袭珍珠港","苏德战争爆发","慕尼黑会议召开","德国突袭波兰"],"answer":"D","referenceAnswer":"","rubric":[],"explanation":"1939 年 9 月 1 日德国突袭波兰，英法对德宣战，第二次世界大战全面爆发；珍珠港事件使二战达到最大规模，慕尼黑会议是绥靖政策的顶峰。","point":"第二次世界大战的爆发","subject":"历史","stage":"高中","stageId":"senior","grade":"高二","gradeId":"s2","difficulty":2,"source":"offline","createdAt":0},{"id":"s-history-033","type":"subjective","stem":"简述五四运动的历史意义。","options":[],"answer":"","referenceAnswer":"五四运动是一场彻底反帝反封建的伟大爱国革命运动，工人阶级登上政治舞台并发挥主力军作用；它促进了马克思主义在中国的传播，促进了马克思主义同中国工人运动的结合；为中国共产党的成立作了思想上和干部上的准备；是中国新民主主义革命的开端。","rubric":["答出是一场彻底反帝反封建的爱国革命运动","答出促进了马克思主义传播及其与工人运动的结合","答出为中国共产党的成立作了思想上和干部上的准备","答出是中国新民主主义革命的开端"],"explanation":"五四运动中中国工人阶级开始以独立姿态登上政治舞台，成为运动主力，因此五四运动成为中国新民主主义革命的开端。","point":"五四运动的历史意义","subject":"历史","stage":"高中","stageId":"senior","grade":"高三","gradeId":"s3","difficulty":3,"source":"offline","createdAt":0},{"id":"s-geography-034","type":"choice","stem":"下列地理现象中，由地球公转产生的是？","options":["昼夜交替","四季更替","太阳东升西落","地方时差异"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"四季更替和昼夜长短的变化由地球公转产生；昼夜交替、太阳东升西落和地方时差异都是地球自转产生的现象。","point":"地球公转的地理意义","subject":"地理","stage":"高中","stageId":"senior","grade":"高一","gradeId":"s1","difficulty":2,"source":"offline","createdAt":0},{"id":"s-geography-035","type":"choice","stem":"我国东部季风区夏季盛行的风向是？","options":["东南风","西北风","西南风","东北风"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"夏季亚欧大陆增温快形成低压，风由太平洋高压吹向大陆，在我国东部季风区表现为东南风，带来温暖湿润的气流。","point":"东亚季风与大气环流","subject":"地理","stage":"高中","stageId":"senior","grade":"高一","gradeId":"s1","difficulty":2,"source":"offline","createdAt":0},{"id":"s-geography-036","type":"choice","stem":"北大西洋暖流对西欧气候的主要影响是？","options":["降温减湿","降温增湿","增温增湿","增温减湿"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"暖流流经海区水温高于两侧，对沿岸气候起增温增湿作用，北大西洋暖流使西欧冬季温和多雨、海洋性特征显著。","point":"洋流对地理环境的影响","subject":"地理","stage":"高中","stageId":"senior","grade":"高二","gradeId":"s2","difficulty":2,"source":"offline","createdAt":0},{"id":"s-geography-037","type":"subjective","stem":"简述黄土高原水土流失严重的自然原因。","options":[],"answer":"","referenceAnswer":"黄土土质疏松、垂直节理发育，容易被流水侵蚀；降水集中于夏季且多暴雨，地表径流侵蚀作用强；地表植被覆盖差，涵养水源和保持水土的能力弱；地形起伏大、沟壑纵横，进一步加剧了水土流失。","rubric":["答出土质疏松、易被流水侵蚀","答出降水集中于夏季且多暴雨","答出植被覆盖差、保持水土能力弱","答出地形起伏大或沟壑纵横"],"explanation":"水土流失是降水、土壤、植被、地形等因素综合作用的结果，其中疏松的黄土和集中的暴雨是主要自然原因。","point":"水土流失的成因分析","subject":"地理","stage":"高中","stageId":"senior","grade":"高三","gradeId":"s3","difficulty":3,"source":"offline","createdAt":0},{"id":"s-politics-038","type":"choice","stem":"在社会主义市场经济中，对资源配置起决定性作用的是？","options":["市场","政府","计划","企业"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"党的十八届三中全会明确提出，使市场在资源配置中起决定性作用，同时更好发挥政府作用。","point":"市场在资源配置中的决定性作用","subject":"政治","stage":"高中","stageId":"senior","grade":"高一","gradeId":"s1","difficulty":2,"source":"offline","createdAt":0},{"id":"s-politics-039","type":"choice","stem":"“刻舟求剑”这一寓言从哲学上说明的道理是？","options":["意识能够能动地改造客观世界","运动是绝对的，不能用静止不变的观点看问题","矛盾双方在一定条件下相互转化","实践是检验认识真理性的唯一标准"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"刻舟求剑者只看到船与剑相对位置的静止，否认了船和水的运动，犯了形而上学不变论的错误，说明运动是绝对的、无条件的，要用运动变化的观点看问题。","point":"物质与运动的关系","subject":"政治","stage":"高中","stageId":"senior","grade":"高一","gradeId":"s1","difficulty":3,"source":"offline","createdAt":0},{"id":"s-politics-040","type":"subjective","stem":"简述实践是认识的基础主要表现在哪些方面。","options":[],"answer":"","referenceAnswer":"实践是认识的来源，实践是认识发展的动力，实践是检验认识真理性的唯一标准，实践是认识的目的和归宿。","rubric":["答出实践是认识的来源","答出实践是认识发展的动力","答出实践是检验认识真理性的唯一标准","答出实践是认识的目的和归宿"],"explanation":"这四个方面从认识的产生、发展、检验和归宿等环节，共同说明实践对认识具有决定作用。","point":"实践是认识的基础","subject":"政治","stage":"高中","stageId":"senior","grade":"高三","gradeId":"s3","difficulty":2,"source":"offline","createdAt":0},{"id":"c-advmath-001","type":"choice","stem":"lim(x→0) sin x / x 的值为？","options":["0","1","∞","不存在"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"这是第一个重要极限，极限值为 1。也可用等价无穷小 sin x ~ x 得到比值为 1。","point":"重要极限","subject":"高等数学","stage":"大学","stageId":"college","grade":"大一","gradeId":"c1","difficulty":2,"source":"offline","createdAt":0},{"id":"c-advmath-002","type":"choice","stem":"定积分 ∫(0→1) x² dx 的值为？","options":["1/2","1/3","1/4","1"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"由牛顿-莱布尼茨公式，x² 的原函数是 x³/3，代入上下限得 1/3 − 0 = 1/3。","point":"定积分的计算","subject":"高等数学","stage":"大学","stageId":"college","grade":"大一","gradeId":"c1","difficulty":2,"source":"offline","createdAt":0},{"id":"c-advmath-003","type":"choice","stem":"函数 f(x) = x³ − 3x 的极大值为？","options":["2","0","−2","1"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"由 f′(x) = 3x² − 3 = 0 得驻点 x = ±1；f″(x) = 6x，在 x = −1 处 f″ < 0，故取极大值 f(−1) = −1 + 3 = 2。","point":"导数的应用","subject":"高等数学","stage":"大学","stageId":"college","grade":"大一","gradeId":"c1","difficulty":3,"source":"offline","createdAt":0},{"id":"c-advmath-004","type":"subjective","stem":"简述使用洛必达法则求极限时需要满足的条件。","options":[],"answer":"","referenceAnswer":"一是未定式条件：分子、分母的极限必须同时为 0（即 0/0 型）或同时为无穷大（即 ∞/∞ 型）；二是可导条件：在极限点的去心邻域内分子分母都可导，且分母的导数不为零；三是极限存在条件：分子导数与分母导数之比的极限存在或为无穷大，此时原极限等于该导数之比的极限。","rubric":["指出必须是 0/0 型或 ∞/∞ 型未定式","说明分子分母可导且分母导数不为零","说明导数之比的极限存在或为无穷大，且原极限与之相等"],"explanation":"洛必达法则只适用于 0/0 与 ∞/∞ 两种未定式，且必须以导数之比的极限存在为前提，否则法则失效。","point":"洛必达法则","subject":"高等数学","stage":"大学","stageId":"college","grade":"大一","gradeId":"c1","difficulty":3,"source":"offline","createdAt":0},{"id":"c-linalg-005","type":"choice","stem":"二阶行列式 |1 2; 3 4| 的值为？","options":["−2","2","−1","10"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"二阶行列式等于主对角线元素之积减去副对角线元素之积，即 1×4 − 2×3 = 4 − 6 = −2。","point":"行列式的计算","subject":"线性代数","stage":"大学","stageId":"college","grade":"大一","gradeId":"c1","difficulty":2,"source":"offline","createdAt":0},{"id":"c-linalg-006","type":"choice","stem":"设 A 为 3 阶方阵，且 |A| = 2，则 |2A| 等于？","options":["4","8","16","32"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"k 乘 n 阶方阵时，行列式要提出 k 的 n 次方，故 |2A| = 2³ × |A| = 8 × 2 = 16。","point":"行列式的性质","subject":"线性代数","stage":"大学","stageId":"college","grade":"大一","gradeId":"c1","difficulty":3,"source":"offline","createdAt":0},{"id":"c-linalg-007","type":"choice","stem":"向量组 α₁ = (1, 0, 0)，α₂ = (0, 1, 0)，α₃ = (1, 1, 0) 的秩为？","options":["0","1","2","3"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"因为 α₃ = α₁ + α₂，向量组线性相关，但 α₁ 与 α₂ 线性无关，故极大线性无关组含 2 个向量，秩为 2。","point":"向量组的秩","subject":"线性代数","stage":"大学","stageId":"college","grade":"大一","gradeId":"c1","difficulty":3,"source":"offline","createdAt":0},{"id":"c-linalg-008","type":"subjective","stem":"简述 n 阶方阵 A 可逆的等价条件。","options":[],"answer":"","referenceAnswer":"A 可逆等价于：A 的行列式 |A| ≠ 0；A 的列（行）向量组线性无关；齐次线性方程组 Ax = 0 只有零解；A 的秩等于 n；A 与 n 阶单位矩阵等价；A 可以表示为有限个初等矩阵的乘积。","rubric":["给出 |A| ≠ 0 这一基本判据","指出 A 的列（行）向量组线性无关或秩为 n","指出 Ax = 0 只有零解或 A 与单位矩阵等价"],"explanation":"对方阵而言，行列式非零、满秩、列向量组线性无关、方程组只有零解这些条件彼此等价，都是可逆的判定依据。","point":"逆矩阵","subject":"线性代数","stage":"大学","stageId":"college","grade":"大一","gradeId":"c1","difficulty":3,"source":"offline","createdAt":0},{"id":"c-collegeenglish-009","type":"choice","stem":"选择正确的形式填空：He ______ to school every day.","options":["go","going","gone","goes"],"answer":"D","referenceAnswer":"","rubric":[],"explanation":"主语 He 是第三人称单数，一般现在时中动词要加 -s，故用 goes。","point":"一般现在时","subject":"大学英语","stage":"大学","stageId":"college","grade":"大一","gradeId":"c1","difficulty":1,"source":"offline","createdAt":0},{"id":"c-collegeenglish-010","type":"choice","stem":"The word abundant most nearly means ______.","options":["充足的","稀少的","昂贵的","短暂的"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"abundant 意为大量的、充足的，与 充足的 意思最接近；稀少的 是 scarce，昂贵的 是 expensive。","point":"词汇辨析","subject":"大学英语","stage":"大学","stageId":"college","grade":"大一","gradeId":"c1","difficulty":2,"source":"offline","createdAt":0},{"id":"c-collegeenglish-011","type":"choice","stem":"选择正确的形式填空：The letter ______ by Tom yesterday.","options":["was written","writes","wrote","is written"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"信是被写的，且时间状语 yesterday 表示过去，因此用一般过去时的被动语态 was written。","point":"被动语态","subject":"大学英语","stage":"大学","stageId":"college","grade":"大一","gradeId":"c1","difficulty":2,"source":"offline","createdAt":0},{"id":"c-collegeenglish-012","type":"subjective","stem":"请把下面的句子翻译成中文：The development of artificial intelligence has changed the way people work.","options":[],"answer":"","referenceAnswer":"人工智能的发展改变了人们的工作方式。","rubric":["development of artificial intelligence 译为 人工智能的发展","changed the way people work 译为 改变了人们的工作方式","译文通顺，无漏译错译"],"explanation":"翻译时名词短语 development of artificial intelligence 作主语，the way people work 是同位语从句性质的表达，译为 人们的工作方式。","point":"英汉翻译","subject":"大学英语","stage":"大学","stageId":"college","grade":"大一","gradeId":"c1","difficulty":2,"source":"offline","createdAt":0},{"id":"c-collegephysics-013","type":"choice","stem":"做匀速圆周运动的物体，其加速度的方向是？","options":["沿切线方向","指向圆心","背离圆心","为零"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"匀速圆周运动的加速度就是向心加速度，大小恒为 v²/r，方向始终指向圆心，因此速度大小不变而方向不断改变。","point":"圆周运动","subject":"大学物理","stage":"大学","stageId":"college","grade":"大一","gradeId":"c1","difficulty":2,"source":"offline","createdAt":0},{"id":"c-collegephysics-014","type":"choice","stem":"质量为 2 kg 的物体受到 4 N 的合力作用，其加速度大小为？","options":["0.5 m/s²","1 m/s²","2 m/s²","4 m/s²"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"由牛顿第二定律 F = ma，得 a = F/m = 4/2 = 2 m/s²。","point":"牛顿第二定律","subject":"大学物理","stage":"大学","stageId":"college","grade":"大一","gradeId":"c1","difficulty":1,"source":"offline","createdAt":0},{"id":"c-collegephysics-015","type":"choice","stem":"物体从静止开始自由下落，取 g = 10 m/s²，下落 2 s 末的速度大小为？","options":["5 m/s","10 m/s","20 m/s","40 m/s"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"自由落体是初速度为零的匀加速直线运动，v = gt = 10 × 2 = 20 m/s，与质量无关。","point":"自由落体运动","subject":"大学物理","stage":"大学","stageId":"college","grade":"大一","gradeId":"c1","difficulty":2,"source":"offline","createdAt":0},{"id":"c-collegephysics-016","type":"subjective","stem":"简述动量守恒定律的适用条件。","options":[],"answer":"","referenceAnswer":"对一个由若干物体组成的系统，当系统所受的合外力为零（或合外力远小于内力、可忽略不计）时，系统的总动量保持不变，即相互作用前后各物体动量的矢量和相等。系统内力只能使动量在系统内部各物体之间转移，不能改变系统的总动量。","rubric":["指出系统所受合外力为零（或可忽略）这一条件","说明守恒的是系统总动量的矢量和","指出内力不能改变系统总动量"],"explanation":"动量守恒是矢量守恒，必须按分量或矢量合成计算，常见近似情形有碰撞、爆炸等内力远大于外力的过程。","point":"动量守恒定律","subject":"大学物理","stage":"大学","stageId":"college","grade":"大一","gradeId":"c1","difficulty":3,"source":"offline","createdAt":0},{"id":"c-probstat-017","type":"choice","stem":"掷一枚均匀骰子一次，出现偶数点的概率为？","options":["1/6","1/3","1/2","2/3"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"样本空间共 6 个等可能结果，偶数点有 2、4、6 共 3 个，故概率为 3/6 = 1/2。","point":"古典概型","subject":"概率论与数理统计","stage":"大学","stageId":"college","grade":"大一","gradeId":"c1","difficulty":1,"source":"offline","createdAt":0},{"id":"c-probstat-018","type":"choice","stem":"设随机变量 X 服从标准正态分布 N(0, 1)，则 P(X > 0) 等于？","options":["0","0.25","0.5","1"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"标准正态分布关于 x = 0 对称，密度曲线下 x > 0 与 x < 0 两部分面积相等，各占总面积的一半，故概率为 0.5。","point":"正态分布","subject":"概率论与数理统计","stage":"大学","stageId":"college","grade":"大一","gradeId":"c1","difficulty":2,"source":"offline","createdAt":0},{"id":"c-probstat-019","type":"choice","stem":"设事件 A 与 B 相互独立，P(A) = 0.5，P(B) = 0.4，则 P(AB) 等于？","options":["0.9","0.2","0.1","0.45"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"两事件相互独立时乘法公式成立，P(AB) = P(A)P(B) = 0.5 × 0.4 = 0.2。","point":"事件的独立性","subject":"概率论与数理统计","stage":"大学","stageId":"college","grade":"大一","gradeId":"c1","difficulty":2,"source":"offline","createdAt":0},{"id":"c-probstat-020","type":"subjective","stem":"简述中心极限定理的基本内容及其意义。","options":[],"answer":"","referenceAnswer":"设 X₁, X₂, …, Xn 是相互独立且同分布的随机变量，且具有有限的数学期望 μ 和方差 σ²（σ² > 0），则当 n 充分大时，样本均值近似服从正态分布 N(μ, σ²/n)，其标准化变量依分布收敛于标准正态分布。意义是：无论总体服从什么分布，大样本下样本均值的分布都近似正态，这为区间估计和假设检验提供了理论依据。","rubric":["说明随机变量相互独立同分布且方差有限","给出样本均值近似服从 N(μ, σ²/n) 或标准化后趋于标准正态分布","指出不依赖总体分布形式、为大样本统计推断提供依据"],"explanation":"中心极限定理是正态分布应用广泛的原因，也是抽样推断中样本量足够大即可使用正态近似的依据。","point":"中心极限定理","subject":"概率论与数理统计","stage":"大学","stageId":"college","grade":"大一","gradeId":"c1","difficulty":3,"source":"offline","createdAt":0},{"id":"c-coa-021","type":"choice","stem":"在计算机中，1 KB 等于多少字节？","options":["1000","1024","512","2048"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"计算机以 2 的幂作为存储容量单位，1 KB = 2¹⁰ B = 1024 B。","point":"存储容量单位","subject":"计算机组成原理","stage":"大学","stageId":"college","grade":"大二","gradeId":"c2","difficulty":1,"source":"offline","createdAt":0},{"id":"c-coa-022","type":"choice","stem":"8 位定点整数 −1 的补码表示为？","options":["0111 1111","1000 0000","1000 0001","1111 1111"],"answer":"D","referenceAnswer":"","rubric":[],"explanation":"补码的求法是取绝对值原码后按位取反再加 1：1 的原码为 0000 0001，取反得 1111 1110，加 1 得 1111 1111，即 −1 的补码。","point":"补码表示","subject":"计算机组成原理","stage":"大学","stageId":"college","grade":"大二","gradeId":"c2","difficulty":3,"source":"offline","createdAt":0},{"id":"c-coa-023","type":"choice","stem":"设置 Cache 的主要目的是？","options":["缓解 CPU 与主存之间的速度差距，提高存储系统速度","扩大主存的容量","存放操作系统文件","完全取代外存储器"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"Cache 利用程序访问的局部性原理，把近期常用的主存数据复制到高速缓存中，从而减少 CPU 访问主存的平均时间，缓解速度不匹配问题，其容量小、速度快。","point":"Cache 基本原理","subject":"计算机组成原理","stage":"大学","stageId":"college","grade":"大二","gradeId":"c2","difficulty":2,"source":"offline","createdAt":0},{"id":"c-coa-024","type":"subjective","stem":"简述冯·诺依曼计算机的基本结构特点。","options":[],"answer":"","referenceAnswer":"冯·诺依曼计算机由运算器、控制器、存储器、输入设备和输出设备五大部件组成，其中运算器与控制器合称中央处理器；程序和数据都以二进制形式存放在同一存储器中，即存储程序的思想；指令和数据按地址顺序存放，计算机按顺序自动逐条取出指令并执行，遇到转移指令时改变执行顺序。","rubric":["指出五大部件（运算器、控制器、存储器、输入设备、输出设备）","说明程序和数据同存于存储器并以二进制表示（存储程序）","说明按地址顺序自动逐条取指令并执行"],"explanation":"存储程序和程序控制是冯·诺依曼结构的核心思想，它的缺点是存在指令与数据不区分带来的冯·诺依曼瓶颈。","point":"冯·诺依曼结构","subject":"计算机组成原理","stage":"大学","stageId":"college","grade":"大二","gradeId":"c2","difficulty":3,"source":"offline","createdAt":0},{"id":"c-ds-025","type":"choice","stem":"在顺序表中随机访问第 i 个元素的时间复杂度为？","options":["O(1)","O(log n)","O(n)","O(n log n)"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"顺序表采用连续存储，第 i 个元素的地址可由起始地址和偏移量直接算出，与元素个数无关，因此随机访问的时间复杂度为 O(1)。","point":"顺序表的存储与访问","subject":"数据结构","stage":"大学","stageId":"college","grade":"大二","gradeId":"c2","difficulty":2,"source":"offline","createdAt":0},{"id":"c-ds-026","type":"choice","stem":"二叉树的先序遍历（先根遍历）的访问顺序是？","options":["左子树、根结点、右子树","左子树、右子树、根结点","右子树、根结点、左子树","根结点、左子树、右子树"],"answer":"D","referenceAnswer":"","rubric":[],"explanation":"先序遍历先访问根结点，再递归遍历左子树，最后递归遍历右子树；中序与后序的差别只在于根结点被访问的时机。","point":"二叉树的遍历","subject":"数据结构","stage":"大学","stageId":"college","grade":"大二","gradeId":"c2","difficulty":1,"source":"offline","createdAt":0},{"id":"c-ds-027","type":"choice","stem":"对含 n 个元素的有序顺序表进行折半（二分）查找，其时间复杂度为？","options":["O(1)","O(log n)","O(n)","O(n²)"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"折半查找每次比较都把查找区间缩小一半，最多比较约 log₂n 次，因此时间复杂度为 O(log n)，但要求表有序且采用顺序存储。","point":"查找算法","subject":"数据结构","stage":"大学","stageId":"college","grade":"大二","gradeId":"c2","difficulty":2,"source":"offline","createdAt":0},{"id":"c-ds-028","type":"subjective","stem":"简述栈和队列的主要区别。","options":[],"answer":"","referenceAnswer":"栈是只允许在一端（栈顶）进行插入和删除的线性表，特点是后进先出（LIFO）；队列是只允许在一端（队尾）插入、在另一端（队头）删除的线性表，特点是先进先出（FIFO）。栈常用于函数调用、表达式求值和递归的实现，队列常用于作业调度、缓冲和广度优先搜索。","rubric":["指出栈只能在一端插入删除、特点是后进先出","指出队列一端插入另一端删除、特点是先进先出","各举一个典型应用（如递归与函数调用、作业调度与广度优先搜索）"],"explanation":"两者的差别在于允许操作的位置不同，从而决定了元素的出栈（出队）顺序不同。","point":"栈与队列","subject":"数据结构","stage":"大学","stageId":"college","grade":"大二","gradeId":"c2","difficulty":2,"source":"offline","createdAt":0},{"id":"c-os-029","type":"choice","stem":"在分时系统中使用最普遍的进程调度算法是？","options":["先来先服务调度","短作业优先调度","静态优先级调度","时间片轮转调度"],"answer":"D","referenceAnswer":"","rubric":[],"explanation":"分时系统要求多个用户都能及时得到响应，时间片轮转让每个就绪进程轮流获得一个时间片，响应及时且公平，因此使用最普遍。","point":"进程调度算法","subject":"操作系统","stage":"大学","stageId":"college","grade":"大二","gradeId":"c2","difficulty":2,"source":"offline","createdAt":0},{"id":"c-os-030","type":"choice","stem":"产生死锁的四个必要条件中，不包括下列哪一项？","options":["互斥条件","请求并保持条件","不可剥夺条件","时间片耗尽"],"answer":"D","referenceAnswer":"","rubric":[],"explanation":"死锁的四个必要条件是互斥条件、请求并保持条件、不可剥夺条件和循环等待条件；时间片耗尽只是调度中的正常现象，与死锁无关。","point":"死锁的必要条件","subject":"操作系统","stage":"大学","stageId":"college","grade":"大二","gradeId":"c2","difficulty":3,"source":"offline","createdAt":0},{"id":"c-os-031","type":"choice","stem":"下列属于进程三种基本状态的是？","options":["就绪、运行、阻塞","编译、链接、执行","输入、输出、存储","创建、删除、修改"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"进程的三种基本状态是就绪、运行和阻塞，它们之间可因调度选中、时间片用完或等待事件发生而相互转换。","point":"进程的状态","subject":"操作系统","stage":"大学","stageId":"college","grade":"大二","gradeId":"c2","difficulty":2,"source":"offline","createdAt":0},{"id":"c-os-032","type":"subjective","stem":"简述时间片轮转调度算法的基本思想及其优点。","options":[],"answer":"","referenceAnswer":"就绪队列中的进程按先来先服务的原则排队，调度程序每次从队首取出一个进程，让它运行一个时间片；时间片用完而进程尚未结束时，该进程被剥夺处理器并排到就绪队列队尾，等待下一轮调度，如此循环。优点是响应快、公平，适合分时系统，能保证所有就绪进程都能在一段确定的时间内得到执行。","rubric":["说明按先来先服务排队、每个进程每次只运行一个时间片","说明时间片用完即排到队尾等待下一轮","指出响应快、公平、适合分时系统"],"explanation":"时间片轮转属于剥夺式调度，时间片过大会退化为先来先服务，过小则进程切换开销过大。","point":"时间片轮转调度","subject":"操作系统","stage":"大学","stageId":"college","grade":"大二","gradeId":"c2","difficulty":3,"source":"offline","createdAt":0},{"id":"c-network-033","type":"choice","stem":"TCP 协议工作在 OSI 参考模型的哪一层？","options":["网络层","传输层","会话层","应用层"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"TCP 提供端到端的可靠传输，属于传输层协议；网络层的代表协议是 IP，应用层的代表协议是 HTTP、FTP。","point":"OSI 参考模型","subject":"计算机网络","stage":"大学","stageId":"college","grade":"大二","gradeId":"c2","difficulty":2,"source":"offline","createdAt":0},{"id":"c-network-034","type":"choice","stem":"按传统的有类编址方式，IP 地址 192.168.1.1 属于哪一类地址？","options":["A 类","B 类","C 类","D 类"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"首字节在 1 到 126 之间为 A 类，128 到 191 为 B 类，192 到 223 为 C 类；192 落在 C 类范围，且 192.168 属于私有地址段。","point":"IP 地址分类","subject":"计算机网络","stage":"大学","stageId":"college","grade":"大二","gradeId":"c2","difficulty":2,"source":"offline","createdAt":0},{"id":"c-network-035","type":"choice","stem":"HTTP 协议默认使用的端口号是？","options":["21","25","80","443"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"HTTP 默认端口为 80，HTTPS 默认端口为 443，FTP 使用 21 和 20，SMTP 使用 25。","point":"应用层协议与端口","subject":"计算机网络","stage":"大学","stageId":"college","grade":"大二","gradeId":"c2","difficulty":1,"source":"offline","createdAt":0},{"id":"c-network-036","type":"subjective","stem":"简述 TCP 建立连接时三次握手的过程。","options":[],"answer":"","referenceAnswer":"第一次握手：客户端向服务器发送连接请求报文，其中同步位 SYN 置 1，并携带客户端的初始序号 seq = x，客户端进入同步已发送状态。第二次握手：服务器收到请求后，若同意连接，则回复确认报文，SYN 置 1 且确认位 ACK 置 1，确认号为 x + 1，同时携带服务器的初始序号 seq = y，服务器进入同步已收到状态。第三次握手：客户端收到后向服务器发送确认报文，ACK 置 1，确认号为 y + 1，序号为 x + 1，双方均进入连接已建立状态，连接建立完成。","rubric":["说明第一次握手是客户端发送 SYN 及初始序号","说明第二次握手服务器回复 SYN 与 ACK 及自己的初始序号","说明第三次握手客户端发送对服务器序号的确认，之后连接建立"],"explanation":"三次握手的目的是同步双方的初始序号并确认对方收发能力正常，同时也防止已失效的连接请求报文突然到达而造成错误连接。","point":"TCP 连接管理","subject":"计算机网络","stage":"大学","stageId":"college","grade":"大二","gradeId":"c2","difficulty":3,"source":"offline","createdAt":0},{"id":"c-database-037","type":"choice","stem":"在 SQL 中，用于从数据表中检索数据的关键字是？","options":["SELECT","UPDATE","INSERT","DELETE"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"SELECT 用于查询检索数据，UPDATE 用于修改数据，INSERT 用于插入数据，DELETE 用于删除数据。","point":"SQL 查询语句","subject":"数据库原理","stage":"大学","stageId":"college","grade":"大二","gradeId":"c2","difficulty":1,"source":"offline","createdAt":0},{"id":"c-database-038","type":"choice","stem":"在关系数据库中，能唯一标识关系中每一个元组的属性或属性组称为？","options":["外键","主键","索引","视图"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"主键（码）能唯一标识关系中的每个元组，其值不能重复也不能为空；外键用于建立与另一关系的参照联系。","point":"关系模型基本概念","subject":"数据库原理","stage":"大学","stageId":"college","grade":"大二","gradeId":"c2","difficulty":1,"source":"offline","createdAt":0},{"id":"c-database-039","type":"choice","stem":"事务的 ACID 特性中，字母 I 表示的是？","options":["原子性","一致性","隔离性","持久性"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"ACID 分别指原子性、一致性、隔离性和持久性，其中 I 是 Isolation，即隔离性，指并发事务之间互不干扰。","point":"事务的特性","subject":"数据库原理","stage":"大学","stageId":"college","grade":"大二","gradeId":"c2","difficulty":2,"source":"offline","createdAt":0},{"id":"c-database-040","type":"subjective","stem":"简述数据库系统的三级模式结构。","options":[],"answer":"","referenceAnswer":"数据库系统采用三级模式结构，即外模式、模式和内模式。外模式又称子模式或用户模式，是数据库用户能够看见和使用的局部数据的逻辑结构描述，一个数据库可以有多个外模式；模式又称逻辑模式，是数据库中全体数据的逻辑结构和特征的描述，是所有用户的公共数据视图，一个数据库只有一个模式；内模式又称存储模式，是数据物理结构和存储方式的描述，一个数据库只有一个内模式。三级模式之间通过外模式与模式的映像、模式与内模式的映像保证了数据的逻辑独立性和物理独立性。","rubric":["指出三级模式为外模式（用户模式）、模式（逻辑模式）、内模式（存储模式）","说明外模式可有多个而模式与内模式各只有一个","说明两级映像带来数据的逻辑独立性与物理独立性"],"explanation":"三级模式结构使数据的定义与存储分离，用户程序只与外模式相关，从而降低了数据冗余并提高了数据独立性。","point":"数据库系统结构","subject":"数据库原理","stage":"大学","stageId":"college","grade":"大二","gradeId":"c2","difficulty":3,"source":"offline","createdAt":0},{"id":"k-kaoyanmath1-001","type":"choice","stem":"当 x→0 时，下列无穷小中阶数（趋于零的速度）最高的是？","options":["1 − cos x","tan x","x − sin x","ln(1 + x²)"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"1 − cos x ~ x²/2，tan x ~ x，ln(1 + x²) ~ x²，均为 1 阶或 2 阶；而 x − sin x ~ x³/6，是 3 阶无穷小，阶数最高，故 C 正确。","point":"无穷小的阶与等价无穷小","subject":"考研数学一","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":4,"source":"offline","createdAt":0},{"id":"k-kaoyanmath1-002","type":"choice","stem":"定积分 ∫₀¹ x eˣ dx 的值为？","options":["1","e − 1","e","1/e"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"∫ x eˣ dx = eˣ(x − 1) + C，代入上下限：e¹(1 − 1) − e⁰(0 − 1) = 0 + 1 = 1，故 A 正确。","point":"定积分与分部积分法","subject":"考研数学一","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":3,"source":"offline","createdAt":0},{"id":"k-kaoyanmath1-003","type":"choice","stem":"设 z = xʸ（x > 0），则 ∂z/∂y 等于？","options":["y·xʸ⁻¹","xʸ·ln x","xʸ / y","y·ln x"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"对 y 求偏导时把 x 视为常数，幂指函数 xʸ 关于 y 求导为 xʸ ln x，故 B 正确；y·xʸ⁻¹ 是对 x 求偏导的结果。","point":"多元函数偏导数","subject":"考研数学一","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":4,"source":"offline","createdAt":0},{"id":"k-kaoyanmath1-004","type":"subjective","stem":"叙述罗尔定理的条件与结论，并说明如何由罗尔定理推出拉格朗日中值定理。","options":[],"answer":"","referenceAnswer":"罗尔定理：若函数 f(x) 在闭区间 [a, b] 上连续，在开区间 (a, b) 内可导，且 f(a) = f(b)，则至少存在一点 ξ ∈ (a, b)，使 f′(ξ) = 0。推导拉格朗日中值定理：设 f(x) 在 [a, b] 上连续、在 (a, b) 内可导，作辅助函数 F(x) = f(x) − f(a) − [(f(b) − f(a))/(b − a)]·(x − a)，则 F(x) 在 [a, b] 上连续、在 (a, b) 内可导，且 F(a) = F(b) = 0，满足罗尔定理条件，于是存在 ξ ∈ (a, b) 使 F′(ξ) = 0，即 f′(ξ) = (f(b) − f(a))/(b − a)，也就是 f(b) − f(a) = f′(ξ)(b − a)。","rubric":["准确叙述罗尔定理的三个条件与结论","构造辅助函数 F(x) 并验证它满足罗尔定理条件","由 F′(ξ) = 0 化简得到拉格朗日中值定理的结论"],"explanation":"关键在于用“减去弦线”的办法把一般情形化为端点函数值相等的罗尔定理情形，这是中值定理证明题的常用技巧。","point":"微分中值定理及其证明","subject":"考研数学一","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":5,"source":"offline","createdAt":0},{"id":"k-kaoyanmath2-005","type":"choice","stem":"微分方程 y′ + y = 1 的通解是？","options":["y = 1 + C·e⁻ˣ","y = 1 + C·eˣ","y = C·e⁻ˣ","y = C·eˣ − 1"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"这是一阶线性方程，积分因子为 eˣ，得 (y·eˣ)′ = eˣ，故 y·eˣ = eˣ + C，即 y = 1 + C·e⁻ˣ。也可直接验证：y = 1 + C·e⁻ˣ 时 y′ = −C·e⁻ˣ，y′ + y = 1 恒成立。","point":"一阶线性微分方程","subject":"考研数学二","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":3,"source":"offline","createdAt":0},{"id":"k-kaoyanmath2-006","type":"choice","stem":"三阶行列式 |1 2 3; 0 1 4; 5 6 0| 的值为？","options":["−1","0","1","2"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"按第一行展开：1×(1×0 − 4×6) − 2×(0×0 − 4×5) + 3×(0×6 − 1×5) = −24 + 40 − 15 = 1，故 C 正确。","point":"行列式的计算","subject":"考研数学二","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":3,"source":"offline","createdAt":0},{"id":"k-kaoyanmath2-007","type":"subjective","stem":"求由曲线 y = x² 与直线 y = x 所围成的平面图形绕 x 轴旋转一周所得旋转体的体积。","options":[],"answer":"","referenceAnswer":"由 x² = x 得交点为 (0, 0) 与 (1, 1)。在区间 [0, 1] 上恒有 x ≥ x²，上边界为 y = x，下边界为 y = x²。取体积微元 V = π∫₀¹ (x² − x⁴) dx = π[x³/3 − x⁵/5]₀¹ = π(1/3 − 1/5) = 2π/15。","rubric":["正确求出两条曲线的交点 (0, 0) 与 (1, 1)","写出绕 x 轴旋转的体积公式 V = π∫(x² − x⁴)dx","算出结果 2π/15"],"explanation":"绕 x 轴旋转时用“上方曲线平方减下方曲线平方”再积分，切忌只对一条曲线积分。","point":"定积分在几何中的应用","subject":"考研数学二","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":4,"source":"offline","createdAt":0},{"id":"k-kaoyanmath3-008","type":"choice","stem":"设离散型随机变量 X 的分布律为 P{X = k} = c·k，其中 k = 1, 2, 3，则常数 c 等于？","options":["1/3","1/6","1/2","1/9"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"由分布律的归一性：c(1 + 2 + 3) = 6c = 1，故 c = 1/6，B 正确。","point":"离散型随机变量的分布律","subject":"考研数学三","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":3,"source":"offline","createdAt":0},{"id":"k-kaoyanmath3-009","type":"choice","stem":"设某商品的需求函数为 Q = 100 − 2P，则当价格 P = 10 时，需求的价格弹性（取绝对值）为？","options":["0.25","0.5","0.8","2"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"P = 10 时 Q = 100 − 20 = 80。弹性的绝对值为 |(dQ/dP)·(P/Q)| = |−2| × 10/80 = 0.25，故 A 正确。","point":"导数在经济中的应用（需求弹性）","subject":"考研数学三","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":4,"source":"offline","createdAt":0},{"id":"k-kaoyanmath3-010","type":"subjective","stem":"设随机变量 X 服从参数为 λ 的泊松分布，求 E(X) 与 D(X)，并说明二者的关系。","options":[],"answer":"","referenceAnswer":"泊松分布的分布律为 P{X = k} = (λᵏ·e⁻λ)/k!，k = 0, 1, 2, …。由定义 E(X) = Σ k·(λᵏ·e⁻λ)/k! = λ。又 E[X(X − 1)] = λ²，于是 E(X²) = E[X(X − 1)] + E(X) = λ² + λ，从而 D(X) = E(X²) − [E(X)]² = λ² + λ − λ² = λ。可见泊松分布的数学期望与方差相等，都等于参数 λ。","rubric":["写出泊松分布的分布律","由定义求得 E(X) = λ","利用 E(X²) = E[X(X − 1)] + E(X) 求得 D(X) = λ","指出期望与方差相等且都等于 λ"],"explanation":"计算 E[X(X − 1)] 时把 k(k − 1)/k! 化为 1/(k − 2)! 再求和，可避免复杂的级数运算。","point":"泊松分布的期望与方差","subject":"考研数学三","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":4,"source":"offline","createdAt":0},{"id":"k-kaoyanenglish-011","type":"choice","stem":"The committee finally ______ the proposal after a heated debate.","options":["turned up","turned out","turned over","turned down"],"answer":"D","referenceAnswer":"","rubric":[],"explanation":"句中表示委员会经过激烈辩论后否决了该提案。turn down 意为拒绝、否决，符合语境；turn up 出现、调高音量，turn out 结果是、生产，turn over 移交、翻转，均不合题意。","point":"动词短语辨析","subject":"考研英语","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":4,"source":"offline","createdAt":0},{"id":"k-kaoyanenglish-012","type":"choice","stem":"______ the storm, the ship would have reached its destination on time.","options":["In case of","But for","Because of","Owing to"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"主句为 would have reached，是对过去情况的虚拟。But for 意为“要不是”，后接名词并引出与事实相反的假设，正好构成隐含的非真实条件；In case of 以防万一，Because of 与 Owing to 表示真实原因，均不能与虚拟主句搭配。","point":"虚拟语气与条件表达","subject":"考研英语","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":4,"source":"offline","createdAt":0},{"id":"k-kaoyanenglish-013","type":"choice","stem":"The new policy is expected to ______ economic growth in rural areas.","options":["simulate","stipulate","stimulate","accumulate"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"stimulate 意为刺激、促进，与 economic growth 搭配表示促进经济增长。simulate 模拟，stipulate 规定，accumulate 积累，三者都不能与“经济增长”构成促进关系。","point":"形近词辨析","subject":"考研英语","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":4,"source":"offline","createdAt":0},{"id":"k-kaoyanenglish-014","type":"subjective","stem":"请把下面的句子译成汉语，并说明句中 it 的语法作用：It is the capacity to adapt to change that determines whether an organization can survive in a competitive market.","options":[],"answer":"","referenceAnswer":"参考译文：正是适应变化的能力，决定了一个组织能否在竞争激烈的市场中生存下去。句中 it 引导的是强调句（It is … that … 结构），it 只是形式主语，被强调的成分是主语 the capacity to adapt to change，that 之后是句子的其余部分；去掉 It is 与 that 后，句子依然成立。","rubric":["译文准确，并译出强调语气（“正是……”）","指出 it 用于强调句结构、为形式主语","说明被强调成分是 the capacity to adapt to change"],"explanation":"判断强调句的方法是删去 It is 与 that，看剩余部分能否构成完整句子；此处剩余部分为 the capacity to adapt to change determines whether …，结构完整，故为强调句而非形式主语句。","point":"长难句翻译与强调句","subject":"考研英语","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":4,"source":"offline","createdAt":0},{"id":"k-kaoyanpolitics-015","type":"choice","stem":"公孙龙提出的“白马非马”命题，在哲学上的主要错误是？","options":["否认了矛盾的普遍性","割裂了矛盾普遍性与特殊性的关系","否认了矛盾的特殊性","否认了矛盾的同一性"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"“白马非马”只看到白马（个别、个性）与马（一般、共性）的区别，看不到共性寓于个性之中、个别一定与一般相联系，因而割裂了矛盾普遍性与特殊性的关系，B 正确。","point":"矛盾的普遍性与特殊性","subject":"考研政治","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":4,"source":"offline","createdAt":0},{"id":"k-kaoyanpolitics-016","type":"choice","stem":"近代中国社会诸多矛盾中，最主要的矛盾是？","options":["帝国主义和中华民族的矛盾","封建主义和人民大众的矛盾","资产阶级和无产阶级的矛盾","地主阶级和农民阶级的矛盾"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"近代中国社会的主要矛盾是帝国主义和中华民族的矛盾、封建主义和人民大众的矛盾，而其中最主要的是帝国主义和中华民族的矛盾，故 A 正确。","point":"近代中国社会的主要矛盾","subject":"考研政治","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":3,"source":"offline","createdAt":0},{"id":"k-kaoyanpolitics-017","type":"choice","stem":"马克思主义认识论认为，认识的本质是？","options":["主体对客体的能动反映","主体对客体的直观摹写","人脑自生的观念","客观精神的外化"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"马克思主义认识论是能动的反映论，认为认识是主体在实践基础上对客体的能动反映，具有摹写性与创造性的统一；B 是旧唯物主义直观反映论的观点，C 是唯心主义先验论，D 是客观唯心主义观点。","point":"认识的本质","subject":"考研政治","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":3,"source":"offline","createdAt":0},{"id":"k-kaoyanpolitics-018","type":"subjective","stem":"简述矛盾普遍性与特殊性的辩证关系及其方法论意义。","options":[],"answer":"","referenceAnswer":"第一，矛盾普遍性即矛盾的共性，指矛盾存在于一切事物之中并贯穿于每一事物发展过程的始终；矛盾特殊性即矛盾的个性，指具体事物的矛盾及其每个侧面各有其特点。第二，二者相互联结：普遍性寓于特殊性之中，并通过特殊性表现出来，没有脱离特殊性的普遍性；特殊性也离不开普遍性，个别一定与一般相联系而存在。第三，二者在一定条件下相互转化，在一定场合为普遍性的东西，在另一场合则变为特殊性。方法论意义：这一原理是矛盾问题的精髓，要求我们坚持一般号召与个别指导相结合，做到具体问题具体分析，把马克思主义普遍原理同中国具体实际相结合。","rubric":["指出普遍性寓于特殊性之中、特殊性包含普遍性","说明二者在一定条件下相互转化","答出具体问题具体分析、一般与个别相结合的方法论意义"],"explanation":"该原理是矛盾问题的精髓，也是马克思主义基本原理同中国具体实际相结合这一命题的哲学基础，常与中国特色社会主义实践结合考查。","point":"矛盾普遍性与特殊性的辩证关系","subject":"考研政治","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":5,"source":"offline","createdAt":0},{"id":"k-kaoyan408-019","type":"choice","stem":"对含有 n 个元素的有序顺序表进行折半（二分）查找，其时间复杂度为？","options":["O(1)","O(log₂n)","O(n)","O(n·log₂n)"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"折半查找每比较一次，待查区间长度减半，最多比较 ⌈log₂(n + 1)⌉ 次，故时间复杂度为 O(log₂n)，B 正确；折半查找要求表有序且顺序存储。","point":"折半查找的时间复杂度","subject":"计算机408综合","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":3,"source":"offline","createdAt":0},{"id":"k-kaoyan408-020","type":"choice","stem":"在页式存储管理中，若页面大小为 4KB，逻辑地址为 32 位，则页内偏移量的位数为？","options":["10","12","16","20"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"4KB = 2¹²，页内偏移量用于在一个页面内寻址，需要 log₂(2¹²) = 12 位，故 B 正确；剩余 32 − 12 = 20 位为页号。","point":"页式存储管理的地址结构","subject":"计算机408综合","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":4,"source":"offline","createdAt":0},{"id":"k-kaoyan408-021","type":"choice","stem":"TCP 建立连接时采用三次握手，这样做的主要目的是？","options":["防止已失效的连接请求报文段突然又传到服务端而造成错误","提高数据的传输速率","实现流量控制","实现拥塞控制"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"三次握手可以确认双方的收发能力，并使双方都确认对方的初始序号，还能防止已失效的连接请求报文段突然又传到服务端导致建立无用的连接，A 正确；流量控制由滑动窗口实现，拥塞控制由慢开始、拥塞避免等算法实现，与握手次数无关。","point":"TCP 三次握手","subject":"计算机408综合","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":4,"source":"offline","createdAt":0},{"id":"k-kaoyan408-022","type":"subjective","stem":"简述 Cache 与主存之间三种地址映射方式（直接映射、全相联映射、组相联映射）的基本特点。","options":[],"answer":"","referenceAnswer":"直接映射：主存中每一块只能映射到 Cache 中唯一确定的行，硬件实现简单、成本低、访问速度快，但块冲突概率高，Cache 空间利用率低。全相联映射：主存中任一块可以装入 Cache 的任意一行，块冲突概率最低、命中率高、空间利用率高，但需要将地址与所有行的标记同时比较，所需比较器多、成本高，只适合小容量 Cache。组相联映射：把 Cache 分成若干组，组间采用直接映射，组内采用全相联映射，是前两种方式的折中，兼顾了命中率与硬件开销，是实际系统中最常用的方式。","rubric":["说明直接映射的唯一对应关系及其优缺点","说明全相联映射可装入任意行及其成本代价","说明组相联映射是二者的折中（组间直接、组内全相联）"],"explanation":"三种映射的本质区别在于主存块可放置的位置数量，位置越多冲突越少但比较开销越大，组相联正是这一矛盾折中的产物。","point":"Cache 与主存的地址映射","subject":"计算机408综合","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":4,"source":"offline","createdAt":0},{"id":"k-kaoyanmba-023","type":"choice","stem":"只有加强环境保护，才能实现可持续发展。如果该判断为真，则可以推出？","options":["如果实现了可持续发展，则一定加强了环境保护","如果加强了环境保护，则一定能实现可持续发展","如果没有实现可持续发展，则一定没有加强环境保护","加强环境保护与能否可持续发展无关"],"answer":"A","referenceAnswer":"","rubric":[],"explanation":"“只有 P 才 Q”表示 P 是 Q 的必要条件，即 Q → P：实现了可持续发展必然意味着加强了环境保护，A 正确。B 把必要条件当成了充分条件；C 是“否定前件”的错误推理；D 与题干矛盾。","point":"假言推理（必要条件）","subject":"管理类联考","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":4,"source":"offline","createdAt":0},{"id":"k-kaoyanmba-024","type":"choice","stem":"甲、乙两人合作完成一项工作需要 6 天，甲单独完成需要 10 天，则乙单独完成这项工作需要多少天？","options":["12","14","15","18"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"设工作总量为 1，甲每天完成 1/10，两人每天共完成 1/6，故乙每天完成 1/6 − 1/10 = 1/15，乙单独完成需要 15 天，C 正确。","point":"工程问题（数学基础）","subject":"管理类联考","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":3,"source":"offline","createdAt":0},{"id":"k-kaoyanmba-025","type":"subjective","stem":"请指出下述论证的逻辑错误并说明理由：某公司发现去年增加广告投入后销售额上升，于是得出结论——增加广告投入必然带来销售额上升，因此今年应继续大幅增加广告投入。","options":[],"answer":"","referenceAnswer":"该论证存在两类错误。其一，以先后为因果、以相关代替因果：广告投入增加与销售额上升可能只是时间上的先后关系或同时发生，未必存在因果关系。其二，把可能的影响因素当成了充分条件：销售额上升还可能由产品质量提升、市场需求扩大、竞争对手退出、季节因素或价格调整等原因造成，广告投入只是可能的因素之一，不能推出“必然带来”销售额上升；即便二者确有相关，也不能保证今年继续大幅增加投入仍然有效，还需考虑边际效果递减与成本收益比较。","rubric":["指出以先后关系或相关关系代替因果关系的错误","指出把可能原因当成充分必要条件、结论过于绝对","提出其他可能导致销售额上升的因素作为削弱理由"],"explanation":"论证有效性分析的得分要点是准确命名谬误类型并给出针对性的削弱理由，而不是罗列与论证无关的一般原理。","point":"论证有效性分析（因果推理谬误）","subject":"管理类联考","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":4,"source":"offline","createdAt":0},{"id":"k-kaoyanlaw-026","type":"choice","stem":"根据我国刑法规定，已满十四周岁不满十六周岁的人，对下列哪一行为应当负刑事责任？","options":["盗窃","诈骗","抢劫","抢夺"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"刑法第十七条规定，已满十四周岁不满十六周岁的人，犯故意杀人、故意伤害致人重伤或者死亡、强奸、抢劫、贩卖毒品、放火、爆炸、投放危险物质罪的，应当负刑事责任。抢劫在列，盗窃、诈骗、抢夺均不在该相对负刑事责任年龄的范围之内，故 C 正确。","point":"刑事责任年龄","subject":"法硕联考","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":4,"source":"offline","createdAt":0},{"id":"k-kaoyanlaw-027","type":"choice","stem":"根据我国民法典的规定，向人民法院请求保护民事权利的一般诉讼时效期间为？","options":["一年","二年","三年","五年"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"民法典第一百八十八条规定，向人民法院请求保护民事权利的诉讼时效期间为三年，法律另有规定的依照其规定。故一般诉讼时效期间为三年，C 正确。","point":"诉讼时效期间","subject":"法硕联考","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":3,"source":"offline","createdAt":0},{"id":"k-kaoyanlaw-028","type":"choice","stem":"根据我国宪法规定，中华人民共和国的最高国家权力机关是？","options":["国务院","全国人民代表大会","最高人民法院","中央军事委员会"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"宪法规定，全国人民代表大会是最高国家权力机关，国务院是最高国家权力机关的执行机关、最高国家行政机关，最高人民法院是最高审判机关，中央军事委员会领导全国武装力量，故 B 正确。","point":"国家机构","subject":"法硕联考","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":3,"source":"offline","createdAt":0},{"id":"k-kaoyanlaw-029","type":"subjective","stem":"简述法律责任的构成要件。","options":[],"answer":"","referenceAnswer":"法律责任的构成要件通常包括：一是责任主体，即因违法或违约而应当承担法律责任的主体，须具有责任能力；二是违法行为或违约行为，即责任主体实施的违反法律规定的行为或不履行约定义务的行为，这是承担责任的前提；三是损害结果，即该行为造成的实际损害或者可能造成的危险；四是主观过错，包括故意与过失两种心理状态，法律有特别规定时以无过错责任或公平责任为例外；五是因果关系，即违法行为与损害结果之间存在引起与被引起的客观联系。上述要件一般须同时具备，才能追究行为人的法律责任。","rubric":["答出责任主体与违法行为（或违约行为）两个要件","答出损害结果以及行为与结果之间的因果关系","答出主观过错（故意与过失），并指出法律有特别规定的除外"],"explanation":"不同部门法对构成要件的要求略有差异，如刑法强调犯罪构成四要件，民法中有无过错责任原则，答题时应先答一般要件再作补充说明。","point":"法律责任的构成","subject":"法硕联考","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":4,"source":"offline","createdAt":0},{"id":"k-kaoyanedu-030","type":"choice","stem":"以《普通教育学》一书标志教育学开始成为一门独立学科、并被称为“现代教育学之父”的教育家是？","options":["夸美纽斯","赫尔巴特","杜威","洛克"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"赫尔巴特于 1806 年出版《普通教育学》，第一次把教育学建立在心理学和伦理学基础之上，使教育学成为一门独立学科，他被称为现代教育学之父、科学教育学之父，故 B 正确；夸美纽斯的《大教学论》是近代第一本教育学著作，杜威是现代教育派代表，洛克提出白板说。","point":"教育学的创立与赫尔巴特","subject":"教育学综合","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":4,"source":"offline","createdAt":0},{"id":"k-kaoyanedu-031","type":"choice","stem":"我国古代最早专门论述教育、教学问题的著作是？","options":["《论语》","《学记》","《大学》","《师说》"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"《学记》是《礼记》中的一篇，是我国也是世界上最早的一部专门论述教育、教学问题的著作，提出了教学相长、长善救失、藏息相辅等思想，故 B 正确；《论语》是语录体著作，《大学》是儒家论修身治国的篇章，《师说》为唐代韩愈论师道的文章。","point":"中国教育史（《学记》）","subject":"教育学综合","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":3,"source":"offline","createdAt":0},{"id":"k-kaoyanedu-032","type":"subjective","stem":"简述布鲁纳认知—发现学习理论的主要观点。","options":[],"answer":"","referenceAnswer":"布鲁纳主张学习不是被动接受刺激，而是学习者主动地形成和发展认知结构的过程，学习的目的在于以发现的方式掌握学科的基本结构，即学科的基本概念、基本原理及其相互联系。他提倡发现学习，即学习者通过自己的探索、独立思考去发现知识的内在规律与联系，教师的作用在于创设问题情境、提供线索而非直接告知结论。他还重视直觉思维的作用，认为直觉思维是发现学习的重要心理基础；强调内部动机（如好奇内驱力、胜任内驱力、互惠内驱力）比外部奖赏更能促进学习；并提出人类认知表征的三种方式：动作表征、映像表征和符号表征。","rubric":["指出学习是主动形成认知结构、应掌握学科基本结构","准确说明发现学习的含义与教师的作用","提及直觉思维、内部动机或三种认知表征方式"],"explanation":"布鲁纳的理论与奥苏贝尔的有意义接受学习理论常被对比考查，注意区分发现学习与接受学习、认知结构与认知同化。","point":"布鲁纳的认知—发现学习理论","subject":"教育学综合","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":4,"source":"offline","createdAt":0},{"id":"k-kaoyanpsy-033","type":"choice","stem":"在心理学的发展历程中，被称为心理学“第三势力”的流派是？","options":["行为主义","精神分析","人本主义","认知心理学"],"answer":"C","referenceAnswer":"","rubric":[],"explanation":"人本主义心理学强调人的价值、潜能与自我实现，由马斯洛、罗杰斯等人创立，因其既反对行为主义的环境决定论，也不同于精神分析的潜意识决定论，被称为心理学的第三势力，故 C 正确。","point":"心理学的主要流派","subject":"心理学综合","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":3,"source":"offline","createdAt":0},{"id":"k-kaoyanpsy-034","type":"choice","stem":"在一项心理学实验中，研究者将被试随机分为实验组和控制组，这种做法的主要目的是？","options":["消除实验者效应","使两组在无关变量上尽量相等，从而控制额外变量","提高测量结果的信度","增加样本的代表性"],"answer":"B","referenceAnswer":"","rubric":[],"explanation":"随机分组属于随机化控制，其核心作用是使被试的个体差异等无关变量在两组间大致均衡，从而把额外变量对因变量的影响降到最低，保证实验结果可以归因于自变量，故 B 正确；实验者效应用双盲法控制，信度与样本代表性都不是随机分组的主要目的。","point":"实验设计中的随机分组","subject":"心理学综合","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":4,"source":"offline","createdAt":0},{"id":"k-kaoyanpsy-035","type":"choice","stem":"根据皮亚杰的认知发展阶段理论，儿童能够进行抽象逻辑思维、出现假设—演绎推理的阶段是？","options":["感知运动阶段","前运算阶段","具体运算阶段","形式运算阶段"],"answer":"D","referenceAnswer":"","rubric":[],"explanation":"形式运算阶段（约 11 岁以后）的儿童摆脱了具体内容的束缚，能进行抽象逻辑思维和假设—演绎推理，可以运用符号进行命题运算，故 D 正确；具体运算阶段的思维仍需要具体事物的支持。","point":"皮亚杰认知发展阶段理论","subject":"心理学综合","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":4,"source":"offline","createdAt":0},{"id":"k-kaoyanpsy-036","type":"subjective","stem":"简述影响遗忘进程的主要因素。","options":[],"answer":"","referenceAnswer":"第一，学习材料的性质与数量：无意义材料、抽象材料比有意义材料、形象材料遗忘得更快，材料数量越多遗忘越快。第二，学习的程度：学习程度越高保持越好，实验表明学习程度达到 150% 的过度学习效果最佳，超过则效率下降。第三，学习材料的序列位置：材料的开头和末尾容易记住、中间部分容易遗忘，即系列位置效应。第四，识记者与材料的关系：符合个人需要、兴趣与情绪状态的材料遗忘较慢。第五，复习的安排方式：及时复习、分散复习、尝试回忆与反复阅读相结合，能有效延缓遗忘。","rubric":["答出学习材料的性质与数量、学习的程度（过度学习）两个因素","答出材料的序列位置效应（首尾易记、中间易忘）","答出识记者的态度情绪或复习方式的影响"],"explanation":"遗忘进程先快后慢是艾宾浩斯遗忘曲线的规律，答题时要把这条规律同影响遗忘的具体因素区分清楚。","point":"遗忘进程及其影响因素","subject":"心理学综合","stage":"考研","stageId":"postgrad","grade":"考研","gradeId":"k1","difficulty":4,"source":"offline","createdAt":0}]};

      h('div', { class: 'e-t', text: title || '' }),
      desc ? h('div', { class: 'e-d', html: desc }) : null
    );
    if (action) e.appendChild(h('div', { class: 'mt16' }, action));
    return e;
  }

  /** 带图标的行内按钮内容 */
  function iconRow(name, label, size) {
    return ICON(name, size || 17) + '<span>' + esc(label) + '</span>';
  }

  function switchEl(on, onchange) {
    var s = h('div', { class: 'switch' + (on ? ' on' : '') }, h('i'));
    s.addEventListener('click', function () {
      var next = !s.classList.contains('on');

  }

  function field(label, control, hint) {
    return h('div', { class: 'mb12' },
      h('div', { class: 'small muted mb8', text: label }),
      control,
      hint ? h('div', { class: 'tiny muted mt4', text: hint }) : null

  }

  // ---------------------------------------------------------------- theme
  var mq = null;
  function resolveTheme(mode) {
    mode = mode || 'system';
    if (mode !== 'system') return mode;
    try {
      if (w.matchMedia && w.matchMedia('(prefers-color-scheme: light)').matches) return 'light';
    } catch (e) { }
    return 'dark';
  }
  function applyTheme(mode) {
    var resolved = resolveTheme(mode);
    document.documentElement.setAttribute('data-theme', resolved);
    var meta = document.querySelector('meta[name="theme-color"]');
