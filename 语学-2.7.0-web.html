<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B1419">
<title>语学 2.7.0（网页版）</title>
<style>
/* 语学 yuxue — UI stylesheet (v2: 黑白夜主题 + 横屏/平板适配 + 矢量图标) */

/* ================================================================ 主题 token */
:root{
  --radius:16px; --radius-sm:11px; --tab-h:58px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --maxw:900px;
  color-scheme:dark;
}
:root, :root[data-theme="dark"]{
  --bg:#0B1419; --bg2:#102029; --surface:#12222B; --surface2:#18303C; --surface3:#1F3D4B;
  --border:#1F3D4B; --border2:#2B5364;
  --text:#E6F2F8; --text2:#B0CAD8; --muted:#7B98A8;
  --primary:#4CC2FF; --primary2:#7FD4FF; --accent:#2AA8E0; --on-primary:#04202E;
  --primary-soft:rgba(76,194,255,.14); --primary-bd:rgba(76,194,255,.42); --primary-glow:rgba(76,194,255,.22);
  --ok:#4ADE80; --ok-bg:rgba(74,222,128,.13); --ok-bd:rgba(74,222,128,.38);
  --bad:#FB7185; --bad-bg:rgba(251,113,133,.13); --bad-bd:rgba(251,113,133,.36);
  --warn:#FBBF24; --warn-bg:rgba(251,191,36,.12); --warn-bd:rgba(251,191,36,.34);
  --info:#2DD4BF; --info-bg:rgba(45,212,191,.1); --info-bd:rgba(45,212,191,.3);
  --tabbar-bg:rgba(11,20,25,.96); --overlay:rgba(3,9,13,.6);
  --toast-bg:rgba(24,48,60,.97); --toast-text:#E6F2F8;
  --shadow:0 12px 34px rgba(0,0,0,.5);
  --boot:linear-gradient(160deg,#10303E,#0B1419 62%);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F1F8FC; --bg2:#E4F1F9; --surface:#FFFFFF; --surface2:#EDF6FB; --surface3:#DCEDF7;
  --border:#DAE9F3; --border2:#BFD9E9;
  --text:#0F2029; --text2:#33505F; --muted:#68828F;
  --primary:#1683CC; --primary2:#0F6BA8; --accent:#0E9FD8; --on-primary:#FFFFFF;
  --primary-soft:rgba(22,131,204,.11); --primary-bd:rgba(22,131,204,.4); --primary-glow:rgba(22,131,204,.2);
  --ok:#12A150; --ok-bg:rgba(18,161,80,.1); --ok-bd:rgba(18,161,80,.3);
  --bad:#DC2626; --bad-bg:rgba(220,38,38,.09); --bad-bd:rgba(220,38,38,.28);
  --warn:#B4690E; --warn-bg:rgba(180,105,14,.1); --warn-bd:rgba(180,105,14,.3);
  --info:#0E8F86; --info-bg:rgba(14,143,134,.09); --info-bd:rgba(14,143,134,.28);
  --tabbar-bg:rgba(255,255,255,.97); --overlay:rgba(16,40,56,.38);
  --toast-bg:rgba(16,42,58,.95); --toast-text:#F1F8FC;
  --shadow:0 10px 30px rgba(20,60,90,.13);
  --boot:linear-gradient(160deg,#DAEDF9,#F1F8FC 62%);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer}
input,textarea,select{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:11px 13px;width:100%;outline:none;transition:border-color .15s,background .2s}
input:focus,textarea:focus,select:focus{border-color:var(--primary)}
textarea{resize:vertical;min-height:74px;line-height:1.6}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.hidden{display:none !important}
::-webkit-scrollbar{width:0;height:0}

/* 矢量图标 */
.ic{display:block;flex:none}
.ic-wrap{display:inline-flex;align-items:center;justify-content:center;line-height:0}

/* ================================================================ 启动页 */
.boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--boot);z-index:99}
.boot-logo{width:88px;height:88px;border-radius:24px;display:flex;align-items:center;justify-content:center;
  background:#fff;box-shadow:var(--shadow);overflow:hidden}
.boot-logo svg{width:70px;height:70px;display:block}
.boot-name{margin-top:18px;font-size:21px;font-weight:600;letter-spacing:3px}
.boot-sub{margin-top:4px;font-size:12.5px;color:var(--muted);letter-spacing:1px}
.boot-bar{margin-top:26px;width:112px;height:3px;border-radius:2px;background:var(--surface3);overflow:hidden}
.boot-bar i{display:block;height:100%;width:34%;border-radius:2px;background:linear-gradient(90deg,var(--primary),var(--primary2));
  animation:bootslide 1.1s ease-in-out infinite}
@keyframes bootslide{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}

/* ================================================================ 骨架 */
.app{height:100%;display:flex;flex-direction:column}
#views{flex:1;position:relative;overflow:hidden}
.view{position:absolute;top:0;bottom:0;left:0;right:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  display:none;flex-direction:column;background:var(--bg);margin:0 auto}
.view.active{display:flex}
.view.plain{padding:0 0 24px}
.view.plain > *{flex:none}
.scroll-pad{height:16px}

/* ================================================================ 底栏 */
#tabbar{height:calc(var(--tab-h) + var(--safe-b));padding-bottom:var(--safe-b);display:flex;
  margin:0 10px;border:1px solid var(--border);border-bottom:none;border-radius:20px 20px 0 0;
  background:var(--tabbar-bg);backdrop-filter:blur(12px);z-index:20;flex:none}
.tabbar-inner{display:flex;width:100%;max-width:var(--maxw);margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);transition:color .16s;padding-top:6px}
.tab .lb{font-size:10.5px;letter-spacing:.5px}
.tab.active{color:var(--primary2)}
.tab:active{opacity:.65}

/* ================================================================ 通用 */
.hd{display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t) + 14px) 16px 12px}
.hd h1{font-size:19px;margin:0;font-weight:600;flex:1}
.hd .sub{font-size:12px;color:var(--muted)}
.pane{padding:0 16px;width:100%;max-width:var(--maxw);margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;
  transition:background .2s,border-color .2s}
.card.tight{padding:12px}
.card-hd-t{font-size:15.5px;font-weight:600}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}
.center{text-align:center}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.divider{height:1px;background:var(--border);margin:12px 0}
.sect-title{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.6px;margin:18px 16px 9px;display:flex;align-items:center;gap:8px}
.pane .sect-title{margin-left:0;margin-right:0}
.sect-title:first-child{margin-top:6px}
.sect-title .line{flex:1;height:1px;background:var(--border)}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:12px;
  background:var(--surface2);border:1px solid var(--border2);font-size:14px;font-weight:500;transition:.15s;white-space:nowrap;color:var(--text)}
.btn:active{transform:scale(.975);opacity:.9}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));border-color:transparent;color:var(--on-primary);
  box-shadow:0 6px 18px var(--primary-glow)}
.btn.ghost{background:transparent;border-color:var(--border2)}
.btn.danger{color:var(--bad);border-color:var(--bad-bd);background:var(--bad-bg)}
.btn.ok{color:var(--on-primary);background:var(--ok);border-color:transparent;font-weight:600}
.btn.block{width:100%}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px}
.btn.xs{padding:5px 9px;font-size:11.5px;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}
/* 同一行的按钮：等高、等字号、等内边距，只是主操作更宽更醒目 */
.btn.lead{padding:12px 16px;font-size:14px;font-weight:600;border-radius:12px}
.btn-row{display:flex;gap:9px;align-items:stretch}
.btn-row .btn{flex:1;min-height:46px;padding:10px 12px;font-size:13.5px;border-radius:12px}
/* 题库卡的层次：刷题更宽更重，其余是辅助操作（同行仍然等高） */
.btn-row .btn.lead{flex:1.6;font-weight:600}
.btn-row.sub{gap:7px}
.btn-row.sub .btn{flex:1;min-height:34px;padding:7px 10px;font-size:12px;border-radius:10px;background:transparent;color:var(--text2)}

/* chip */
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:var(--surface2);
  border:1px solid var(--border2);font-size:12.5px;color:var(--text2);transition:.15s;white-space:nowrap}
.chip:active{opacity:.7}
.chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary2)}
.chip.tag{padding:3px 9px;font-size:11.5px;background:var(--surface3);border-color:transparent;color:var(--muted)}
.chip.ok{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok)}
.chip.bad{background:var(--bad-bg);border-color:var(--bad-bd);color:var(--bad)}
.chip.warn{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn)}
.chip.ai{background:var(--primary-soft);border-color:var(--primary);color:var(--primary2)}
.chip.rec{background:var(--info-bg);border-color:var(--info-bd);color:var(--info)}
.chip.xs{padding:1px 6px;font-size:10.5px;margin-left:6px;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}

/* 选项 */
.opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;padding:13px 14px;border-radius:13px;
  background:var(--surface2);border:1.5px solid transparent;margin-bottom:9px;transition:.15s;line-height:1.5;color:var(--text)}
.opt:active{transform:scale(.99)}
.opt .key{flex:none;width:24px;height:24px;border-radius:8px;background:var(--surface3);display:flex;align-items:center;
  justify-content:center;font-size:12.5px;font-weight:600;color:var(--text2);margin-top:1px}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.sel .key{background:var(--primary);color:var(--on-primary)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .key{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .key{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}

/* 统计块 */
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 12px;text-align:center}
.stat .v{font-size:23px;font-weight:650;letter-spacing:-.5px;line-height:1.25}
.stat .k{font-size:11.5px;color:var(--muted);margin-top:2px}
.stat .v.ok{color:var(--ok)}.stat .v.bad{color:var(--bad)}.stat .v.pri{color:var(--primary2)}

/* 进度条 */
.bar{height:7px;border-radius:4px;background:var(--surface3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--primary),var(--primary2));transition:width .4s}
.bar.ok i{background:var(--ok)}.bar.bad i{background:var(--bad)}.bar.warn i{background:var(--warn)}
.brow{margin-bottom:11px}
.brow .row{margin-bottom:5px;font-size:13px}

/* 图表 */
.chart{display:flex;align-items:flex-end;gap:6px;height:104px;padding:6px 2px 0}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px}
.chart .cb{width:100%;border-radius:5px 5px 3px 3px;background:linear-gradient(180deg,var(--primary2),var(--primary));
  min-height:3px;transition:height .4s}
.chart .cl{font-size:10px;color:var(--muted)}
.chart .cv{font-size:10px;color:var(--text2);font-weight:600}

/* 列表行 */
.lrow{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--surface);border:1px solid var(--border);
  border-radius:13px;margin-bottom:9px;transition:.15s;color:var(--text)}
.lrow:active{background:var(--surface2)}
.lrow.on{border-color:var(--primary);background:var(--primary-soft)}
.lrow .chev{flex:none;color:var(--muted);display:flex;align-items:center}
.lrow .ico{flex:none;width:36px;height:36px;border-radius:11px;background:var(--surface3);display:flex;align-items:center;
  justify-content:center;color:var(--text2)}
.lrow .t{font-size:14.5px;font-weight:500}
.lrow .d{font-size:11.5px;color:var(--muted);margin-top:2px}
.chev{color:var(--muted);flex:none;opacity:.8}

/* 空态 */
.empty{text-align:center;padding:46px 24px;color:var(--muted)}
.empty .e-ico{margin-bottom:12px;display:flex;justify-content:center;color:var(--border2)}
.empty .e-t{font-size:14px;margin-bottom:6px;color:var(--text2)}
.empty .e-d{font-size:12.5px;line-height:1.7}

/* ================================================================ 刷题流 */
#v-home{padding:0}
.feed{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;
  overscroll-behavior:none;scroll-behavior:auto;padding-bottom:2px}
/* 程序滚动（点「下一题」/自动翻页）期间关掉吸附，避免吸附引擎和动画互相抢位置造成跳动 */
.feed.moving{scroll-snap-type:none}
/* 在视口上方增删卡片的瞬间也关掉吸附：否则内容高度突变会让吸附引擎重新对齐，把用户甩回上一题 */
.feed.frozen{scroll-snap-type:none}
.feed::-webkit-scrollbar{display:none}
.qcard{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;
  padding:calc(var(--safe-t) + 8px) 0 8px;position:relative}
.qcard-inner{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:8px 16px 12px;width:100%;max-width:820px;margin:0 auto}
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.qstem{font-size:17.5px;line-height:1.72;font-weight:450;letter-spacing:.1px;margin-bottom:16px;word-break:break-word}
.qfoot{flex:none;padding:10px 16px calc(10px + var(--safe-b));border-top:1px solid var(--border);
  background:var(--tabbar-bg);display:flex;align-items:center;gap:10px}
.timer{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:42px}
.qhint{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}

/* 卡片顶部操作：读题 / 报错 / 收藏 / 斩 —— 窄屏放不下时整组换行，不许被裁掉 */
.qactions{display:flex;gap:6px;margin-left:auto;flex:none;flex-wrap:wrap;justify-content:flex-end;min-width:0;row-gap:5px}
.act-btn{width:31px;height:31px;border-radius:10px;background:var(--surface2);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--text2);transition:.15s}
.act-btn:active{transform:scale(.93)}
.act-btn.on{color:var(--warn);border-color:var(--warn-bd);background:var(--warn-bg)}
.act-btn.danger{color:var(--bad)}
.act-btn.live{color:var(--primary2);border-color:var(--primary-bd);background:var(--primary-soft)}

/* 判定结果：贴在卡片底栏上方（sticky 到底），圆角与全局一致 */
.qresult{position:sticky;bottom:-2px;z-index:3;margin:0 -16px -10px;padding:6px 16px 10px;
  background:var(--bg);border-radius:var(--radius) var(--radius) 0 0;
  max-height:58vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:auto;
  box-shadow:0 -10px 24px -12px rgba(0,0,0,.28)}
/* 判定完成后允许把滑动交给整屏：下滑就是下一题（抖音式） */
.qcard.done .qcard-inner{overscroll-behavior:auto}
.swipe-hint{text-align:center;margin:2px 0;letter-spacing:.3px}
.verdict{display:flex;align-items:center;gap:9px;padding:12px 14px;border-radius:var(--radius);margin:8px 0 10px;font-weight:600}
.verdict.ok{background:var(--ok-bg);border:1px solid var(--ok-bd);color:var(--ok)}
.verdict.bad{background:var(--bad-bg);border:1px solid var(--bad-bd);color:var(--bad)}
.verdict.part{background:var(--warn-bg);border:1px solid var(--warn-bd);color:var(--warn)}
.verdict .sc{margin-left:auto;font-size:18px;font-variant-numeric:tabular-nums}
.explain{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:13px 14px;font-size:13.5px;
  line-height:1.75;color:var(--text2);margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.explain h4{margin:0 0 7px;font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.5px}
.explain .lbl{color:var(--primary2);font-weight:600}
.chat{display:flex;flex-direction:column;gap:9px;margin-bottom:10px}
.bub{max-width:88%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.bub.me{align-self:flex-end;background:var(--primary-soft);border:1px solid var(--primary-bd);border-bottom-right-radius:5px}
.bub.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:5px}

/* 末尾：继续加载 / 生成中 */
.tail-card{height:100%;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 28px calc(var(--safe-b) + 40px);text-align:center}
.tail-card .t-ic{color:var(--primary2);margin-bottom:14px}
.tail-card .t-t{font-size:15px;font-weight:600;margin-bottom:6px}
.tail-card .t-d{font-size:12.5px;color:var(--muted);line-height:1.7;max-width:300px}
.progress{width:190px;height:4px;border-radius:2px;background:var(--surface3);overflow:hidden;margin:18px auto 12px}
.progress i{display:block;height:100%;width:42%;border-radius:2px;background:linear-gradient(90deg,var(--primary),var(--accent));
  animation:indet 1.35s cubic-bezier(.4,0,.2,1) infinite}
@keyframes indet{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}
.tip{font-size:12px;color:var(--muted);min-height:18px;transition:opacity .3s}

/* 顶部栏 */
.feed-top{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:7px;
  padding:calc(var(--safe-t) + 9px) 14px 14px;pointer-events:none;max-width:var(--maxw);margin:0 auto;
  background:linear-gradient(180deg,var(--tabbar-bg) 30%,transparent)}
.feed-top > *{pointer-events:auto}
.feed-top .chip{background:var(--tabbar-bg);backdrop-filter:blur(8px);min-width:0;max-width:44vw}
.feed-top .chip > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.feed-top-stat{font-size:11px;color:var(--muted);background:var(--tabbar-bg);border:1px solid var(--border);
  padding:5px 10px;border-radius:999px;backdrop-filter:blur(8px);white-space:nowrap}
.feed-top-stat b{color:var(--text2);font-weight:600}
/* 今日目标达成：数字变主题色，一眼看出今天够了 */
.feed-top-stat.goal-hit{border-color:var(--primary-bd);background:var(--primary-soft)}
.feed-top-stat.goal-hit b{color:var(--primary2)}
.feed-top-stat.goal-hit::after{content:' ✓';color:var(--primary2);font-weight:700}
.icon-btn{width:34px;height:34px;flex:none;border-radius:50%;background:var(--tabbar-bg);border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;color:var(--text2);backdrop-filter:blur(8px)}
.icon-btn:active{background:var(--surface3)}
.feed-top-spacer{flex:none;height:calc(var(--safe-t) + 50px)}
.qresult{margin-top:2px}
/* ---------------------------------------------------------------- 填空题 */
.fill-wrap{margin-bottom:4px}
.fill-input{width:100%;box-sizing:border-box;padding:14px 15px;font-size:18px;font-family:inherit;
  color:var(--text);background:var(--surface3);border:1.5px solid var(--border2);border-radius:14px;outline:none;
  transition:border-color .18s,background .18s}
.fill-input:focus{border-color:var(--primary);background:var(--surface)}
.fill-input:disabled{opacity:.62}
.fill-hint{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.6}
/* 卡片里也用 .t / .d（原本只给 .lrow 定义过） */
.card .t{font-size:14.5px;font-weight:500}
.card .d{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.62}
.src-badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:4px 8px;border-radius:999px;
  border:1px solid var(--border);background:var(--surface2);color:var(--muted);white-space:nowrap}
.src-badge.online{color:var(--ok);border-color:var(--ok-bd);background:var(--ok-bg)}
.src-badge.offline{color:var(--warn);border-color:var(--warn-bd);background:var(--warn-bg)}
.src-badge.checking{color:var(--info);border-color:var(--info-bd);background:var(--info-bg)}
.src-badge.checking svg{animation:spin 1s linear infinite}

/* 行内进度（题库补题） */
.fill-progress{margin-top:8px}
.fill-progress .bar{height:5px;border-radius:99px;background:var(--surface3);overflow:hidden}
.fill-progress .bar > i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .25s}
.fill-progress .txt{font-size:11px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between;gap:8px}

/* ================================================================ 弹层 / 页面 */
#sheet-root{position:fixed;inset:0;z-index:60;pointer-events:none}
.sheet-mask{position:absolute;inset:0;background:var(--overlay);opacity:0;transition:opacity .22s;pointer-events:auto}
.sheet-mask.on{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--surface);border-radius:22px 22px 0 0;
  border-top:1px solid var(--border2);transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;pointer-events:auto;padding-bottom:var(--safe-b);max-width:760px;margin:0 auto}
.sheet.on{transform:translateY(0)}
.sheet.full{height:92%}
/* 独立成页（设置、关于） */
.sheet.page{height:100%;max-height:100%;border-radius:0;border-top:0;max-width:var(--maxw)}
.sheet.page .sheet-hd{padding-top:calc(var(--safe-t) + 14px)}
.sheet.page .grabber{display:none}

/* 独立页的进场：从右侧推进来（不是从下往上弹），内容再逐行浮现一下。
   设置页层级深、内容多，用位移+淡入能让人看清「进来了」而不是一闪就换屏。 */
.sheet.page{
  transform:translate3d(30px,0,0);
  opacity:0;
  box-shadow:-18px 0 46px rgba(0,0,0,.20);
  transition:transform .30s cubic-bezier(.22,.82,.24,1),opacity .20s ease-out;
  will-change:transform,opacity;
}
.sheet.page.on{transform:translate3d(0,0,0);opacity:1}
.sheet.page.on .sheet-hd{animation:yxPageHd .26s cubic-bezier(.22,.82,.24,1) both}
.sheet.page.on .sheet-bd > * > *{animation:yxPageRow .30s cubic-bezier(.22,.82,.24,1) both}
.sheet.page.on .sheet-bd > * > *:nth-child(1){animation-delay:.02s}
.sheet.page.on .sheet-bd > * > *:nth-child(2){animation-delay:.045s}
.sheet.page.on .sheet-bd > * > *:nth-child(3){animation-delay:.07s}
.sheet.page.on .sheet-bd > * > *:nth-child(4){animation-delay:.095s}
.sheet.page.on .sheet-bd > * > *:nth-child(5){animation-delay:.12s}
.sheet.page.on .sheet-bd > * > *:nth-child(6){animation-delay:.14s}
.sheet.page.on .sheet-bd > * > *:nth-child(7){animation-delay:.16s}
.sheet.page.on .sheet-bd > * > *:nth-child(n+8){animation-delay:.175s}
.sheet.page.on .sheet-ft{animation:yxPageRow .30s cubic-bezier(.22,.82,.24,1) .18s both}
@keyframes yxPageHd{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes yxPageRow{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
/* 设置里关掉「界面动画」时一切照旧，别让动画变成负担 */
.no-anim .sheet.page,
.no-anim .sheet.page.on{position:absolute;transition:none;transform:none;opacity:1;box-shadow:none}
.no-anim .sheet.page.on .sheet-hd,
.no-anim .sheet.page.on .sheet-bd > * > *,
.no-anim .sheet.page.on .sheet-ft{animation:none}
@media (prefers-reduced-motion: reduce){
  .sheet.page{transition:none;transform:none;opacity:1}
  .sheet.page.on .sheet-hd,
  .sheet.page.on .sheet-bd > * > *,
  .sheet.page.on .sheet-ft{animation:none}
}
.sheet-hd{flex:none;padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sheet-hd h3{margin:0;font-size:16.5px;font-weight:600;flex:1}
.sheet-hd .x{width:32px;height:32px;border-radius:50%;background:var(--surface3);display:flex;align-items:center;
  justify-content:center;color:var(--text2)}
.sheet-bd{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px}
.sheet-bd.flush{padding:0}
.sheet-ft{flex:none;padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:10px;background:var(--surface)}
.sheet-ft .btn{flex:1}
.grabber{width:38px;height:4px;border-radius:2px;background:var(--surface3);margin:9px auto 0}

/* toast */
#toast-root{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + var(--safe-b) + 22px);z-index:80;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--toast-bg);border:1px solid var(--border2);color:var(--toast-text);padding:10px 17px;border-radius:12px;
  font-size:13.5px;max-width:86%;box-shadow:var(--shadow);animation:tin .22s ease-out;line-height:1.5;text-align:center}
.toast.ok{border-color:var(--ok-bd)}.toast.bad{border-color:var(--bad-bd)}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.toast.out{opacity:0;transform:translateY(8px);transition:.25s}

/* busy（仅用于必须阻塞的短操作） */
.busy{position:fixed;inset:0;z-index:70;background:var(--overlay);display:flex;align-items:center;justify-content:center}
.busy-box{background:var(--surface);border:1px solid var(--border2);border-radius:15px;padding:18px 24px;display:flex;
  align-items:center;gap:12px;box-shadow:var(--shadow);max-width:80%}
.busy-box em{font-style:normal;font-size:13.5px;color:var(--text2)}
.spinner{width:17px;height:17px;border-radius:50%;border:2px solid var(--surface3);border-top-color:var(--primary2);
  animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* 内联加载卡（非阻塞，可继续操作其他界面） */
.loadcard{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:var(--radius);margin-bottom:12px;
  background:var(--primary-soft);border:1px solid var(--primary-bd)}
.loadcard .progress{flex:1;margin:0;width:auto}
.loadcard .lc-t{font-size:13px;font-weight:600;color:var(--primary2);flex:none}

/* ================================================================ 其他 */
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:13.5px;border-bottom:1px solid var(--border)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted)}
.kv .v{text-align:right;word-break:break-all}
.switch{width:44px;height:26px;border-radius:14px;background:var(--surface3);position:relative;flex:none;transition:.2s}
.switch i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;
  box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--primary)}
.switch.on i{transform:translateX(18px)}
.tabs2{display:flex;gap:7px;padding:0 16px 10px;overflow-x:auto}
.pane .tabs2{padding-left:0;padding-right:0}
.tabs2 .chip{flex:none}
.kp{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:11px;background:var(--surface);
  border:1px solid var(--border);margin-bottom:7px;transition:.15s}
.kp.on{border-color:var(--primary);background:var(--primary-soft)}
.kp .ck{flex:none;width:19px;height:19px;border-radius:6px;border:1.5px solid var(--border2);margin-top:2px;
  display:flex;align-items:center;justify-content:center;color:transparent;font-size:12px}
.kp.on .ck{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.kp .nm{font-size:13.5px;line-height:1.5}
.kp .kw{font-size:11px;color:var(--muted);margin-top:3px}
.selbar{position:sticky;bottom:0;background:var(--tabbar-bg);border-top:1px solid var(--border);padding:11px 16px;
  display:flex;align-items:center;gap:11px;backdrop-filter:blur(10px)}
.md{font-size:13.8px;line-height:1.82;color:var(--text2);word-break:break-word}
.md h2{font-size:15.5px;color:var(--text);margin:16px 0 8px;padding-left:9px;border-left:3px solid var(--primary)}
.md h3{font-size:14px;color:var(--text);margin:13px 0 6px}
.md p{margin:0 0 9px}
.md li{margin:3px 0 3px 2px}
.md strong{color:var(--text)}
.md code{background:var(--surface3);padding:1px 5px;border-radius:5px;font-size:12.5px}
.md ul,.md ol{margin:4px 0 10px;padding-left:20px}
.md blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--border2);color:var(--muted)}
.md hr{border:0;border-top:1px solid var(--border);margin:12px 0}
.tagline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.stage-pill{display:flex;gap:0;background:var(--surface2);border-radius:12px;padding:3px;border:1px solid var(--border);
  width:100%;max-width:520px}
.stage-pill button{flex:1;padding:8px 0;border-radius:9px;font-size:12.5px;color:var(--muted);transition:.15s}
.stage-pill button.on{background:var(--surface3);color:var(--text);font-weight:600}
.hintbox{background:var(--info-bg);border:1px solid var(--info-bd);border-radius:12px;padding:11px 13px;
  font-size:12.5px;color:var(--info);line-height:1.7;margin-bottom:12px}
.warnbox{background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:12px;padding:11px 13px;
  font-size:12.5px;color:var(--warn);line-height:1.7;margin-bottom:12px}
.avatar-ic{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--primary2)}
.avatar-btn{width:50px;height:50px;border-radius:15px;background:var(--surface2);border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--text2)}
.avatar-btn.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary2)}
.seg{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;
  justify-content:center;gap:5px;transition:.15s}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.cat-title{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--muted);margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.cat-title .line{flex:1;height:1px;background:var(--border)}
.changelog-item{border-left:2px solid var(--border2);padding:0 0 2px 14px;margin:0 0 16px;position:relative}
.changelog-item:before{content:'';position:absolute;left:-6px;top:6px;width:9px;height:9px;border-radius:50%;
  background:var(--primary);border:2px solid var(--surface)}
.changelog-item .cv{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.changelog-item .cd{font-size:11.5px;color:var(--muted);margin:2px 0 6px}
.changelog-item ul{margin:0;padding-left:17px;font-size:12.8px;color:var(--text2);line-height:1.8}
.about-logo{width:84px;height:84px;margin:0 auto;border-radius:22px;background:#fff;box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.about-logo svg{width:66px;height:66px;display:block}
.bili-btn{background:linear-gradient(135deg,#FB7299,#EA5C86);border:0;color:#fff;font-weight:600;
  box-shadow:0 6px 18px rgba(251,114,153,.3)}
.kp-group{margin-bottom:14px}
.kp-group .kg-h{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:0 0 8px;font-weight:600}
.kp-group .kg-h .line{flex:1;height:1px;background:var(--border)}
.report-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 0 12px}
.nb-item{display:flex;align-items:center;gap:13px;padding:15px 14px;background:var(--surface);border:1px solid var(--border);
  border-radius:14px;margin-bottom:10px;transition:.15s;color:var(--text)}
.nb-item:active{background:var(--surface2)}
.nb-item .ico{flex:none;width:42px;height:42px;border-radius:13px;background:var(--primary-soft);color:var(--primary2);
  display:flex;align-items:center;justify-content:center}
.exam-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.exam-tile{padding:14px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--border);text-align:center;transition:.15s}
.exam-tile:active{background:var(--surface2)}
.exam-tile.on{border-color:var(--primary);background:var(--primary-soft)}
.exam-tile .et-ic{display:flex;justify-content:center;color:var(--primary2);margin-bottom:7px}
.exam-tile .et-n{font-size:13.5px;font-weight:600}
.exam-tile .et-d{font-size:11px;color:var(--muted);margin-top:3px}

/* 首屏加载 / 交叉加载（题目还没准备好时的加载界面） */
.feed-loading{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:0 32px calc(var(--safe-b) + 40px);text-align:center}

  display:flex;align-items:center;justify-content:center;color:var(--primary2);margin-bottom:4px}
.feed-loading .fl-t{font-size:15px;font-weight:600}
.feed-loading .fl-d{font-size:12.5px;color:var(--muted);line-height:1.7;max-width:320px}
.feed-loading .progress{margin:10px auto 2px}
.feed-loading .fl-steps{font-size:11.5px;color:var(--muted);min-height:17px}
.feed-loading .fl-steps b{color:var(--primary2);font-weight:600}

/* ================================================================ 横屏 / 平板 */
/* 题目正文：手机上按块级排，和平常一样；宽屏才变成左右两栏 */
.qbody{display:block}
.qcol{min-width:0}

@media (min-width: 700px){
  :root{--maxw:880px}
  .view{max-width:var(--maxw)}
  .grid2{grid-template-columns:repeat(2,1fr)}
  .chart{height:132px}
  .qcard-inner{padding:10px 24px 14px}
  .qstem{font-size:18.5px;margin-bottom:0}
  .sheet{max-width:720px}

  /* 左右分栏：左题干、右作答区（判定与解析也留在右栏） */
  #app[data-wide="auto"] .qbody,
  #app[data-wide="split"] .qbody{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);
    gap:0 26px;
    align-items:start;
  }
  #app[data-wide="auto"] .qcol-side > *:first-child,
  #app[data-wide="split"] .qcol-side > *:first-child{margin-top:2px}
  /* 分栏时右栏要从头开始排，别继承题干的下边距 */
  #app[data-wide="auto"] .qcol-side textarea,
  #app[data-wide="split"] .qcol-side textarea{min-height:150px}
  #app[data-wide="auto"] .qcol-side .qresult,
  #app[data-wide="split"] .qcol-side .qresult{position:static;margin:10px 0 0;padding:0;background:none;border:0;box-shadow:none}

  /* 分栏时左栏给题干留出通栏高度，避免长了就顶着底栏 */
  #app[data-wide="auto"] .qcol-main,
  #app[data-wide="split"] .qcol-main{padding-right:4px}
}
/* 平板上强制单栏（用户自己选的） */
#app[data-wide="single"] .qbody{display:block}

@media (min-width: 1000px){
  :root{--maxw:1040px}
  .grid3{grid-template-columns:repeat(3,1fr)}
  .exam-grid{grid-template-columns:repeat(4,1fr)}
  #app[data-wide="auto"] .qbody,
  #app[data-wide="split"] .qbody{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 34px}
}
/* 横屏：压缩纵向节奏，并用两列排布选项 */
@media (orientation: landscape){
  .opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
}

  :root{--tab-h:50px}

  .hd h1{font-size:17px}
  .qcard{padding-top:calc(var(--safe-t) + 2px)}
  .qcard-inner{padding:4px 20px 8px}
  .qstem{font-size:16px;margin-bottom:10px}
  .opt{padding:10px 12px;margin-bottom:7px}
  .qhead{margin-bottom:8px}
  .feed-top-spacer{height:calc(var(--safe-t) + 42px)}
  .feed-top{padding:calc(var(--safe-t) + 6px) 14px 10px}
  .tail-card{padding-bottom:calc(var(--safe-b) + 20px)}
  .stat .v{font-size:19px}

}

/* 手机窄屏：顶部一排按钮不再被挤掉（统计让位、按钮略缩、题库名过长时省略） */

  .icon-btn{width:31px;height:31px}
  .act-btn{width:28px;height:28px;border-radius:9px}
  .src-badge{padding:3px 6px;font-size:10px}
}

/* ---- 界面自定义（设置 → 界面） */
#app[data-font="small"]{zoom:.94}

  border-radius:var(--radius-sm);margin-bottom:8px}

/* ---- 新手引导 */
.guide-wrap{position:fixed;inset:0;z-index:900;background:var(--bg);display:flex;align-items:center;justify-content:center}
.guide-panel{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;
  padding:calc(var(--safe-t) + 14px) 18px calc(var(--safe-b) + 14px)}
.guide-hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.guide-hd b{font-size:15px}
.guide-card-box{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.guide-ico{width:52px;height:52px;border-radius:16px;background:var(--primary-soft);color:var(--primary2);
  display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.guide-t{font-size:20px;font-weight:700;margin:0 0 4px}
.guide-lead{font-size:13px;color:var(--muted);margin-bottom:14px}
.guide-body{font-size:14px;line-height:1.7;color:var(--text2)}
.guide-p{margin-bottom:10px}
.guide-ul,.guide-ol{margin:0 0 10px;padding-left:20px}
.guide-ul li,.guide-ol li{margin-bottom:7px}
.guide-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:12px}
.guide-card .gc-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.guide-card .gc-hd .ico{color:var(--primary2);display:flex}
.guide-dots{display:flex;justify-content:center;gap:6px;padding-top:12px}
.guide-dots .gd{width:7px;height:7px;border-radius:50%;background:var(--border2)}
.guide-dots .gd.on{background:var(--primary);width:18px;border-radius:4px}

/* ---- 新手引导：分屏滑动与页脚（gd-* 只服务于引导自身） */
.gd-view{position:relative;overflow-x:hidden}
/* 分屏切换：JS 只切一个 class，滑动本身交给 CSS 关键帧，一帧都不用手动算 */
.gd-slide{opacity:0}
.gd-slide.gd-in{animation:gdInFwd .28s cubic-bezier(.22,.82,.24,1) both}
.gd-slide.gd-in.gd-back{animation-name:gdInBack}
@keyframes gdInFwd{from{opacity:0;transform:translate3d(26px,0,0)}to{opacity:1;transform:none}}
@keyframes gdInBack{from{opacity:0;transform:translate3d(-26px,0,0)}to{opacity:1;transform:none}}
/* 设置里关掉「界面动画」时，引导的翻屏也不许动 */
.no-anim .gd-slide,
.no-anim .gd-slide.gd-in{opacity:1;animation:none;transform:none}
@media (prefers-reduced-motion: reduce){
  .gd-slide,
  .gd-slide.gd-in{opacity:1;animation:none;transform:none}
}
.gd-count{flex:none;padding:1px 8px;border-radius:999px;background:var(--surface3);color:var(--muted)}
.gd-skip{flex:none}
.gd-ft{flex:none;padding-top:4px}

<script>
/* ===== 网页版运行时：模拟 Android 原生桥（真机上是 window.YX） ===== */
/* 语学 — 浏览器预览用的假原生桥
 *
 * 真机上 window.YX 是 Android 那层注入的；在浏览器里没有它，App 会退化成
 * 预览模式（存储走 localStorage，但缺少 toast/朗读/导出等能力）。
 * 这个文件补一个「等价物」，让预览里的行为尽量接近真机，
 * 方便在电脑或 DSH 的 WebView 里检查界面与流程。
 */
(function (w) {
  'use strict';

  var LS = 'yxpreview:';
  var seq = 0, waiting = {};

  function keys() {
    var out = [];
    try {
      for (var i = 0; i < w.localStorage.length; i++) {
        var k = w.localStorage.key(i);
        if (k && k.indexOf(LS) === 0) out.push(k.slice(LS.length));
      }
    } catch (e) { }
    return out;
  }

  w.__yxHttpResult = w.__yxHttpResult || function () { };

  w.YX = {
    ping: function () { return 'pong'; },
    info: function () {
      return JSON.stringify({
        app: '语学', pkg: 'com.yuxue.app.preview', versionName: '2.7.0（浏览器预览）',
        model: navigator.userAgent.replace(/^Mozilla\/[\d.]+ /, '').slice(0, 60),
        brand: 'browser', sdk: 0, native: true, preview: true
      });
    },
    httpAsync: function (id, method, url, headers, body) {
      var t0 = Date.now();
      var h = {};
      try { h = JSON.parse(headers || '{}'); } catch (e) { }
      fetch(url, { method: method || 'GET', headers: h, body: body || undefined })
        .then(function (r) {
          return r.text().then(function (t) {
            return { id: id, ok: r.ok, status: r.status, body: t, ms: Date.now() - t0 };
          });
        })
        .catch(function (e) {
          return {
            id: id, ok: false, status: 0, body: '', ms: Date.now() - t0,
            error: String(e && e.message || e) + '（浏览器预览受跨域限制，真机无此问题）'
          };
        })
        .then(function (r) { w.__yxHttpResult(JSON.stringify(r)); });
    },
    save: function (k, v) { try { w.localStorage.setItem(LS + k, v); return true; } catch (e) { return false; } },
    load: function (k) { try { return w.localStorage.getItem(LS + k) || ''; } catch (e) { return ''; } },
    remove: function (k) { try { w.localStorage.removeItem(LS + k); return true; } catch (e) { return false; } },
    keys: function () { return JSON.stringify(keys()); },
    storageInfo: function () {
      var bytes = 0;
      keys().forEach(function (k) { try { bytes += (w.localStorage.getItem(LS + k) || '').length; } catch (e) { } });
      return JSON.stringify({ bytes: bytes, files: keys().length, dir: '浏览器 localStorage（预览）' });
    },
    toast: function () { },
    vibrate: function (ms) { try { navigator.vibrate && navigator.vibrate(ms || 18); } catch (e) { } },
    haptic: function () { return false; },       // 返回 false → FX 会退化到 vibrate()
    speak: function (text, rate) {
      try {
        if (!w.speechSynthesis || !w.SpeechSynthesisUtterance) return false;
        w.speechSynthesis.cancel();
        var u = new w.SpeechSynthesisUtterance(String(text || ''));
        u.lang = 'zh-CN';
        u.rate = Number(rate) || 1;
        w.speechSynthesis.speak(u);
        return true;
      } catch (e) { return false; }
    },
    stopSpeak: function () { try { w.speechSynthesis && w.speechSynthesis.cancel(); } catch (e) { } },
    ttsStatus: function () {
      return JSON.stringify({
        ready: !!(w.speechSynthesis), lang: 'zh-CN',
        engine: '浏览器语音合成（预览）', error: w.speechSynthesis ? '' : '此浏览器不支持朗读'
      });
    },
    copy: function (t) {
      try {
        var ta = document.createElement('textarea');
        ta.value = String(t == null ? '' : t);
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (e) { return false; }
    },
    keepScreenOn: function () { },
    setTheme: function () { },
    shareText: function (t) {
      try {
        if (navigator.share) { navigator.share({ text: String(t || '') }); return true; }
      } catch (e) { }
      return false;
    },
    openUrl: function (u) { try { w.open(u, '_blank'); return true; } catch (e) { return false; } },
    exportJson: function (name, content) {
      try {
        var blob = new Blob([String(content == null ? '' : content)], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name || 'yuxue.json';
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        return '已下载 ' + (name || '');
      } catch (e) { return '导出失败：' + e; }
    },
    finish: function () { },
    backHandled: function () { },
    log: function (m) { try { console.log('[YX] ' + m); } catch (e) { } },
    pickJson: function (id) {
      // 预览里用一个隐藏的 file input 模拟原生选文件
      try {
        var inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = '.json,application/json';
        inp.style.display = 'none';
        inp.addEventListener('change', function () {
          var f = inp.files && inp.files[0];
          if (!f) {
            w.__yxImportResult(JSON.stringify({ id: id, ok: false, error: 'cancelled' }));
            return;
          }
          var fr = new FileReader();
          fr.onload = function () {
            w.__yxImportResult(JSON.stringify({ id: id, ok: true, text: String(fr.result || ''), name: f.name }));
          };
          fr.onerror = function () {
            w.__yxImportResult(JSON.stringify({ id: id, ok: false, error: '读取失败' }));
          };
          fr.readAsText(f);
        });
        document.body.appendChild(inp);
        inp.click();
      } catch (e) {
        w.__yxImportResult(JSON.stringify({ id: id, ok: false, error: String(e && e.message || e) }));
      }
    }
  };

  // 视口变化时通知 App（真机上由原生负责横竖屏重排）
  w.addEventListener('resize', function () {
    try { if (w.App && App.applyUI) App.applyUI(); } catch (e) { }
  });
})(window);

</script>
